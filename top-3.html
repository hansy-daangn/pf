<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=1440"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>김한결 · 영상 디자이너 — 새로운 조합, 새로운 의미</title>
<meta name="description" content="퍼포먼스·캠페인 영상 디자이너 김한결. 수사학적으로 시선을 설계하고 코드·노드로 자동화합니다. 3D · 모션그래픽 · AI."/>
<meta property="og:title" content="김한결 · 영상 디자이너 — 새로운 조합, 새로운 의미"/>
<meta property="og:image" content="https://hansy-daangn.github.io/pf/assets/fig/top3_eyetrace.png"/>
<meta name="theme-color" content="#ffffff"/>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"/>
<style>
:root{
 --dark:#101013;--dark2:#17171b;--cream:#f4f4f5;--ink:#111114;
 --red:#a61c2f;--red2:#cc1433;--wine:#7f0036;--bdr:#ac1e25;
 --tlab:rgba(0,0,0,.56);--tblk:rgba(0,0,0,.9);--tbody:rgba(0,0,0,.95);
 --mut-c:#6d6d72;--mut-d:#9a9aa0;--faint-d:#6d6d72;
 --mag1:#cc1433;--mag2:#e0526d;--magink:#a61c2f;
 --grad:linear-gradient(105deg,#a61c2f,#cc1433);
 --hl-d:rgba(255,255,255,.14);--hl-l:rgba(17,17,20,.11);--line2:rgba(17,17,20,.14);
 --mono:"SFMono-Regular",ui-monospace,Menlo,"Roboto Mono",Consolas,monospace;
 --san:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
 --fs-table:clamp(11px,.85vw,14px);--maxw:1280px;--secpad:120px;--colgap:76px;--blockgap:112px;--sidepad:60px;--ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:#fff;color:var(--ink);font-family:var(--san);line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
/* 콘텐츠 보호: 선택·드래그·롱프레스 저장 차단 (편집 모드에선 해제) */
body:not(.editing){-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img,video{-webkit-user-drag:none}
@media print{body{display:none}}
::selection{background:var(--red2);color:#fff}
a{color:inherit;text-decoration:none}img,video{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;color:inherit}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--sidepad)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:2px}
.sec-dark :focus-visible,.sec-dark button:focus-visible,#lb :focus-visible{outline-color:#fff}

/* reveal */
.rv{opacity:0;transform:translateY(10px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1!important;transform:none!important;transition:none}html{scroll-behavior:auto}}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

section{position:relative}
.sec-light{background:#fff;color:var(--ink)}
.sec-dark{background:var(--dark);color:#fff;position:relative}
.sec-dark .wrap,.sec-light .wrap{position:relative;z-index:1}

/* ============ 스크롤 챕터 바 (반투명 블러) ============ */
#chapbar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;gap:14px;align-items:baseline;padding:12px clamp(18px,3.5vw,60px);transition:padding .35s var(--ease);background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(17,17,20,.08);transform:translateY(-100%);transition:transform .3s var(--ease),background .3s,border-color .3s}
#chapbar.on{transform:none}
#chapbar .pill{font-weight:700;font-size:clamp(15px,1.2vw,18px);color:var(--red2);white-space:nowrap;transition:font-size .35s var(--ease)}
#chapbar .tt{font-weight:700;font-size:clamp(15px,1.2vw,18px);color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:font-size .35s var(--ease)}
#chapbar.big{padding-top:20px;padding-bottom:20px}
#chapbar.big .pill{font-size:clamp(22px,1.9vw,30px)}
#chapbar.big .tt{font-size:clamp(22px,1.9vw,30px);font-weight:800}
#chapbar.swap .pill,#chapbar.swap .tt{animation:cbin .5s var(--ease)}
@keyframes cbin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#chapbar.dk{background:rgba(16,16,19,.6);border-bottom-color:rgba(255,255,255,.08)}
#chapbar.dk .tt{color:#fff}
@media(prefers-reduced-motion:reduce){#chapbar,#chapbar .pill,#chapbar .tt{transition:none;animation:none}#chapbar.big{padding-top:12px;padding-bottom:12px}#chapbar.big .pill,#chapbar.big .tt{font-size:clamp(15px,1.2vw,18px)}}

/* ============ 크기 조절 핸들 (편집 모드) ============ */
.editing .t3card,.editing .c2blk{position:relative}
.szh{position:absolute;top:0;bottom:0;width:16px;transform:translateX(-50%);cursor:col-resize;z-index:6;display:flex;align-items:center;justify-content:center;touch-action:none}
.szh::before{content:"";width:4px;border-radius:2px;height:min(72px,55%);background:var(--red2);opacity:.55}
.szh:hover::before,.szh.drag::before{opacity:1}
.gapctl{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--mut-d);margin-left:auto}
.gapctl input{accent-color:var(--red2);width:120px}

/* ============ 이력서 (#1, white) — 피그마 291:5 ============ */
.resume{position:relative;overflow:hidden;padding:calc(var(--secpad) * .55) 0 var(--secpad)}
.blob{position:absolute;top:max(-14vw,-160px);left:max(-11vw,-130px);width:clamp(320px,40vw,777px);aspect-ratio:1;pointer-events:none;user-select:none;z-index:0}
.rgrid{display:grid;grid-template-columns:var(--rc,.88fr 1fr);gap:var(--colgap);position:relative;z-index:1;align-items:start}
.rleft{min-width:0}
.idcard{display:flex;gap:clamp(20px,2.2vw,34px);align-items:center;max-width:672px}
.idphoto{flex:none;width:clamp(140px,15vw,226px);aspect-ratio:226/222;border-radius:21px;position:relative;overflow:hidden;background-color:var(--red);background-image:url(assets/img/profile.jpg?v=2);background-repeat:no-repeat;background-size:160%;background-position:43% 20%}
.editing .idphoto{outline:2px dashed var(--red2);outline-offset:3px;cursor:grab}
.editing .idphoto:active{cursor:grabbing}
.idrows{display:grid;grid-template-columns:3.4em 1fr;gap:0 clamp(12px,1.4vw,20px);font-weight:300;font-size:var(--fs-table);line-height:1.9;padding:0;min-width:0;flex:1}
.idrows .pr{display:contents}
.idrows .pr.off{display:none}
.editing .idrows .pr.off{display:contents}
.idrows .lb{color:var(--tlab);padding:7px 0;border-top:1px solid var(--line2)}
.idrows .vl{color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:7px 0;border-top:1px solid var(--line2)}
.idrows .pr:first-child .lb,.idrows .pr:first-child .vl{border-top:0}
.tagline{margin:clamp(26px,5vh,50px) 0 0}
.tagline .tg{font-weight:800;font-size:clamp(19px,1.8vw,30px);line-height:1.6;letter-spacing:-.01em;color:var(--ink)}
.tagline .ds{font-weight:400;font-size:clamp(12.5px,1.05vw,15.5px);line-height:1.75;color:#000;margin-top:8px}
/* 챕터 목차 — 플랫, 기능(앵커) 그 자체 */
.chprev{margin-top:clamp(26px,5vh,48px);max-width:660px;margin-left:auto;margin-right:auto}
.chprev a{display:grid;grid-template-columns:clamp(88px,8vw,112px) 1fr;gap:clamp(12px,1.6vw,24px);align-items:baseline;padding:14px 2px;border-top:1px solid var(--line2)}
.chprev a:last-child{border-bottom:1px solid var(--line2)}
.chprev .pill{font-weight:700;font-size:clamp(12.5px,1vw,15px);color:var(--red2);white-space:nowrap}
.chprev .tt{font-weight:700;font-size:clamp(14px,1.2vw,18px);line-height:1.3}
.chprev .ss{font-weight:300;font-size:clamp(12px,1vw,14.5px);line-height:1.5;margin-top:3px;color:var(--tlab)}
.chprev a:hover .tt{color:var(--red2)}

/* 이력서 우측 표 (학력/경력/기술/수상) — 행 단위 그리드로 항상 정렬, 스크롤 없음 */
.rright{display:flex;flex-direction:column;gap:clamp(18px,2.6vh,28px);min-width:0}
.rsec h3{font-weight:200;font-size:clamp(22px,1.8vw,32px);color:var(--tblk);line-height:1.2;margin-bottom:8px;display:flex;align-items:center;gap:clamp(10px,1vw,18px)}
.rsec .ics{display:flex;gap:7px;align-items:center}
.rsec .ics img{width:clamp(18px,1.4vw,25px);height:auto}
.tgrid{display:grid;gap:2px clamp(16px,2.4vw,46px);font-weight:300;font-size:var(--fs-table);line-height:1.9;color:var(--tbody)}
.tgrid .tr{display:contents}
.tgrid.edu{grid-template-columns:max-content 1fr max-content}
.tgrid.car{grid-template-columns:max-content max-content max-content 1fr}
.awgrid{display:grid;grid-template-columns:6em 5.4em minmax(0,1fr) 3.5em 5.4em 10.2em;gap:3px clamp(8px,.85vw,15px);font-weight:300;font-size:var(--fs-table);line-height:1.75;color:var(--tbody);font-variant-numeric:tabular-nums}
.awgrid .tr{display:contents}
.skg p{font-weight:300;font-size:clamp(12px,.95vw,15.5px);line-height:1.9;color:var(--tbody);margin:0}

/* ============ 실험 · 연구 카드: 이미지 + 텍스트 플랫 행 ============ */
.hcards{display:flex;flex-direction:column;flex:1;justify-content:space-between}
.hcard{display:grid;grid-template-columns:clamp(180px,19vw,320px) 1fr;gap:clamp(16px,2vw,34px);padding:clamp(18px,2.8vh,34px) 2px;border-top:1px solid var(--line2);align-items:center;flex:1}
.hcard:last-child{border-bottom:1px solid var(--line2)}
.hcard .im{aspect-ratio:4/3;overflow:hidden;border-radius:12px;background:#000}
.hcard .im img{width:100%;height:100%;object-fit:cover}
.hcard .t{font-weight:700;font-size:clamp(14px,1.2vw,18px);line-height:1.4}
.hcard .q{font-weight:300;font-size:clamp(12.5px,1vw,15px);line-height:1.5;color:var(--tlab);margin-top:3px}
.hcard .mt{margin-top:9px;font-weight:400;font-size:clamp(10.5px,.85vw,12.5px);line-height:1.55;color:var(--tlab)}
.hcard .mt b{font-weight:700;color:var(--ink);margin-right:7px}

/* ============ C1 — 주요 작품 (dark) ============ */
.c1{padding:0 0 var(--secpad)}
.t3card{display:grid;grid-template-columns:var(--c1c,2fr 1fr);gap:var(--colgap);align-items:start;padding:var(--blockgap) 0 0}
.t3txt{min-width:0}
.t3media{position:relative;overflow:hidden;background:#000;cursor:pointer}
.t3media img{width:100%;height:100%;object-fit:cover}
.t3media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.t3media iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.t3media.playing img,.t3media.playing .play{display:none}
.t3media .play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.t3media .play span{width:60px;height:60px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.5);display:grid;place-items:center;color:#fff;font-size:18px;padding-left:3px;transition:.25s}
.t3media:hover .play span{background:var(--red2);border-color:transparent;transform:scale(1.06)}
.pills{display:flex;gap:9px;flex-wrap:wrap}
.pills span{border:.75px solid #fff;border-radius:22.5px;padding:2.5px 9px;font-weight:700;font-size:clamp(11px,.85vw,13px);color:#fff;line-height:1.2}
.t3title{font-weight:800;font-size:clamp(21px,1.8vw,32px);line-height:1.25;margin-top:12px}
.t3desc{font-weight:200;font-size:clamp(13.5px,1vw,16.5px);line-height:2;margin-top:12px;color:#fff}
.t3meta{margin-top:16px;display:grid;grid-template-columns:5.5em 1fr;gap:2px clamp(8px,.8vw,14px);font-size:clamp(12px,.9vw,14.5px);line-height:1.9}
.t3meta dt{font-weight:200;color:rgba(255,255,255,.62);white-space:nowrap}
.t3meta dd{font-weight:200;color:#fff}

/* ============ C2 — 작업 효율화 (dark, 원본 이미지·움짤) ============ */
.c2{padding:0 0 var(--secpad)}
.c2blk{display:grid;grid-template-columns:var(--c2c,2fr 1fr);gap:var(--colgap);align-items:start;padding:var(--blockgap) 0 0}
.c2txt{min-width:0}
.figv{min-width:0}
.figv img,.figv video{display:block;width:100%;height:auto}
.frow{display:flex}
.fcol{display:flex;flex-direction:column;min-width:0}
.fslot{position:relative;overflow:hidden}
.fslot video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.c2txt .t{font-weight:800;font-size:clamp(21px,1.8vw,32px);line-height:1.25;margin-top:12px}
.c2txt .d{font-weight:200;font-size:clamp(13.5px,1vw,16.5px);line-height:2;margin-top:12px;color:#fff}
.bub{margin-top:24px;border-top:1px solid var(--lined,rgba(255,255,255,.08));padding-top:16px}
.bub .row{display:grid;grid-template-columns:5.5em 1fr;gap:2px clamp(8px,.8vw,14px);margin:0 0 12px}
.bub .row:last-child{margin-bottom:0}
.bub .fl{color:rgba(255,255,255,.62)}
.bub .a{font-weight:200;font-size:clamp(12px,.9vw,14.5px);line-height:1.9;color:#fff}
.bub .b{font-weight:200;font-size:clamp(11.5px,.85vw,13.5px);line-height:1.75;color:rgba(255,255,255,.72)}
.bub .fl .a,.bub .fl .b{color:rgba(255,255,255,.62)}

/* ============ 도구 · 연구 (light — 좌: 도구 개발 / 우: 실험·연구) ============ */
.lab{padding:0 0 var(--secpad)}
.labgrid{display:grid;grid-template-columns:var(--lc,1.15fr 1fr);gap:var(--colgap);align-items:stretch;position:relative}
.labcol{min-width:0}
.labcolB{display:flex;flex-direction:column}
.labh{font-weight:200;font-size:clamp(22px,1.8vw,32px);color:var(--tblk);line-height:1.2}
.labsub{margin-top:4px;font-weight:300;font-size:clamp(12px,1vw,14.5px);color:var(--tlab)}
.labitem{padding-top:clamp(18px,2.6vh,28px);margin-top:clamp(18px,2.6vh,28px);border-top:1px solid var(--line2)}
.labitem .tag{font-weight:700;font-size:clamp(12.5px,1vw,15px);color:var(--red2);line-height:1.5}
.labitem h3{margin-top:4px;font-weight:700;font-size:clamp(14px,1.2vw,18px);line-height:1.4;color:var(--ink)}
.labitem p{margin-top:7px;font-weight:300;font-size:clamp(12.5px,1vw,15px);line-height:1.85;color:var(--tbody);max-width:72ch}
.labitem .tools{margin-top:7px;font-weight:300;font-size:clamp(10.5px,.85vw,12.5px);color:var(--tlab)}
.labfigs{margin-top:14px;display:flex;gap:12px;flex-wrap:wrap}
.labfigs figure{flex:1 1 260px;min-width:0;margin:0}
.labfigs img{width:100%;height:auto;display:block;border:1px solid var(--line2);border-radius:12px;background:#fff}
.labfigs figcaption{margin-top:6px;font-weight:300;font-size:clamp(10.5px,.85vw,12.5px);color:var(--tlab)}
.labcol .hcards{margin-top:clamp(14px,2vh,22px)}

/* ============ ARCHIVE (dark) ============ */
.archive{padding:0 0 var(--secpad)}
.afil{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}
.afil button{font-family:var(--mono);font-size:12px;border:1px solid var(--hl-d);background:transparent;color:var(--mut-d);padding:8px 15px;border-radius:100px;font-weight:600;letter-spacing:.03em;transition:.2s}
.afil button.on{background:#fff;color:var(--dark);border-color:#fff}
.afil button:hover:not(.on){color:#fff;border-color:var(--mut-d)}
.chin{padding:var(--secpad) 0 0;display:flex;align-items:baseline;gap:clamp(12px,1.2vw,20px);flex-wrap:wrap}
.chin .lb{font-weight:700;font-size:clamp(13px,1vw,15px);color:var(--red2);white-space:nowrap}
.sec-dark .chin .lb{color:var(--mag2)}
.chin .tt{font-weight:800;font-size:clamp(20px,1.7vw,28px);line-height:1.3}
.chin .ss{font-weight:200;font-size:clamp(12.5px,1vw,15px);color:var(--tlab)}
.sec-dark .chin .ss{color:rgba(255,255,255,.6)}
.chin+*{margin-top:calc(var(--blockgap) * .34)}
.c1 .chin+.t3card,.c2 .chin+.c2blk{padding-top:0}
.featgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--agap,12px);margin-bottom:var(--agap,12px)}
.featgrid .acard{break-inside:auto}
.featgrid .acard .media{aspect-ratio:16/9!important}
.agrid{columns:4;column-gap:var(--agap,12px)}
.acard{break-inside:avoid;margin-bottom:var(--agap,12px);border-radius:12px;overflow:hidden;border:1px solid var(--hl-d);background:var(--dark2);cursor:pointer;position:relative;transition:transform .4s var(--ease),border-color .3s}
.acard:hover{transform:translateY(-4px);border-color:var(--mag1)}
.media{position:relative;overflow:hidden;background:#17171b}
.media>img{width:100%;height:100%;object-fit:cover;display:block}
.media>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.media.playing>video{opacity:1}
/* 갤러리: 순수 미디어 + 호버 시 제목·역할 오버레이 (하단 좌측) */
.acard .hov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:12px 13px;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.78));opacity:0;transition:opacity .25s;z-index:2;pointer-events:none}
.acard:hover .hov,.acard:focus-visible .hov{opacity:1}
.editing .acard .hov{opacity:1;pointer-events:auto}
.acard .hov .ti{font-weight:700;font-size:13.5px;color:#fff;line-height:1.35;text-align:left}
.acard .hov .rl{font-weight:300;font-size:11px;color:rgba(255,255,255,.75);margin-top:2px}
.acard.offcard{opacity:.3}
.acard.noact{cursor:default}
.acard.noact:hover{transform:none;border-color:var(--hl-d)}
.ordbtns{position:absolute;top:8px;left:8px;z-index:3;display:flex;gap:4px}
.ob{width:26px;height:26px;border-radius:50%;background:rgba(13,13,15,.82);border:1px solid var(--hl-d);color:#fff;font-size:14px;line-height:1;display:grid;place-items:center;padding:0}
.ob:hover{background:var(--red2);border-color:transparent}
.grouptag{position:absolute;top:8px;right:8px;background:rgba(13,13,15,.72);border:1px solid var(--hl-d);border-radius:100px;padding:3px 8px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:#fff;z-index:1;font-weight:600}

/* ============ FOOTER (minimal) ============ */
footer{background:var(--dark);color:rgba(255,255,255,.6);padding:30px 0 56px;text-align:center;font-weight:200;font-size:13.5px}
footer a{color:#fff;font-weight:400}
footer a:hover{color:var(--mag2)}

/* ============ LIGHTBOX (dark, high-q + sound) ============ */
#lb{position:fixed;inset:0;z-index:80;background:var(--dark);display:none;align-items:flex-start;justify-content:center;padding:28px;overflow:auto}
#lb.on{display:flex}
#lb .bx{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:30px;max-width:1180px;width:100%;align-items:start}
#lb .lb-media{display:flex;flex-direction:column;gap:12px;min-width:0}
#lb .lb-stage{display:flex;align-items:center;justify-content:center;min-width:0}
#lb .lb-stage video,#lb .lb-stage img{width:auto;max-width:100%;max-height:78vh;border-radius:12px;border:1px solid var(--hl-d);background:#000;object-fit:contain}

/* ---- edits (content.json = single source of truth) ---- */
let EDITS={};
async function loadEdits(){
  try{localStorage.removeItem("pf_edits");}catch(e){}
  try{const r=await fetch("content.json?"+Date.now());if(r.ok)EDITS=await r.json();}catch(e){}
}
/* ---- 크기 조절 시스템: CSS 변수 ← EDITS(sz.*) ---- */
/* 주요 작품(C1)·작업 효율화(C2)는 같은 키(sz.cc)를 공유 — 어느 쪽을 드래그해도 동시 반영 */
const SIZERS=[
 {key:"sz.rc",sel:".rgrid",  cssVar:"--rc", min:.5,max:1.8,dflt:.88},
 {key:"sz.lc",sel:".labgrid",cssVar:"--lc", min:.5,max:2.2,dflt:1.15},
 {key:"sz.cc",sel:".t3card", cssVar:"--c1c",min:1, max:4,  dflt:2},
 {key:"sz.cc",sel:".c2blk",  cssVar:"--c2c",min:1, max:4,  dflt:2}
];
const SPACES=[
 {k:"maxw",dflt:1280},{k:"sidepad",dflt:60},{k:"secpad",dflt:120},
 {k:"colgap",dflt:76},{k:"blockgap",dflt:112},{k:"agap",dflt:12}
];
function spaceVal(s){const v=parseFloat(EDITS["sz."+s.k]);return isNaN(v)?s.dflt:v;}
function applySizes(){const rt=document.documentElement.style;
  SIZERS.forEach(c=>{const v=parseFloat(EDITS[c.key]);rt.setProperty(c.cssVar,(isNaN(v)?c.dflt:v)+"fr 1fr");});
  SPACES.forEach(s=>rt.setProperty("--"+s.k,spaceVal(s)+"px"));}
let FS_KEY=null;
function fsApplyAll(){
  for(const k in EDITS){if(k.indexOf("fs.")!==0)continue;const key=k.slice(3),v=EDITS[k];
    document.querySelectorAll('[data-k="'+CSS.escape(key)+'"]').forEach(el=>{el.style.fontSize=v?v+"px":"";});}}
function fsSelect(el){
  document.querySelectorAll(".fs-sel").forEach(x=>x.classList.remove("fs-sel"));
  const p=document.getElementById("fsPanel");
  if(!el){FS_KEY=null;p.classList.remove("on");return;}
  FS_KEY=el.dataset.k;el.classList.add("fs-sel");p.classList.add("on");
  document.getElementById("fsName").textContent=(el.textContent||"글자").slice(0,14);
  fsShow(el);}
function fsCur(){return FS_KEY?document.querySelector('[data-k="'+CSS.escape(FS_KEY)+'"]'):null;}
function fsShow(el){const v=Math.round(parseFloat(getComputedStyle(el).fontSize)||0);
  document.getElementById("fsVal").textContent=v+"px";}
function fsNudge(d){const el=fsCur();if(!el)return;
  const cur=Math.round(parseFloat(getComputedStyle(el).fontSize)||14),nx=Math.max(8,Math.min(80,cur+d));
  EDITS["fs."+FS_KEY]=String(nx);fsApplyAll();fsShow(el);}
function bindFsPanel(){
  const up=document.getElementById("fsUp"),dn=document.getElementById("fsDn"),rs=document.getElementById("fsRs");
  if(!up)return;
  up.onclick=()=>fsNudge(1);dn.onclick=()=>fsNudge(-1);
  rs.onclick=()=>{if(!FS_KEY)return;delete EDITS["fs."+FS_KEY];
    document.querySelectorAll('[data-k="'+CSS.escape(FS_KEY)+'"]').forEach(el=>{el.style.fontSize="";});
    const el=fsCur();if(el)fsShow(el);};}
function bindSzPanel(){
  SPACES.forEach(s=>{
    const r=document.getElementById("szr-"+s.k),o=document.getElementById("szv-"+s.k);
    if(!r||!o)return;
    const show=v=>{o.textContent=v+"px";};
    r.value=spaceVal(s);show(r.value);
    r.oninput=()=>{EDITS["sz."+s.k]=r.value;show(r.value);document.documentElement.style.setProperty("--"+s.k,r.value+"px");};
  });
  const rs=document.getElementById("szReset");
  if(rs)rs.onclick=()=>{SPACES.forEach(s=>{delete EDITS["sz."+s.k];});applySizes();bindSzPanel();};}
function applyEdits(){
  for(const k in EDITS){
    if(k.indexOf("sz.")===0||k.indexOf("fs.")===0)continue;
    if(k.indexOf("photo.")===0){const f=document.querySelector(".idphoto");if(f&&EDITS[k]!=null){const p=k.slice(6);
      if(p==="bs")f.style.backgroundSize=EDITS[k];else if(p==="bx")f.style.backgroundPositionX=EDITS[k];else if(p==="by")f.style.backgroundPositionY=EDITS[k];}continue;}
    if(EDITS[k]!=null)document.querySelectorAll('[data-k="'+CSS.escape(k)+'"]').forEach(el=>{el.textContent=EDITS[k];});
  }
  applySizes();bindSzPanel();bindFsPanel();fsApplyAll();
  /* 신상 행: 값이 비면 숨김 (편집 모드에선 모두 표시) */
  document.querySelectorAll(".idrows .pr").forEach(p=>{const v=p.querySelector(".vl");p.classList.toggle("off",!(v&&v.textContent.trim()));});
}
/* ---- 편집 모드: 컬럼 경계 드래그 핸들 ---- */
function mountSizers(){
  if(!editing)return;
  const posOf=c=>{const v=parseFloat(EDITS[c.key]);return (isNaN(v)?c.dflt:v);};
  SIZERS.forEach(cf=>{document.querySelectorAll(cf.sel).forEach(el=>{
    const h=document.createElement("div");h.className="szh";h.dataset.sz=cf.key;h.title="드래그로 좌우 너비 조절";
    const setLeft=()=>{const v=posOf(cf);h.style.left=(v/(v+1)*100)+"%";};
    setLeft();el.appendChild(h);
    h.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();try{h.setPointerCapture(e.pointerId);}catch(_){}h.classList.add("drag");
      const r=el.getBoundingClientRect();
      const move=ev=>{let p=(ev.clientX-r.left)/r.width;p=Math.min(.85,Math.max(.15,p));
        let v=p/(1-p);v=Math.min(cf.max,Math.max(cf.min,v));
        EDITS[cf.key]=String(Math.round(v*100)/100);applySizes();
        document.querySelectorAll('.szh[data-sz="'+cf.key+'"]').forEach(x=>{const vv=posOf(cf);x.style.left=(vv/(vv+1)*100)+"%";});};
      const up=ev=>{try{h.releasePointerCapture(ev.pointerId);}catch(_){}h.classList.remove("drag");h.removeEventListener("pointermove",move);h.removeEventListener("pointerup",up);h.removeEventListener("pointercancel",up);};
      h.addEventListener("pointermove",move);h.addEventListener("pointerup",up);h.addEventListener("pointercancel",up);});
  });});
  const gr=document.getElementById("gapRange");
  if(gr){const g=parseFloat(EDITS["sz.agap"]);gr.value=isNaN(g)?12:g;
    gr.addEventListener("input",()=>{EDITS["sz.agap"]=String(gr.value);applySizes();});
    gr.addEventListener("click",e=>e.stopPropagation());}
}
/* ---- 편집 모드: 사진 위치(드래그)·확대(휠) ---- */
function mountPhotoAdjust(){
  const f=document.querySelector(".idphoto");if(!f)return;
  const num=(s,d)=>{const m=parseFloat(s);return isNaN(m)?d:m;};
  let drag=false,sx,sy,bx0,by0;
  f.addEventListener("pointerdown",e=>{if(!editing)return;e.preventDefault();drag=true;sx=e.clientX;sy=e.clientY;
    bx0=num(f.style.backgroundPositionX||"43%",43);by0=num(f.style.backgroundPositionY||"20%",20);
    try{f.setPointerCapture(e.pointerId);}catch(_){}});
  f.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;
    const bx=Math.max(-60,Math.min(160,bx0-dx*0.22)),by=Math.max(-60,Math.min(160,by0-dy*0.22));
    f.style.backgroundPositionX=bx+"%";f.style.backgroundPositionY=by+"%";
    EDITS["photo.bx"]=bx+"%";EDITS["photo.by"]=by+"%";});
  const end=()=>drag=false;f.addEventListener("pointerup",end);f.addEventListener("pointercancel",end);
  f.addEventListener("wheel",e=>{if(!editing)return;e.preventDefault();
    let s=num(f.style.backgroundSize||"160%",160);s=Math.min(360,Math.max(100,s-e.deltaY*0.09));
    f.style.backgroundSize=s+"%";EDITS["photo.bs"]=s+"%";},{passive:false});
}

/* ---- preview (silent, first 8s loop) ---- */
const RMOTION=matchMedia("(prefers-reduced-motion: reduce)").matches;
const PREVIEW_RANGE=[0,10];
function attachRangeLoop(v){if(v._rangeBound)return;v._rangeBound=true;const[ra,rb]=PREVIEW_RANGE;v.addEventListener("timeupdate",()=>{if(v.currentTime>=rb){try{v.currentTime=ra;}catch(_){}}});}
const MAXPREV=()=>innerWidth<700?2:5;
function playingCount(){return document.querySelectorAll(".media.playing").length;}
function stopT3(){document.querySelectorAll(".t3media.playing").forEach(el=>{const f=el.querySelector("iframe");if(f)f.remove();el.classList.remove("playing");});}
function pauseAllPreviews(){document.querySelectorAll(".acard video").forEach(v=>v.pause());document.querySelectorAll(".media.playing").forEach(m=>m.classList.remove("playing"));stopT3();}
function resumeVisiblePreviews(){if(RMOTION)return;document.querySelectorAll(".acard").forEach(c=>{if(c.style.display==="none")return;if(playingCount()>=MAXPREV())return;const r=c.getBoundingClientRect();if(r.top<innerHeight+90&&r.bottom>-90){const v=c.querySelector("video"),m=c.querySelector(".media");if(!v||m.classList.contains("playing"))return;if(!v.src&&v.dataset.src)v.src=v.dataset.src;attachRangeLoop(v);v.play().then(()=>m&&m.classList.add("playing")).catch(()=>{});}});}

const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector("video"),m=e.target.querySelector(".media");if(!v)return;if(e.isIntersecting&&!lbOpen&&!editing&&!RMOTION){if(m.classList.contains("playing")||playingCount()>=MAXPREV())return;if(!v.src&&v.dataset.src)v.src=v.dataset.src;attachRangeLoop(v);v.play().then(()=>m&&m.classList.add("playing")).catch(()=>{});}else{v.pause();if(m)m.classList.remove("playing");}}),{rootMargin:"90px 0px",threshold:.25});
const revO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");revO.unobserve(e.target);}}),{rootMargin:"0px 0px -8% 0px",threshold:.06});
function render(){
  document.getElementById("main").innerHTML=resumeHTML()+c1HTML()+c2HTML()+archiveHTML()+labHTML()+footHTML();
  applyEdits();
  mountSizers();mountPhotoAdjust();
  if(RMOTION)document.querySelectorAll(".figvid").forEach(v=>{v.removeAttribute("autoplay");try{v.pause();}catch(_){}});
  document.querySelectorAll(".acard").forEach(c=>io.observe(c));
  document.querySelectorAll(".rv").forEach(el=>revO.observe(el));
  document.querySelectorAll(".t3media:not(.t3loc)").forEach(el=>{const go=()=>{if(editing||el.classList.contains("playing"))return;stopT3();const yt=el.dataset.yt;el.insertAdjacentHTML("beforeend",`<iframe src="https://www.youtube.com/embed/${yt}?autoplay=1&rel=0&playsinline=1" title="영상 재생" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`);el.classList.add("playing");};el.addEventListener("click",go);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});});
  document.querySelectorAll(".t3media.t3loc").forEach(el=>{const go=()=>{if(editing)return;openLB(el.dataset.id);};el.addEventListener("click",go);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});});
  document.querySelectorAll(".acard[data-id]").forEach(el=>{
    if(!editing&&el.classList.contains("noact"))return;
    const act=()=>{editing?openManage(findWork(el.dataset.id)):openLB(el.dataset.id);};el.addEventListener("click",act);el.addEventListener("keydown",e=>{if(editing&&e.target.closest("[data-k]"))return;if(e.key==="Enter"||e.key===" "){e.preventDefault();act();}});});
  document.querySelectorAll(".acard [data-k]").forEach(el=>el.addEventListener("click",e=>{if(editing)e.stopPropagation();}));
  document.querySelectorAll("[data-k]").forEach(el=>el.addEventListener("click",()=>{if(editing)fsSelect(el);}));
  document.querySelectorAll(".acard .ob").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();moveWork(b.closest(".acard").dataset.id,+b.dataset.mv);}));
  const g=document.querySelector(".agrid");
  const applyFilter=()=>{document.querySelectorAll("#afil button").forEach(x=>{x.classList.toggle("on",x.dataset.f===FILTER);x.setAttribute("aria-pressed",String(x.dataset.f===FILTER));});document.querySelectorAll("#archive .acard").forEach(c=>c.style.display=(FILTER==="all"||c.dataset.cat===FILTER)?"":"none");};
  document.querySelectorAll("#afil button").forEach(b=>b.onclick=()=>{FILTER=b.dataset.f;applyFilter();});
  applyFilter();
}

function addAssetsToWork(w,assets){
  if(w.u){const arr=getJSON("works.add",[]),e=arr.find(x=>x.id===w.id);if(!e)return;e.assets=e.assets||[];
    const have=new Set(e.assets.map(a=>a.url));assets.forEach(a=>{if(!have.has(a.url)){e.assets.push({res:a.res,type:a.type,url:a.url});have.add(a.url);}});
    const offU=new Set(getJSON("w."+w.id+".off",[]));e.pv=computePV(e.assets.filter(a=>!offU.has(a.url)));setJSON("works.add",arr);}
  else{const x=getJSON("w."+w.id+".xadd",[]),have=new Set(x.map(a=>a.url).concat(baseGallery(w).map(m=>m.url).filter(Boolean)));
    assets.forEach(a=>{if(!have.has(a.url)){x.push({res:a.res,type:a.type,url:a.url});have.add(a.url);}});setJSON("w."+w.id+".xadd",x);}
  const o=getJSON("w."+w.id+".off",[]),o2=o.filter(k=>!assets.some(a=>a.url===k));if(o2.length!==o.length)setJSON("w."+w.id+".off",o2);}
async function mirrorCdn(url){
  if(isLocal(url))return url;
  try{
    const name=url.split("/").pop().split("?")[0],path="assets/cdn/"+name;
    const head=await fetch(path,{method:"HEAD"});if(head.ok)return path;
    const pat=getPAT();if(!pat)return url;
    const res=await fetch(url);if(!res.ok)return url;
    const buf=await res.arrayBuffer();if(buf.byteLength>25*1024*1024)return url;
    let bin="";const bytes=new Uint8Array(buf),CH=32768;
    for(let i=0;i<bytes.length;i+=CH)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
    await ghPut(path,btoa(bin),"asset: "+name,pat);
    return path;
  }catch(e){return url;}}
async function mirrorAssets(assets){
  const hint=document.getElementById("mgHint"),out=[];
  for(let i=0;i<assets.length;i++){
    if(hint)hint.textContent="소재 파일을 저장소로 복사 중… ("+(i+1)+"/"+assets.length+") — 광고차단기에서도 보이게 하는 과정이에요";
    out.push(Object.assign({},assets[i],{url:await mirrorCdn(assets[i].url)}));}
  if(hint)hint.textContent="";
  return out;}
function pkgAdded(c){if(!mgWork)return false;const keys=new Set(candidateGallery(mgWork).map(m=>m.key));return c.assets.length&&c.assets.every(a=>keys.has(a.url));}
function goLabel(c){return mgMode==="pick"?"새 그룹":(pkgAdded(c)?"✓ 추가됨":"＋ 전체");}
function renderMgCat(q){const wrap=document.getElementById("mgCat"),cat=CATALOG||[],qq=(q||"").trim().toLowerCase();
  const list=(qq?cat.filter(c=>c.base.toLowerCase().includes(qq)||(c.cat||"").includes(qq)):cat).slice(0,60);
  wrap.innerHTML=list.length?list.map(c=>`<div class="mg-row" data-i="${cat.indexOf(c)}"><div class="mg-rowh"><span class="nm">${esc(prettyBase(c.base))}</span><span class="meta">${esc(c.cat)} · ▶${c.nv} ■${c.ni} · ₩${big(c.perf.cost)}</span><span class="go${pkgAdded(c)?" added":""}">${goLabel(c)}</span></div><div class="mg-assets"></div></div>`).join(""):'<span style="font-size:12px;color:var(--faint-d)">검색 결과가 없어요.</span>';
  wrap.querySelectorAll(".mg-row").forEach(row=>{const c=cat[+row.dataset.i];
    row.querySelector(".mg-rowh").onclick=e=>{
      if(e.target.classList.contains("go")){if(mgMode==="pick")createGroup(c);else{mirrorAssets(c.assets).then(ms=>{addAssetsToWork(mgWork,ms);renderMgCur();renderMgCat(document.getElementById("mgSearch").value);});}return;}
      row.classList.toggle("open");const box=row.querySelector(".mg-assets");
      if(row.classList.contains("open")&&!box.dataset.done){box.dataset.done="1";
        box.innerHTML=c.assets.map(a=>mgTile(cdnItem(a),false,"+")).join("");
        box.querySelectorAll(".mg-tile").forEach((t,j)=>t.onclick=ev=>{ev.stopPropagation();
          if(mgMode==="pick"){createGroup(c,[c.assets[j]]);return;}mirrorAssets([c.assets[j]]).then(ms=>{addAssetsToWork(mgWork,ms);renderMgCur();t.querySelector(".chk").textContent="✓";});});}};});}
async function createGroup(pkg,onlyAssets){const assets=(await mirrorAssets(onlyAssets||pkg.assets)).map(a=>({res:a.res,type:a.type,url:a.url}));
  const id=slug(pkg.base)+"_"+Math.abs(hashStr(pkg.base+assets.length)).toString(36).slice(0,4);
  const w={id,u:true,cat:guessFmt(pkg),title:prettyBase(pkg.base),role:"퍼포먼스 소재",year:"",campaign:pkg.base,desc:"",assets,perf:pkg.perf,pv:computePV(assets)};
  const arr=getJSON("works.add",[]);if(!arr.find(x=>x.id===w.id))arr.push(w);setJSON("works.add",arr);openManage(findWork(id));}
async function openManage(w){mgWork=w;mgMode=w?"manage":"pick";
  const nameEl=document.getElementById("mgName"),hint=document.getElementById("mgHint");
  const wt=w?(EDITS["w."+w.id+".title"]||w.title||""):"";
  document.getElementById("mgTitle").textContent=!w?"새 작업 추가":(w.u?"소재 관리":"소재 관리 — "+wt);
  document.getElementById("mgCurSec").style.display=w?"":"none";
  document.getElementById("mgUpSec").style.display=w?"none":"";
  document.getElementById("mgCatSec").style.display=(w&&w.st)?"none":"";
  const hd=document.getElementById("mgHide");
  if(w){hd.style.display="";const off=hiddenSet().has(w.id);hd.textContent=off?"이 작업 다시 보이기":"이 작업 숨기기";
    hd.onclick=()=>{const h=getJSON("works.hide",[]),i=h.indexOf(w.id);if(i<0)h.push(w.id);else h.splice(i,1);setJSON("works.hide",h);closeManage();};}
  else hd.style.display="none";
  document.getElementById("mgAddLbl").textContent=w?"CreativeReporter에서 소재 추가":"CreativeReporter 패키지에서 만들기";
  if(!w){hint.style.display="";hint.textContent="위에서 파일을 직접 올리거나, 아래 CreativeReporter 목록에서 패키지를 골라 카드를 만들 수 있어요.";
    ["upTitle","upRole","upDesc","upFile","upPoster"].forEach(id=>{document.getElementById(id).value="";});
    document.getElementById("upMsg").textContent="";document.getElementById("upPosterRow").style.display="";document.getElementById("upGo").disabled=false;}
  else hint.style.display="none";
  const bind=(el,key)=>{if(!w){el.style.display="none";return;}el.style.display="";
    el.value=w.u?(w[key]||""):(EDITS["w."+w.id+"."+key]!=null?EDITS["w."+w.id+"."+key]:(w[key]||""));
    el.oninput=()=>{if(w.u){const arr=getJSON("works.add",[]),e=arr.find(x=>x.id===w.id);if(e){e[key]=el.value;setJSON("works.add",arr);w[key]=el.value;}}
      else{EDITS["w."+w.id+"."+key]=el.value;document.querySelectorAll('[data-k="w.'+w.id+'.'+key+'"]').forEach(n=>{n.textContent=el.value;});}};};
  bind(nameEl,"title");bind(document.getElementById("mgRole"),"role");bind(document.getElementById("mgDesc"),"desc");
  const cats=document.getElementById("mgCats"),del=document.getElementById("mgDel");
  if(w&&w.u){cats.style.display="flex";del.style.display="";
    cats.innerHTML=[["motion","모션그래픽"],["3d","3D"],["ai","AI"],["style","스타일"]].map(c=>`<button data-c="${c[0]}" class="${w.cat===c[0]?"on":""}">${c[1]}</button>`).join("");
    cats.querySelectorAll("button").forEach(b=>b.onclick=()=>{const arr=getJSON("works.add",[]),e=arr.find(x=>x.id===w.id);if(e){e.cat=b.dataset.c;setJSON("works.add",arr);w.cat=b.dataset.c;}cats.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");});
    del.onclick=()=>{if(!confirm("이 그룹을 삭제할까요?"))return;setJSON("works.add",getJSON("works.add",[]).filter(x=>x.id!==w.id));closeManage();};}
  else{cats.style.display="none";del.style.display="none";}
  renderMgCur();
  const searchEl=document.getElementById("mgSearch");searchEl.value="";
  document.getElementById("mgCat").innerHTML='<span style="font-size:12px;color:var(--faint-d)">불러오는 중…</span>';
  mg.classList.add("on");document.body.style.overflow="hidden";
  const body=mg.querySelector(".mg-body");if(body)body.scrollTop=0;
  await loadCatalog();
  if(!CATALOG||!CATALOG.length){document.getElementById("mgCat").innerHTML='<span style="font-size:12px;color:#c0392b">카탈로그를 불러오지 못했어요. 새로고침 후 다시 시도하세요.</span>';return;}
  renderMgCat("");}
function closeManage(){mg.classList.remove("on");document.body.style.overflow="";mgWork=null;rerender();}
document.getElementById("mgX").onclick=closeManage;
mg.onclick=e=>{if(e.target===mg)closeManage();};

/* ---- edit mode ---- */
let editing=false;
const fab=document.getElementById("editFab");
function rerender(){
  /* 재렌더 전 미저장 편집을 EDITS에 스테이징 (모달 열고닫기로 편집이 날아가지 않게) */
  if(editing){const E={};document.querySelectorAll("[data-k]").forEach(el=>{E[el.dataset.k]=el.textContent.replace(/\s+$/,"");});Object.assign(EDITS,E);}
  render();
  if(editing){document.body.classList.add("editing");document.querySelectorAll("[data-k]").forEach(el=>el.contentEditable=true);}}
fab.onclick=()=>{editing=!editing;document.body.classList.toggle("editing",editing);fab.classList.toggle("on",editing);fab.textContent=editing?"✔":"✎";document.getElementById("editHint").classList.toggle("on",editing);
  if(editing){pauseAllPreviews();rerender();}
  else{fsSelect(null);saveEdits().finally(()=>{render();resumeVisiblePreviews();});}
};
/* ---- GitHub 저장 (Fine-grained PAT, contents API) ---- */
function getPAT(){let pat=localStorage.getItem("pf_pat");
  if(!pat){pat=prompt("GitHub에 저장하려면 토큰을 입력하세요.\n(github.com → Settings → Developer settings → Fine-grained token, 저장소 hansy-daangn/pf 의 Contents: Read and write)\n비워두면 저장되지 않고 변경 내용은 사라집니다.");if(pat)localStorage.setItem("pf_pat",pat);}
  return pat;}
async function ghPut(path,b64,msg,pat){
  const api="https://api.github.com/repos/hansy-daangn/pf/contents/"+path;
  let sha=null;const g=await fetch(api,{headers:{Authorization:"Bearer "+pat}});if(g.ok)sha=(await g.json()).sha;
  const body={message:msg,content:b64};if(sha)body.sha=sha;
  const r=await fetch(api,{method:"PUT",headers:{Authorization:"Bearer "+pat,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){const e=await r.json().catch(()=>({}));if(r.status===401||r.status===403)localStorage.removeItem("pf_pat");throw new Error(e.message||("HTTP "+r.status));}
  return r.json();}
async function saveContent(NEXT,msg){const pat=getPAT();if(!pat)throw new Error("토큰 없음");
  await ghPut("content.json",btoa(unescape(encodeURIComponent(JSON.stringify(NEXT,null,1)))),msg||"edit: update content",pat);EDITS=NEXT;}
/* 저장 직전 서버 최신본과 재동기화 (다른 탭/페이지 저장을 덮어쓰지 않게) */
async function freshMerge(local){let base={};try{const r=await fetch("content.json?"+Date.now());if(r.ok)base=await r.json();}catch(_){base=EDITS;}
  return Object.assign({},base,local);}
async function saveEdits(){
  const E=Object.assign({},EDITS);document.querySelectorAll("[data-k]").forEach(el=>{E[el.dataset.k]=el.textContent.replace(/\s+$/,"");});
  try{await saveContent(await freshMerge(E),"edit: update site text");alert("저장 완료 — GitHub에 반영했습니다. 약 30초 뒤 모든 기기에서 영구 적용됩니다.");}
  catch(e){alert("저장 실패: "+e.message+"\n새로고침하면 변경 내용은 사라집니다.");}
}
/* ---- 파일 업로드 → 갤러리 새 작업 ---- */
function readB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});}
function extOf(f){return (f.name.match(/\.[a-z0-9]+$/i)||[".bin"])[0].toLowerCase();}
function captureFrame(file){return new Promise(res=>{try{
  const url=URL.createObjectURL(file),v=document.createElement("video");
  const done=b=>{try{URL.revokeObjectURL(url);}catch(_){}res(b);};
  v.muted=true;v.playsInline=true;v.preload="auto";v.src=url;
  v.onloadeddata=()=>{try{v.currentTime=Math.min(.5,(v.duration||1)/2);}catch(_){done(null);}};
  v.onseeked=()=>{try{const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;
    c.getContext("2d").drawImage(v,0,0);c.toBlob(b=>done(b),"image/jpeg",.85);}catch(_){done(null);}};
  v.onerror=()=>done(null);setTimeout(()=>done(null),8000);
}catch(_){res(null);}});}
async function doUpload(){
  const t=document.getElementById("upTitle").value.trim(),file=document.getElementById("upFile").files[0];
  const msg=document.getElementById("upMsg"),btn=document.getElementById("upGo");
  if(!t){msg.textContent="제목을 입력하세요.";return;}
  if(!file){msg.textContent="파일을 선택하세요.";return;}
  if(file.size>25*1024*1024){msg.textContent="25MB 이하만 업로드할 수 있어요. 영상은 압축(1080p, H.264)해 주세요.";return;}
  const pat=getPAT();if(!pat){msg.textContent="토큰이 없어 업로드할 수 없어요.";return;}
  const cat=(document.querySelector("#upCats button.on")||{}).dataset.c||"motion";
  const res=(document.querySelector("#upAr button.on")||{}).dataset.a||"1080x1920";
  const isVid=/^video\//.test(file.type)||/\.(mp4|webm)$/i.test(file.name);
  btn.disabled=true;
  let pf=document.getElementById("upPoster").files[0]||null;
  if(isVid&&!pf){msg.textContent="영상 첫 프레임에서 썸네일을 만드는 중…";const b=await captureFrame(file);if(b)pf=new File([b],"poster.jpg",{type:"image/jpeg"});}
  const slug="up_"+Date.now().toString(36),path="assets/up/"+slug+extOf(file);
  msg.textContent="업로드 중… 파일 크기에 따라 시간이 걸릴 수 있어요.";
  try{
    await ghPut(path,await readB64(file),"upload: "+t,pat);
    let posterPath="";
    if(isVid&&pf){posterPath="assets/up/"+slug+"_p"+extOf(pf);await ghPut(posterPath,await readB64(pf),"upload poster: "+t,pat);}
    const assets=[];
    if(isVid){assets.push({res,type:"video",url:path,poster:posterPath});}
    else assets.push({res,type:"image",url:path});
    const w={id:slug,u:true,cat,title:t,role:document.getElementById("upRole").value.trim(),year:"",campaign:"",desc:document.getElementById("upDesc").value.trim(),assets,pv:computePV(assets)};
    const arr=getJSON("works.add",[]);arr.unshift(w);setJSON("works.add",arr);
    await saveContent(await freshMerge(EDITS),"add work: "+t);
    btn.disabled=false;msg.textContent="";closeManage();
  }catch(e){btn.disabled=false;msg.textContent="실패: "+e.message;}
}
document.getElementById("upGo").onclick=doUpload;
document.querySelectorAll("#upCats button,#upAr button").forEach(b=>{b.setAttribute("aria-pressed",String(b.classList.contains("on")));b.onclick=()=>{[...b.parentElement.children].forEach(x=>{x.classList.remove("on");x.setAttribute("aria-pressed","false");});b.classList.add("on");b.setAttribute("aria-pressed","true");};});
document.getElementById("upFile").addEventListener("change",()=>{const f=document.getElementById("upFile").files[0];document.getElementById("upPosterRow").style.display=f&&(/^video\//.test(f.type)||/\.(mp4|webm)$/i.test(f.name))?"":"none";});
/* ---- 편집 도구: 비밀 키워드(아무 곳에서나 타이핑) 또는 #키워드 해시로만 표시 ---- */
const EDIT_KEY="hansy";
function editorOn(){return localStorage.getItem("pf_editor")==="1";}
function setEditorUI(){const ef=document.getElementById("editFab");if(ef)ef.style.display=editorOn()?"":"none";}
function enableEditor(){localStorage.setItem("pf_editor","1");setEditorUI();
  /* 토큰이 없으면 지금 1회 입력받아 브라우저에 기억 → 이후엔 키워드만으로 항상 저장 가능 */
  if(!localStorage.getItem("pf_pat"))setTimeout(getPAT,60);}
if(location.hash.replace("#","").toLowerCase()===EDIT_KEY)enableEditor();
setEditorUI();
let _kb="";
addEventListener("keydown",e=>{if(e.key&&e.key.length===1){_kb=(_kb+e.key.toLowerCase()).slice(-EDIT_KEY.length);
  if(_kb===EDIT_KEY){_kb="";if(editing)return;if(editorOn()){localStorage.removeItem("pf_editor");setEditorUI();}else enableEditor();}}});
/* ---- 콘텐츠 보호: 우클릭·드래그·저장/인쇄 단축키·프린트스크린 (편집 모드 제외) ----
   ※ OS 차원의 화면 캡처는 웹에서 원천 차단이 불가능함 — 가능한 수단만 최대 적용 */
addEventListener("contextmenu",e=>{if(!editing)e.preventDefault();});
addEventListener("dragstart",e=>{if(!editing)e.preventDefault();});
addEventListener("copy",e=>{if(!editing)e.preventDefault();});
addEventListener("keydown",e=>{
  if(editing)return;
  const k=(e.key||"").toLowerCase();
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&["s","u","p","c"].indexOf(k)>=0)e.preventDefault();
  if((e.ctrlKey||e.metaKey)&&e.shiftKey&&["i","j","c","s"].indexOf(k)>=0)e.preventDefault();
});
addEventListener("keyup",e=>{if(e.key==="PrintScreen"){try{navigator.clipboard.writeText("");}catch(_){}}});

/* ---- 스크롤 챕터 바: 현재 섹션 표시 ---- */
const CB_SECTIONS=()=>[
 {id:"top",p:"개요",t:"인적 사항 · 학력 · 경력 · 수상"},
 {id:"c1",p:R.chap[0][0],t:R.chap[0][1],dk:true},
 {id:"c2",p:R.chap[1][0],t:R.chap[1][1],dk:true},
 {id:"archive",p:R.chap[2][0],t:R.chap[2][1],dk:true},
 {id:"lab",p:R.chap[3][0],t:R.chap[3][1]}
];
let _cbTick=false,_cbCur=null,_cbTimer=null;
function updateChapbar(){
  const bar=document.getElementById("chapbar");if(!bar)return;
  if(scrollY<140||lbOpen){bar.classList.remove("on");return;}
  let cur=CB_SECTIONS()[0];
  CB_SECTIONS().forEach(s=>{const el=document.getElementById(s.id);if(el&&el.getBoundingClientRect().top<=90)cur=s;});
  const sec=document.getElementById(cur.id),chin=sec&&sec.querySelector(".chin");
  if(chin&&chin.getBoundingClientRect().bottom>52){bar.classList.remove("on");return;}
  if(cur.id!==_cbCur){
    _cbCur=cur.id;
    document.getElementById("cbPill").textContent=cur.p;
    document.getElementById("cbTt").textContent=cur.t;
    /* 챕터 전환 순간: 크게 등장했다가 1.4초 후 바 크기로 가라앉음 */
    bar.classList.remove("swap");void bar.offsetWidth;
    bar.classList.add("swap","big");
    clearTimeout(_cbTimer);_cbTimer=setTimeout(()=>bar.classList.remove("big"),1400);
  }
  bar.classList.toggle("dk",!!cur.dk);
  bar.classList.add("on");
}
addEventListener("scroll",()=>{if(_cbTick)return;_cbTick=true;requestAnimationFrame(()=>{_cbTick=false;updateChapbar();});},{passive:true});

render();               /* 기본 콘텐츠 즉시 페인트 (content.json 없이도) */
loadEdits().then(render); /* 편집 오버레이 적용 후 재렌더 */
