<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="내가 입력한 금액을 실제 원화 지폐 크기 그대로 화면에 펼쳐 보는 도구. 5만원권 154×68mm 규격, 장수·무게·쌓은 높이까지 계산합니다.">
<style>
  :root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html,body{margin:0}
  body{background:#E6E8E0;font:14px system-ui,-apple-system,sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>실물 크기 돈다발</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#E6E8E0; --surface:#FBFBF7; --surface-2:#F0F1EA;
    --ink:#1B1E16; --ink-2:#4B5044; --ink-3:#7C8175;
    --line:#CFD3C6; --line-2:#DEE1D6; --accent:#5E6B34;
    --font-b:"IBM Plex Sans KR",system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
    --font-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --ground:#15170F; --surface:#1E2118; --surface-2:#262A1F;
      --ink:#EDEFE4; --ink-2:#BCC2AE; --ink-3:#878D79;
      --line:#353A2B; --line-2:#2B3022; --accent:#A8B86A;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --ground:#15170F; --surface:#1E2118; --surface-2:#262A1F;
    --ink:#EDEFE4; --ink-2:#BCC2AE; --ink-3:#878D79;
    --line:#353A2B; --line-2:#2B3022; --accent:#A8B86A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  .wrap{padding-inline:16px}
  header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
    background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top-in{display:flex;align-items:center;gap:12px;padding-block:10px}
  .top-in h1{margin:0 auto 0 0;font-size:16px;font-weight:600;letter-spacing:-.01em}
  .ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:13px;color:var(--ink-2)}
  .ghost:hover{border-color:var(--accent);color:var(--accent)}

  .bar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;padding-block:16px 12px}
  .ctl{display:flex;flex-direction:column;gap:5px;min-width:0}
  .ctl > span{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
  .money{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--accent);padding-bottom:2px}
  #amount{width:min(52vw,250px);min-width:0;background:none;border:0;outline:none;
    font-family:var(--font-m);font-weight:600;font-size:clamp(23px,6vw,31px);letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;padding:0}
  .money em{font-style:normal;font-size:15px;color:var(--ink-2)}
  .seg{display:flex;flex-wrap:wrap;gap:5px}
  .seg button{background:var(--surface-2);border:1px solid var(--line-2);border-radius:7px;padding:6px 10px;font-size:13px;color:var(--ink-2);white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ground);font-weight:500}
  #perCol{width:74px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:7px;padding:6px 8px;
    font-family:var(--font-m);font-variant-numeric:tabular-nums;text-align:right}
  .slide{display:flex;align-items:center;gap:8px}
  #overlap{width:120px;accent-color:var(--accent)}
  .slide b{font-family:var(--font-m);font-weight:500;font-size:13px;color:var(--ink-2);min-width:38px}
  .sum{font-family:var(--font-m);font-size:13px;color:var(--ink-2);padding-bottom:10px;font-variant-numeric:tabular-nums}

  .stage{border-top:1px solid var(--line);padding-block:20px 8px;overflow-x:auto}
  .grid{display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px 12px}
  .col{position:relative;flex:0 0 auto}
  .bill{position:absolute;left:0;border-radius:2px;background-size:100% 100%;background-repeat:no-repeat;
    box-shadow:0 2px 3px -1px rgba(0,0,0,.35)}
  .bill.css{background-color:var(--b-base);
    background-image:
      repeating-linear-gradient(112deg,rgba(255,255,255,.2) 0 1px,transparent 1px 5px),
      linear-gradient(160deg,color-mix(in srgb,#fff 24%,var(--b-base)),var(--b-base) 60%,color-mix(in srgb,var(--b-deep) 30%,var(--b-base)));
    outline:1px solid color-mix(in srgb,var(--b-deep) 50%,transparent);outline-offset:-1px;
    color:var(--b-ink);font-family:var(--font-m);overflow:hidden}
  .bill.css b{position:absolute;right:5%;bottom:6%;font-size:var(--fs);font-weight:600;letter-spacing:-.02em;opacity:.9}
  .bill.css i{position:absolute;left:5%;bottom:6%;font-size:calc(var(--fs) * .42);font-style:normal;letter-spacing:.1em;opacity:.6}
  .d10000{--b-base:#A4C3AB;--b-deep:#487A5A;--b-ink:#1E3B2C}
  .d5000{--b-base:#DFB29B;--b-deep:#AF6140;--b-ink:#562916}
  .d1000{--b-base:#AFB8CE;--b-deep:#59688F;--b-ink:#28304C}
  .more{font-size:13px;color:var(--ink-3);padding-block:14px}
  footer{padding-block:18px 30px;font-size:11.5px;color:var(--ink-3)}

  .scrim{position:fixed;inset:0;z-index:100;background:rgba(10,12,8,.62);display:grid;place-items:center;padding:16px;overflow:auto}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:540px;width:100%;padding:20px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
  .modal h2{margin:0 0 6px;font-size:18px;font-weight:600}
  .modal p{margin:0 0 14px;font-size:13.5px;color:var(--ink-2)}
  .refbox{border-radius:12px;border:2px dashed var(--accent);background:var(--surface-2);
    display:grid;place-items:center;text-align:center;font-size:12.5px;color:var(--accent);margin-bottom:12px;padding:8px}
  #calRange{width:100%;accent-color:var(--accent);margin:2px 0 6px}
  .cal-read{display:flex;justify-content:space-between;font-family:var(--font-m);font-size:12px;color:var(--ink-3);margin-bottom:14px}
  .act{display:flex;gap:8px;justify-content:flex-end}
  .solid{background:var(--accent);border:1px solid var(--accent);color:var(--ground);border-radius:999px;padding:8px 18px;font-size:14px;font-weight:500}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

</head>
<body>
<header class="top"><div class="wrap top-in">
  <h1>실물 크기 돈다발</h1>
  <button class="ghost" id="calBtn">화면 보정</button>
</div></header>

<main class="wrap">
  <div class="bar">
    <label class="ctl"><span>금액</span>
      <span class="money"><input id="amount" inputmode="numeric" autocomplete="off" value="20,000,000" aria-label="금액(원)"><em>원</em></span>
    </label>
    <div class="ctl"><span>권종</span><div class="seg" id="denomSeg"></div></div>
    <label class="ctl"><span>다발 장수</span><input id="perCol" type="number" min="1" max="200" step="1" value="10"></label>
    <label class="ctl"><span>겹침</span>
      <span class="slide"><input id="overlap" type="range" min="80" max="97" step="1" value="92"><b id="ovVal">92%</b></span>
    </label>
    <div class="ctl"><span>면</span><div class="seg" id="faceSeg"></div></div>
  </div>
  <p class="sum" id="sum"></p>
  <div class="stage" id="stage"></div>
  <footer>지폐 이미지는 견본(보기·SPECIMEN)입니다. 크기는 한국은행 규격 — 5만원권 154×68mm, 1만원권 148×68mm, 5천원권 142×68mm, 1천원권 136×68mm.</footer>
</main>

<div class="scrim" id="scrim" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="calTitle">
    <h2 id="calTitle">화면 보정</h2>
    <p>모니터마다 1mm의 실제 크기가 다릅니다. 카드나 지폐를 화면에 대고 아래 사각형과 크기를 맞추세요. 한 번만 하면 저장됩니다.</p>
    <div class="seg" id="refSeg" style="margin-bottom:12px"></div>
    <div class="refbox" id="refCard"><span id="refLabel"></span></div>
    <input type="range" id="calRange" min="1.8" max="13" step="0.01" aria-label="화면 배율 보정">
    <div class="cal-read"><span id="calRead"></span><span id="calPpi"></span></div>
    <div class="act"><button class="ghost" id="calReset">기본값</button><button class="solid" id="calDone">맞췄어요</button></div>
  </div>
</div>

  var SPEC={50000:{w:154,name:'5만원권'},10000:{w:148,name:'1만원권'},5000:{w:142,name:'5천원권'},1000:{w:136,name:'1천원권'}};
  var H=68, DEF=96/25.4, KEY='real-size-cash-v2', MAX=2000, COLS_CHUNK=24;
  var S={amount:20000000,denom:50000,per:10,overlap:92,face:'front',ppmm:DEF,ref:'card',calibrated:false};
  try{
    var o=JSON.parse(localStorage.getItem(KEY)||'null');
    if(o){ if(o.ppmm>1){S.ppmm=o.ppmm;S.calibrated=!!o.calibrated;}
      if(SPEC[o.denom])S.denom=+o.denom;
      if(o.per>=1&&o.per<=200)S.per=+o.per;
      if(o.overlap>=80&&o.overlap<=97)S.overlap=+o.overlap;
      if(o.face==='back'||o.face==='front')S.face=o.face; }
  }catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({ppmm:S.ppmm,calibrated:S.calibrated,denom:S.denom,per:S.per,overlap:S.overlap,face:S.face}));}catch(e){}}

  function $(id){return document.getElementById(id);}
  function el(t,c,x){var d=document.createElement(t); if(c)d.className=c; if(x!=null)d.textContent=x; return d;}
  function comma(n){return Math.round(n).toLocaleString('ko-KR');}

  function bill(p){
    var sp=SPEC[S.denom], w=sp.w*p, h=H*p, b;
    if(S.denom===50000){
      b=el('div','bill');
      b.style.backgroundImage='url('+IMG[S.face]+')';
    }else{
      b=el('div','bill css d'+S.denom);
      b.style.setProperty('--fs',(h*.2).toFixed(1)+'px');
      b.appendChild(el('b',null,String(S.denom)));
      b.appendChild(el('i',null,'견본'));
    }
    b.style.width=w+'px'; b.style.height=h+'px';
    return b;
  }

  var io=null;
  function render(){
    if(io){io.disconnect();io=null;}
    var stage=$('stage'); stage.innerHTML='';
    var p=S.ppmm, sp=SPEC[S.denom];
    var notes=Math.floor(S.amount/S.denom);
    var per=Math.max(1,Math.min(200,S.per));
    var cols=Math.ceil(notes/per);
    var step=H*p*(1-S.overlap/100);
    var shown=Math.min(notes,MAX), shownCols=Math.ceil(shown/per);

    $('sum').textContent=notes?comma(notes)+'장 · '+sp.name+' · '+comma(per)+'장씩 '+comma(cols)+'줄'
                              :'금액이 '+sp.name+' 한 장보다 적습니다';
    if(!notes) return;

    var grid=el('div','grid'); stage.appendChild(grid);
    var made=0;
    function addCols(n){
      var frag=document.createDocumentFragment();
      for(var c=0;c<n&&made<shown;c++){
        var cnt=Math.min(per,shown-made);
        var col=el('div','col');
        col.style.width=(sp.w*p)+'px';
        col.style.height=(H*p+(cnt-1)*step)+'px';
        for(var i=0;i<cnt;i++){
          var b=bill(p);
          b.style.top=(i*step)+'px';
          b.style.zIndex=String(cnt-i);
          col.appendChild(b);
        }
        frag.appendChild(col); made+=cnt;
      }
      grid.appendChild(frag);
      if(made>=shown){
        if(io){io.disconnect();io=null;}
        if(notes>shown) stage.appendChild(el('p','more',comma(shown)+'장까지 그립니다. 나머지 '+comma(notes-shown)+'장은 생략했습니다.'));
      }
    }
    addCols(COLS_CHUNK);
    if(made<shown){
      var sent=el('div'); sent.style.height='1px'; stage.appendChild(sent);
      io=new IntersectionObserver(function(e){ if(e[0].isIntersecting&&made<shown){ addCols(COLS_CHUNK); if(made<shown)stage.appendChild(sent); } },{rootMargin:'800px'});
      io.observe(sent);
    }
  }

  function seg(host,items,get,set){
    host.innerHTML='';
    items.forEach(function(it){
      var b=el('button',null,it.label); b.type='button'; b.dataset.val=String(it.val);
      b.setAttribute('aria-pressed',String(String(get())===String(it.val)));
      b.addEventListener('click',function(){
        set(it.val);
        Array.prototype.forEach.call(host.children,function(x){x.setAttribute('aria-pressed',String(x.dataset.val===String(it.val)));});
      });
      host.appendChild(b);
    });
  }

  seg($('denomSeg'),[{label:'5만원권',val:50000},{label:'1만원권',val:10000},{label:'5천원권',val:5000},{label:'1천원권',val:1000}],
    function(){return S.denom;},function(v){S.denom=v;save();render();});
  seg($('faceSeg'),[{label:'앞면',val:'front'},{label:'뒷면',val:'back'}],
    function(){return S.face;},function(v){S.face=v;save();render();});

  var inp=$('amount');
  inp.value=comma(S.amount);
  inp.addEventListener('input',function(){
    var d=inp.value.replace(/[^0-9]/g,'').slice(0,15);
    S.amount=d?parseInt(d,10):0; inp.value=d?comma(S.amount):''; render();
  });
  inp.addEventListener('focus',function(){inp.select();});

  var per=$('perCol'); per.value=S.per;
  per.addEventListener('input',function(){
    var v=parseInt(per.value,10);
    if(v>=1&&v<=200){S.per=v;save();render();}
  });
  var ov=$('overlap'); ov.value=S.overlap; $('ovVal').textContent=S.overlap+'%';
  ov.addEventListener('input',function(){S.overlap=+ov.value;$('ovVal').textContent=S.overlap+'%';save();render();});

  var REFS={card:{w:85.6,h:53.98,label:'신용·체크카드 (85.6 × 54mm)'},bill:{w:148,h:68,label:'1만원권 실물 (148 × 68mm)'}};
  function drawRef(){
    var r=REFS[S.ref], c=$('refCard');
    c.style.width=(r.w*S.ppmm)+'px'; c.style.height=(r.h*S.ppmm)+'px';
    $('refLabel').textContent=r.label;
    $('calRange').value=S.ppmm;
    $('calRead').textContent='1mm = '+S.ppmm.toFixed(2)+'px';
    $('calPpi').textContent='약 '+comma(S.ppmm*25.4)+' PPI';
  }
  seg($('refSeg'),[{label:'카드로 맞추기',val:'card'},{label:'1만원권으로 맞추기',val:'bill'}],
    function(){return S.ref;},function(v){S.ref=v;drawRef();});
  $('calRange').addEventListener('input',function(){S.ppmm=parseFloat(this.value);drawRef();});
  $('calBtn').addEventListener('click',function(){$('scrim').hidden=false;drawRef();});
  function closeCal(){$('scrim').hidden=true;S.calibrated=true;save();render();}
  $('calDone').addEventListener('click',closeCal);
  $('calReset').addEventListener('click',function(){S.ppmm=DEF;drawRef();});
  $('scrim').addEventListener('click',function(e){if(e.target===$('scrim'))closeCal();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('scrim').hidden)closeCal();});

  render();
  if(!S.calibrated){$('scrim').hidden=false;drawRef();}
})();
</script>

</body>
</html>
