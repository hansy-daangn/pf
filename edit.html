<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light only"><meta name="robots" content="noindex">
<title>편집 — Hansy 포트폴리오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/site.css">
<style>
/* 편집기: 바꾸고 싶은 걸 고른 뒤 「변경 내용 복사」 → 채팅에 붙여넣기 → Claude가 반영·배포 */
.ed{display:grid;grid-template-columns:300px minmax(0,1fr);gap:var(--s5);align-items:start}
.ed .bar{position:sticky;top:var(--nav-h);z-index:5;grid-column:1/-1;display:flex;gap:var(--s1);align-items:center;flex-wrap:wrap;padding:var(--s1) 0;background:var(--bg-glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--ink-3)}
.ed .bar .st{margin-left:auto;font-size:var(--t-sm);color:var(--ink-2)}
.ed .ls{position:sticky;top:calc(var(--nav-h) + var(--s8));max-height:calc(100dvh - var(--nav-h) - var(--s13));overflow:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:2px}
.ed .ls button{display:grid;grid-template-columns:28px 64px 1fr;gap:var(--s1);align-items:center;text-align:left;padding:4px var(--s1);border-radius:var(--r);color:var(--ink)}
.ed .ls img{width:64px;height:36px;object-fit:cover;border-radius:4px;background:var(--ink-4)}
.ed .ls b{font-weight:600;font-size:var(--t-sm);display:block;line-height:1.3}.ed .ls small{color:var(--ink-2);font-size:var(--t-micro)}
.ed .ls .n{color:var(--ink-2);font-size:var(--t-micro);font-variant-numeric:tabular-nums}
.ed .ls button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}.ed .ls button[aria-pressed="true"] small,.ed .ls button[aria-pressed="true"] .n{color:color-mix(in oklab,var(--bg) 70%,transparent)}
.ed .ls button.hid{opacity:.45}.ed .ls button.ch b:after{content:' •';color:var(--acc)}
.ed .ls .tg{font-size:var(--t-micro);color:var(--ink-2);padding:var(--s1);display:flex;gap:4px;align-items:center}
.ed .form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s2) var(--s3)}
.ed label{display:grid;gap:4px;font-size:var(--t-sm);color:var(--ink-2)}
.ed input[type=text],.ed textarea,.ed input[type=number],.ed select{font:inherit;font-size:var(--t-body);color:var(--ink);padding:var(--s1);border:1px solid var(--ink-3);border-radius:var(--r);background:var(--bg);width:100%}
.ed textarea{min-height:64px;resize:vertical}
.ed .kinds{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:var(--s05)}.ed .kinds label{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--ink-3);border-radius:999px;padding:4px var(--s1);color:var(--ink);cursor:pointer}
.ed .vid{margin-top:var(--s5);padding-top:var(--s3);border-top:1px solid var(--ink-3);display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:var(--s3)}
.ed .vwrap{position:relative;background:#0b0b0d;border-radius:var(--r2);overflow:hidden;aspect-ratio:16/9}
.ed .vwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ed .scrub{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s1);align-items:center;margin-top:var(--s1);font-size:var(--t-sm);font-variant-numeric:tabular-nums}
.ed .scrub input{width:100%;accent-color:var(--acc)}
.ed .steps{display:flex;gap:var(--s05);margin-top:var(--s1);flex-wrap:wrap}
.ed .now{display:grid;grid-template-columns:auto 1fr;gap:var(--s05) var(--s2);font-size:var(--t-sm);align-content:start}.ed .now span{color:var(--ink-2)}
.ed .now img{grid-column:1/-1;width:100%;border-radius:var(--r);background:var(--ink-4)}
.ed .home{margin-top:var(--s5);padding-top:var(--s3);border-top:1px solid var(--ink-3)}
.ed .h3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}.ed h4{font-size:var(--t-sm);color:var(--ink-2);margin-bottom:var(--s05)}
.ed .ord{list-style:none;display:flex;flex-direction:column;gap:4px;margin-bottom:var(--s1)}
.ed .ord li{display:grid;grid-template-columns:auto 48px 1fr auto;gap:var(--s1);align-items:center;padding:4px var(--s1);border:1px solid var(--ink-3);border-radius:var(--r);background:var(--bg);cursor:grab;font-size:var(--t-sm)}
.ed .ord li img{width:48px;height:27px;object-fit:cover;border-radius:3px;background:var(--ink-4)}.ed .ord li .h{color:var(--ink-2)}.ed .ord li button{color:var(--ink-2);padding:0 4px}
.ed .ord li.drag{opacity:.4}.ed .ord.rows li{grid-template-columns:auto 1fr auto}
@media (max-width:980px){.ed,.ed .form,.ed .vid,.ed .h3{grid-template-columns:minmax(0,1fr)}.ed .ls{position:static;max-height:240px}}
</style></head>
<body data-base="./"><header class="nav"><div class="wrap in"><a class="lg" href="index.html">Hansy<small>Kim Hangyeol</small></a><nav class="tabs"><a href="index.html">홈</a><a href="works.html">작업</a><a href="tools.html">도구 · 자동화</a><a href="resume.html">이력서</a></nav><div class="cta"></div></div></header>
<main><div class="wrap sec"><h1 class="pg-h">편집</h1>
<div class="ed">
 <div class="bar"><button class="btn" id="copy">변경 내용 복사</button><button class="btn ghost" id="undo">처음으로</button><span class="st" id="st">바꾼 것 없음</span></div>
 <aside><div class="ls" id="ls"></div><label class="tg"><input type="checkbox" id="showhid"> 숨김 포함</label></aside>
 <section>
  <div class="form" id="form"></div>
  <div class="vid" id="vid"></div>
  <div class="home"><h3>홈 순서</h3><div class="h3"><div><h4>피처드</h4><ol class="ord" data-k="billboard"></ol><select class="add" data-k="billboard"></select></div><div><h4>대표 작업</h4><ol class="ord" data-k="rep"></ol><select class="add" data-k="rep"></select></div><div><h4>줄</h4><ol class="ord rows" data-k="rows"></ol></div></div></div>
 </section>
</div></div></main>
<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s); const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const KINDS = { '3d': '3D 영상', ai: 'AI 영상', motion: '모션 영상', owned: '온드 콘텐츠', image: '이미지 소재', personal: '개인 작업', tools: '도구 · 자동화' };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`;
  const pr = w => (typeof w.priority === 'number' ? w.priority : 999);
  const poster = w => (w.media && (w.media.poster_w || w.media.poster || w.media.shot)) || '';
  let W0, H0, W, H, cur = null; const thumbs = {};   // thumbs[id] = {video, t}
  const clone = o => JSON.parse(JSON.stringify(o));
  const FIELDS = [['title', '제목'], ['type', '종류'], ['priority', '우선 순서 (작을수록 앞)', 'number'], ['grade', '노출', 'grade'], ['copy.one', '한 줄 소개', 'area'], ['highlight', '특별 성과 한 줄', 'area'], ['contrib', '기여도'], ['dur', '길이'], ['tools', '툴 (· 로 구분)', 'list'], ['channels', '매체 (· 로 구분)', 'list'], ['period', '시기']];
  const get = (w, k) => k.split('.').reduce((o, x) => (o == null ? undefined : o[x]), w);
  const set = (w, k, v) => { const ks = k.split('.'); let o = w; ks.slice(0, -1).forEach(x => { o = o[x] || (o[x] = {}); }); if (v === undefined || v === '') delete o[ks.at(-1)]; else o[ks.at(-1)] = v; };
  const same = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
  const KEYS = [...FIELDS.map(f => f[0]), 'kinds', 'media.billboard', 'media.start'];
  const diff = () => {
    const out = { works: {}, home: {} };
    W.forEach(w => { const o = W0.find(x => x.id === w.id); const d = {}; KEYS.forEach(k => { if (!same(get(w, k), get(o, k))) d[k] = get(w, k) ?? null; }); if (thumbs[w.id]) d.thumb = thumbs[w.id]; if (Object.keys(d).length) out.works[w.id] = d; });
    ['billboard', 'rep', 'rows'].forEach(k => { if (!same(H[k], H0[k])) out.home[k] = H[k]; });
    if (!Object.keys(out.home).length) delete out.home; if (!Object.keys(out.works).length) delete out.works;
    return out;
  };
  const LBL = Object.fromEntries([...FIELDS.map(f => [f[0], f[1].split(' (')[0]]), ['kinds', '분류'], ['media.billboard', '피처드 구간'], ['media.start', '호버 시작']]);
  const human = d => {
    const L = [];
    Object.entries(d.works || {}).forEach(([id, c]) => { const w = W.find(x => x.id === id); L.push(`- ${w.title} (${id}): ` + Object.entries(c).map(([k, v]) => k === 'thumb' ? `썸네일 = ${(w.media.videos[v.video] || {}).label || '영상'} ${v.t}초` : k === 'media.billboard' ? `피처드 구간 ${v[0]}~${v[1]}초` : k === 'media.start' ? `호버 시작 ${v}초` : `${LBL[k] || k} → ${Array.isArray(v) ? v.join(' · ') : v}`).join(' / ')); });
    Object.keys(d.home || {}).forEach(k => L.push(`- 홈 ${({ billboard: '피처드', rep: '대표 작업', rows: '줄' })[k]} 순서 변경`));
    return L.join('\n');
  };
  const st = () => { const d = diff(); const n = Object.keys(d.works || {}).length + Object.keys(d.home || {}).length; $('#st').textContent = n ? `바꾼 것 ${n}건` : '바꾼 것 없음'; list(); };
  function list() {
    const show = $('#showhid').checked; const d = diff().works || {};
    const items = W.filter(w => show || w.grade <= 2).sort((a, b) => pr(a) - pr(b) || a.grade - b.grade);
    $('#ls').innerHTML = items.map(w => `<button data-id="${esc(w.id)}" aria-pressed="${!!cur && cur.id === w.id}" class="${w.grade > 2 ? 'hid' : ''} ${d[w.id] ? 'ch' : ''}"><span class="n">${typeof w.priority === 'number' ? w.priority : '–'}</span><img src="${esc(poster(w))}" alt=""><span><b>${esc(w.title)}</b><small>${esc(w.type || '')}</small></span></button>`).join('');
    $$('#ls button').forEach(b => b.addEventListener('click', () => pick(b.dataset.id)));
  }
  function pick(id) {
    const w = W.find(x => x.id === id); if (!w) return; cur = w; history.replaceState(null, '', '#' + id);
    $('#form').innerHTML = FIELDS.map(([k, l, t]) => {
      const v = get(w, k);
      if (t === 'grade') return `<label>${l}<select data-k="${k}"><option value="1"${v === 1 ? ' selected' : ''}>대표</option><option value="2"${v === 2 ? ' selected' : ''}>일반</option><option value="3"${v >= 3 ? ' selected' : ''}>숨김</option></select></label>`;
      if (t === 'area') return `<label>${l}<textarea data-k="${k}">${esc(v || '')}</textarea></label>`;
      return `<label>${l}<input type="${t === 'number' ? 'number' : 'text'}" data-k="${k}" data-t="${t || ''}" value="${esc(t === 'list' ? (v || []).join(' · ') : (v ?? ''))}"></label>`;
    }).join('') + `<div class="kinds">${Object.entries(KINDS).map(([k, v]) => `<label><input type="checkbox" data-kind="${k}"${(w.kinds || []).includes(k) ? ' checked' : ''}>${v}</label>`).join('')}</div>`;
    $$('#form [data-k]').forEach(el => el.addEventListener('input', () => {
      const k = el.dataset.k, t = el.dataset.t; let v = el.value;
      if (k === 'priority') v = v === '' ? undefined : +v; else if (k === 'grade') v = +v; else if (t === 'list') v = v.split('·').map(s => s.trim()).filter(Boolean);
      set(w, k, v); st();
    }));
    $$('#form [data-kind]').forEach(el => el.addEventListener('change', () => { w.kinds = Object.keys(KINDS).filter(k => $(`#form [data-kind="${k}"]`).checked); st(); }));
    video(w); st();
  }
  function video(w) {
    const vs = (w.media && w.media.videos) || []; const V0 = $('#vid');
    if (!vs.length) { V0.innerHTML = `<p class="sub">영상이 없는 작품 — 썸네일은 이미지 파일을 채팅으로 보내 주세요</p>`; return; }
    const m = w.media; const bb = m.billboard || [];
    V0.innerHTML = `<div><div class="vwrap"><video preload="metadata" muted playsinline></video></div>
<div class="scrub"><span class="t">0:00.0</span><input type="range" min="0" max="1000" value="0"><span class="d">0:00.0</span></div>
<div class="steps"><select class="src">${vs.map((v, i) => `<option value="${i}">${esc(v.label || '영상')} (${v.w}×${v.h})</option>`).join('')}</select><button class="btn ghost sm" data-s="-1">−1초</button><button class="btn ghost sm" data-s="-0.04">−1프레임</button><button class="btn ghost sm" data-s="0.04">+1프레임</button><button class="btn ghost sm" data-s="1">+1초</button></div>
<div class="steps"><button class="btn sm" data-a="thumb">썸네일 = 이 프레임</button><button class="btn ghost sm" data-a="a">피처드 시작 = 여기</button><button class="btn ghost sm" data-a="b">피처드 끝 = 여기</button><button class="btn ghost sm" data-a="start">호버 시작 = 여기</button></div></div>
<div class="now"><span>피처드 구간</span><b class="vb">${bb.length ? `${bb[0]} ~ ${bb[1]}초` : '—'}</b><span>호버 시작</span><b class="vs">${m.start ?? 0}초</b><span>썸네일</span><b class="vt">${thumbs[w.id] ? `${thumbs[w.id].t}초 (새로 고름)` : '지금 것'}</b><img class="cap" src="${esc(poster(w))}" alt=""></div>`;
    const V = $('video', V0), R = $('input[type=range]', V0), sel = $('.src', V0); let vi = thumbs[w.id] ? thumbs[w.id].video : 0; sel.value = vi;
    const load = i => { vi = +i; V.src = vs[vi].hd; V.pause(); };
    load(vi); sel.addEventListener('change', () => load(sel.value));
    V.addEventListener('loadedmetadata', () => { $('.d', V0).textContent = fmt(V.duration || 0); });
    V.addEventListener('timeupdate', () => { if (V.duration) { R.value = Math.round(V.currentTime / V.duration * 1000); $('.t', V0).textContent = fmt(V.currentTime); } });
    R.addEventListener('input', () => { if (V.duration) { V.pause(); V.currentTime = R.value / 1000 * V.duration; } });
    $$('[data-s]', V0).forEach(b => b.addEventListener('click', () => { V.pause(); V.currentTime = Math.max(0, Math.min((V.duration || 0) - .01, V.currentTime + +b.dataset.s)); }));
    V.addEventListener('click', () => { V.paused ? V.play() : V.pause(); });
    const t = () => +V.currentTime.toFixed(2);
    $$('[data-a]', V0).forEach(b => b.addEventListener('click', () => {
      const a = b.dataset.a;
      if (a === 'thumb') { thumbs[w.id] = { video: vi, t: t() }; try { const c = document.createElement('canvas'); c.width = V.videoWidth; c.height = V.videoHeight; c.getContext('2d').drawImage(V, 0, 0); $('.cap', V0).src = c.toDataURL('image/jpeg', .8); } catch (e) { } $('.vt', V0).textContent = `${t()}초 (새로 고름)`; }
      if (a === 'a' || a === 'b') { const r = (m.billboard || [m.start || 0, (m.start || 0) + 8]).slice(); r[a === 'a' ? 0 : 1] = t(); if (r[1] <= r[0]) r[1] = +(r[0] + 6).toFixed(2); m.billboard = r; $('.vb', V0).textContent = `${r[0]} ~ ${r[1]}초`; }
      if (a === 'start') { m.start = t(); $('.vs', V0).textContent = `${m.start}초`; }
      st();
    }));
  }
  function homeUI() {
    const name = id => { const w = W.find(x => x.id === id); return w ? w.title : id; };
    const img = id => { const w = W.find(x => x.id === id); return w ? poster(w) : ''; };
    $$('.ord[data-k]').forEach(ol => {
      const k = ol.dataset.k; const arr = H[k] || (H[k] = []);
      ol.innerHTML = arr.map((it, i) => k === 'rows' ? `<li draggable="true" data-i="${i}"><span class="h">≡</span><span>${esc(it.title || KINDS[it.kind] || it.kind)}</span><button data-x="${i}" aria-label="빼기">✕</button></li>` : `<li draggable="true" data-i="${i}"><span class="h">≡</span><img src="${esc(img(it))}" alt=""><span>${esc(name(it))}</span><button data-x="${i}" aria-label="빼기">✕</button></li>`).join('');
      let from = null;
      $$('li', ol).forEach(li => {
        li.addEventListener('dragstart', () => { from = +li.dataset.i; li.classList.add('drag'); });
        li.addEventListener('dragend', () => li.classList.remove('drag'));
        li.addEventListener('dragover', ev => ev.preventDefault());
        li.addEventListener('drop', ev => { ev.preventDefault(); const to = +li.dataset.i; if (from == null || from === to) return; const [x] = arr.splice(from, 1); arr.splice(to, 0, x); homeUI(); st(); });
      });
      $$('[data-x]', ol).forEach(b => b.addEventListener('click', () => { arr.splice(+b.dataset.x, 1); homeUI(); st(); }));
    });
    $$('select.add').forEach(sel => { const k = sel.dataset.k; sel.innerHTML = '<option value="">+ 추가</option>' + W.filter(w => w.grade <= 2 && !(H[k] || []).includes(w.id)).map(w => `<option value="${esc(w.id)}">${esc(w.title)}</option>`).join(''); sel.onchange = () => { if (sel.value) { H[k].push(sel.value); homeUI(); st(); } }; });
  }
  $('#copy').addEventListener('click', async e => {
    const d = diff(); if (!d.works && !d.home) return;
    const text = `포폴 수정 요청\n${human(d)}\n\n\`\`\`pf-edit\n${JSON.stringify(d)}\n\`\`\``;
    try { await navigator.clipboard.writeText(text); e.target.textContent = '복사됨 — 채팅에 붙여넣기'; setTimeout(() => e.target.textContent = '변경 내용 복사', 2400); }
    catch (err) { prompt('아래 내용을 복사해 채팅에 붙여넣기', text); }
  });
  $('#undo').addEventListener('click', () => { W = clone(W0); H = clone(H0); Object.keys(thumbs).forEach(k => delete thumbs[k]); homeUI(); pick(cur ? cur.id : W[0].id); });
  $('#showhid').addEventListener('change', list);
  (async () => {
    W0 = await (await fetch('data/works.json?' + Date.now())).json(); H0 = await (await fetch('data/home.json?' + Date.now())).json();
    W = clone(W0); H = clone(H0); homeUI(); pick(location.hash.slice(1) || W.filter(w => w.grade <= 2).sort((a, b) => pr(a) - pr(b))[0].id);
  })();
})();
</script></body></html>
