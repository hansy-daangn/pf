<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#0b0b0d">
<title>작품 올리기 — HANSY</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="js/key.js"></script>
<style>
/* 작품 올리기 — 영상·이미지를 놓고(입력은 전부 선택) 「사이트에 올리기」 한 번 → GitHub 커밋 → 1~2분 뒤 사이트 반영
   연결: 편집기와 같은 토큰(pf.gh). 한 번 연결하면 '내 전용 링크'가 생겨 다른 기기는 링크만 열면 자동 연결(js/key.js) */
:root{--bg:#0b0b0d;--panel:#141417;--panel2:#1c1c20;--line:#ffffff14;--line2:#ffffff24;--ink:#f2f0ea;--ink2:#f2f0ea99;--ink3:#f2f0ea5c;--acc:#cc1433;--acc2:#e3264a;--ok:#3ecf8e;
  --r:14px;--ease:cubic-bezier(.32,.72,0,1);--font:"Pretendard Variable",Pretendard,system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color-scheme:dark}
body{font-family:var(--font);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh;
  background:radial-gradient(1200px 600px at 20% -10%,#cc143322,transparent 60%),radial-gradient(900px 500px at 100% 0,#3b2a8a1c,transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
::selection{background:var(--acc)}

/* 상단 */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:14px clamp(16px,4vw,48px);background:#0b0b0dcc;backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.08em;font-size:15px;text-decoration:none}
.brand span{font-weight:500;letter-spacing:0;color:var(--ink3);margin-left:10px}
.top nav{display:flex;gap:4px;margin-left:8px}
.top nav a{padding:6px 12px;border-radius:999px;font-size:14px;color:var(--ink2);text-decoration:none;transition:.2s}
.top nav a:hover{color:var(--ink);background:var(--line)}
.sp{flex:1}
.conn{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 12px;border-radius:999px;background:var(--panel2);font-size:13px;font-weight:600;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line);transition:.2s}
.conn:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.conn[data-on="1"] i{background:var(--ok);box-shadow:0 0 0 4px #3ecf8e26}

/* 레이아웃 */
.wrap{max-width:1360px;margin:0 auto;padding:clamp(20px,3vw,40px) clamp(16px,4vw,48px) 80px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:clamp(20px,3vw,40px);align-items:start}
@media (max-width:980px){.wrap{grid-template-columns:1fr}.side{position:static!important}}
h1{font-size:clamp(28px,3.2vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.15}
.lead{color:var(--ink2);margin-top:8px;font-size:15px}

/* 모드 */
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);margin:24px 0 16px}
.seg button{padding:9px 18px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink2);transition:.25s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#0b0b0d}

/* 기존 작품 고르기 */
.picker{background:var(--panel);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);padding:14px;margin-bottom:16px}
.picker .q{width:100%;background:var(--panel2);border:0;border-radius:10px;padding:11px 14px;outline:none;box-shadow:inset 0 0 0 1px var(--line)}
.picker .q:focus{box-shadow:inset 0 0 0 1px var(--ink3)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px;max-height:340px;overflow:auto;padding:2px;scrollbar-width:thin}
.pw{text-align:left;border-radius:10px;padding:0;transition:.2s var(--ease)}
.pw .im{aspect-ratio:16/9;border-radius:10px;background:#222 center/cover;box-shadow:inset 0 0 0 1px var(--line)}
.pw b{display:block;font-size:12.5px;font-weight:600;margin-top:6px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pw small{font-size:11.5px;color:var(--ink3)}
.pw:hover .im{box-shadow:inset 0 0 0 2px var(--ink3)}
.pw.on .im{box-shadow:inset 0 0 0 3px var(--acc)}
.chosen{display:flex;align-items:center;gap:12px}
.chosen .im{width:96px;aspect-ratio:16/9;border-radius:8px;background:#222 center/cover}
.chosen b{font-weight:700}.chosen small{display:block;color:var(--ink3);font-size:12.5px}
.chosen button{margin-left:auto;font-size:13px;color:var(--ink2);padding:6px 12px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line2)}

/* 놓는 곳 */
.drop{position:relative;display:grid;place-items:center;text-align:center;min-height:300px;border-radius:20px;cursor:pointer;background:linear-gradient(180deg,#ffffff06,#ffffff02);box-shadow:inset 0 0 0 1.5px var(--line2);transition:.3s var(--ease);overflow:hidden}
.drop::before{content:"";position:absolute;inset:10px;border-radius:14px;border:1.5px dashed var(--line2);transition:.3s var(--ease);pointer-events:none}
.drop:hover,.drop.on{background:linear-gradient(180deg,#cc14331a,#cc143306)}
.drop:hover::before,.drop.on::before{border-color:#cc143399}
.drop .ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2);transition:.3s var(--ease)}
.drop:hover .ic,.drop.on .ic{background:var(--acc);transform:translateY(-3px)}
.drop strong{display:block;font-size:19px;font-weight:700;letter-spacing:-.01em}
.drop span{display:block;color:var(--ink3);font-size:13.5px;margin-top:6px}
.has .drop{display:none}

/* 소재 */
.mhead{display:flex;align-items:baseline;gap:10px;margin:28px 0 12px}
.mhead h2{font-size:17px;font-weight:700}.mhead small{color:var(--ink3);font-size:13px}
.media{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.tile{position:relative;width:calc(200px * var(--ar));min-width:120px;max-width:360px;border-radius:12px;transition:transform .3s var(--ease),opacity .2s}
.tile .fr{position:relative;height:200px;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 8px 30px #0006,inset 0 0 0 1px var(--line);cursor:grab}
.tile .fr>img,.tile .fr>video{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.tile .tags{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#0b0b0dcc;backdrop-filter:blur(6px);color:var(--ink)}
.tag.red{background:var(--acc)}.tag.warn{background:#d97706}.tag.new{background:#ffffffe6;color:#0b0b0d}
.tile .x{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:#0b0b0dcc;backdrop-filter:blur(6px);display:grid;place-items:center;opacity:0;transition:.2s}
.tile:hover .x,.tile:focus-within .x{opacity:1}
.tile .x:hover{background:var(--acc)}
.tile .lb{margin-top:8px;width:100%;background:none;border:0;border-bottom:1px solid transparent;font-size:13px;font-weight:600;padding:2px 0;outline:none;color:var(--ink);text-overflow:ellipsis}
.tile .lb:hover{border-color:var(--line2)}.tile .lb:focus{border-color:var(--ink2)}
.tile small{display:block;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.del{opacity:.35}.tile.del .fr{filter:grayscale(1)}
.tile.drag{opacity:.4}
.tile.over-l{transform:translateX(10px)}
.add{width:140px;height:200px;border-radius:12px;display:grid;place-items:center;align-content:center;gap:8px;color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--line2);background:#ffffff05;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.add:hover,.add.on{color:var(--ink);background:#cc143314;box-shadow:inset 0 0 0 1.5px #cc143388}
.add .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--panel2)}
.hint{margin-top:16px;font-size:12.5px;color:var(--ink3);line-height:1.7}

/* 오른쪽 패널 */
.side{position:sticky;top:84px;display:grid;gap:12px;max-height:calc(100dvh - 104px);overflow:auto;scrollbar-width:none;border-radius:18px}
.side::-webkit-scrollbar{display:none}
.gowrap{position:sticky;bottom:0;padding-top:14px;background:linear-gradient(180deg,transparent,var(--bg) 22px)}
@media (max-width:980px){.side{max-height:none;overflow:visible}.gowrap{position:sticky;bottom:0;padding-bottom:12px}}
.card{background:var(--panel);border-radius:18px;box-shadow:inset 0 0 0 1px var(--line);padding:16px}
.pv{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#222 center/cover;box-shadow:0 18px 50px #0008}
.pv::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,#000c)}
.pv .tx{position:absolute;left:14px;right:14px;bottom:12px;z-index:1}
.pv .tx b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.3;text-shadow:0 1px 8px #0008}
.pv .tx small{font-size:12px;color:#ffffffb3}
.pv .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3);font-size:13px;z-index:1}
.pvb{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12.5px;color:var(--ink3)}
.pvb label{color:var(--ink2);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.pvb label:hover{color:var(--ink)}
.f{display:block;margin-top:12px}
.f:first-child{margin-top:0}
.f>span{display:block;font-size:12px;font-weight:600;color:var(--ink3);margin-bottom:6px;letter-spacing:.01em}
.in{width:100%;background:var(--panel2);border:0;border-radius:10px;padding:11px 13px;outline:none;box-shadow:inset 0 0 0 1px var(--line);transition:.2s;font-size:14.5px}
.in::placeholder{color:#f2f0ea40}
.in:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.in:focus{box-shadow:inset 0 0 0 1.5px var(--ink2)}
.in.big{font-size:16px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=month].in::-webkit-calendar-picker-indicator{filter:invert(.8)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line2);transition:.2s var(--ease)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#0b0b0d;box-shadow:none}
.more{margin-top:14px}
.more summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2);list-style:none;display:flex;align-items:center;gap:6px}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:.2s}
.more[open] summary::before{transform:rotate(45deg)}
.go{width:100%;padding:15px;border-radius:14px;background:var(--acc);font-weight:700;font-size:15.5px;color:#fff;transition:.2s var(--ease);box-shadow:0 10px 30px #cc143355}
.go:hover{background:var(--acc2);transform:translateY(-1px)}
.go:disabled{opacity:.45;cursor:default;transform:none}
.st{margin-top:10px;font-size:13px;color:var(--ink2);min-height:20px;text-align:center}
.st[data-s="ok"]{color:var(--ok);font-weight:600}.st[data-s="err"]{color:#ff6b81;font-weight:600}
.st a{font-weight:700}
.bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:12px;opacity:0;transition:opacity .3s}
.bar.on{opacity:1}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#ff6b81);transition:width .4s var(--ease)}

/* 창 */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#000b;backdrop-filter:blur(6px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal .box{width:min(520px,calc(100% - 32px));background:var(--panel);border-radius:20px;box-shadow:inset 0 0 0 1px var(--line2),0 30px 80px #000;padding:26px;display:grid;gap:14px}
.modal h3{font-size:20px;font-weight:800;letter-spacing:-.01em}
.modal p{color:var(--ink2);font-size:14px}
.modal ol{padding-left:20px;display:grid;gap:6px;font-size:14px;color:var(--ink2)}
.modal ol b{color:var(--ink)}
.modal .msg{font-size:13px;color:#ff6b81;min-height:18px}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.btn{white-space:nowrap;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:inset 0 0 0 1px var(--line2)}
.btn.pri{background:var(--ink);color:#0b0b0d;box-shadow:none}
.link{display:flex;gap:8px}
.link .in{font-size:12.5px;font-family:ui-monospace,monospace}
.conn,.brand,.top nav a{white-space:nowrap}
@media (max-width:700px){.top{gap:10px}.top nav,.brand span{display:none}.drop{min-height:220px}.drop strong{font-size:17px}.tile .fr{height:150px}.tile{width:calc(150px * var(--ar));min-width:96px}.add{height:150px;width:110px}}
.hide{display:none!important}
</style></head>
<body>
<header class="top">
  <a class="brand" href="./">HANSY<span>작품 올리기</span></a>
  <nav><a href="./">사이트</a><a href="works.html">작업</a><a href="edit/">편집기</a></nav>
  <span class="sp"></span>
  <button class="conn" id="conn" data-on="0"><i></i><span>연결 확인 중</span></button>
</header>

<div class="wrap" id="wrap">
<main>
  <h1>작품 올리기</h1>
  <p class="lead">영상·이미지를 놓고 「사이트에 올리기」만 누르면 돼요. 나머지 칸은 비워 둬도 알아서 채워져요.</p>
  <div class="seg" role="group"><button aria-pressed="true" data-mode="new">새 작품</button><button aria-pressed="false" data-mode="add">기존 작품 고치기</button></div>

  <div class="picker hide" id="picker">
    <div id="pickWrap"><input class="q" id="q" type="search" placeholder="작품 검색 — 제목·종류·연도"><div class="pgrid" id="pgrid"></div></div>
    <div class="chosen hide" id="chosen"></div>
  </div>

  <label class="drop" id="drop">
    <div><div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></div>
    <strong>영상·이미지를 여기로 끌어 놓기</strong><span>또는 눌러서 고르기 · 여러 개 한 번에 · mp4 · png · jpg · webp · gif</span></div>
    <input type="file" id="file" multiple accept="video/mp4,video/quicktime,video/webm,image/*" hidden>
  </label>

  <section id="mwrap" class="hide">
    <div class="mhead"><h2>소재</h2><small id="mcount"></small><span class="sp"></span><small>끌어서 순서 바꾸기 · 첫 영상이 대표</small></div>
    <div class="media" id="media"></div>
    <p class="hint">영상은 파일당 48MB 이하가 가벼워요(95MB 넘으면 못 올려요). 이름은 눌러서 고칠 수 있어요. 기존 소재의 ✕는 사이트에서 빼기 — 교체는 새 파일을 넣고 옛 것을 ✕.</p>
  </section>
</main>

<aside class="side">
  <div class="card">
    <div class="pv" id="pv"><div class="empty" id="pvEmpty">소재를 넣으면 썸네일이 보여요</div><div class="tx"><b id="pvT"></b><small id="pvS"></small></div></div>
    <div class="pvb"><span id="pvNote">첫 영상 1초 장면 자동</span><label>썸네일 직접 고르기<input type="file" id="pfile" accept="image/*" hidden></label></div>
  </div>
  <div class="card">
    <label class="f"><span>제목</span><input class="in big" id="title" placeholder="비우면 파일 이름으로"></label>
    <label class="f"><span>한 줄 설명</span><input class="in" id="one" placeholder="카드·상영관에 보이는 한 줄"></label>
    <div class="f two"><label><span style="display:block;font-size:12px;font-weight:600;color:var(--ink3);margin-bottom:6px">시기</span><input class="in" type="month" id="period"></label><label><span style="display:block;font-size:12px;font-weight:600;color:var(--ink3);margin-bottom:6px">기여도</span><input class="in" id="contrib" value="1인 제작"></label></div>
    <div class="f"><span>분류 <em style="font-style:normal;color:var(--ink3);font-weight:500">· 안 고르면 자동</em></span><div class="chips" id="kinds"></div></div>
    <div class="f"><span>노출</span><div class="chips" id="grade"><button class="chip" data-g="1" aria-pressed="false">대표</button><button class="chip" data-g="2" aria-pressed="true">일반</button><button class="chip" data-g="3" aria-pressed="false">숨김</button></div></div>
    <details class="more"><summary>자세히 (종류·툴·역할·태그)</summary>
      <label class="f"><span>종류</span><input class="in" id="type" placeholder="예: 3D 모션 광고 · 비우면 자동"></label>
      <label class="f"><span>툴</span><input class="in" id="tools" placeholder="After Effects, Cinema 4D"></label>
      <label class="f"><span>역할</span><input class="in" id="role" placeholder="예: 3D 공간 · 모션 · 영상 3규격 제작"></label>
      <label class="f"><span>태그</span><input class="in" id="tags" placeholder="3D, 이벤트"></label>
    </details>
  </div>
  <div class="gowrap">
    <button class="go" id="go">사이트에 올리기</button>
    <div class="bar" id="bar"><i></i></div>
    <p class="st" id="st"></p>
  </div>
</aside>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const GH = { owner: 'hansy-daangn', repo: 'pf', branch: 'main', api: 'https://api.github.com' }, R = `/repos/${GH.owner}/${GH.repo}`;
const TK = 'pf.gh', KK = 'pf.k', SITE = 'https://hansy-daangn.github.io/pf/';
const KINDS = { '3d': '3D', ai: 'AI', motion: '모션', owned: '온드', image: '이미지', personal: '개인', tools: '도구' };
const TYPE_AUTO = { '3d': '3D 모션 광고', ai: 'AI 생성 영상', motion: '모션 광고', owned: '온드 콘텐츠', image: '이미지 소재 세트', personal: '개인 작업', tools: '도구' };
const MAXMB = 95, WARNMB = 48;
let token = localStorage.getItem(TK) || '', works = [], mode = 'new', sel = '', items = [], posterBlob = null, posterManual = false, busy = false;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const status = (s, t) => { const e = $('#st'); e.dataset.s = s; e.innerHTML = t; };
const prog = p => { $('#bar').classList.toggle('on', p != null); $('#bar i').style.width = (p || 0) + '%'; };
const mb = n => (n / 1e6).toFixed(1) + 'MB';
const B64U = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const B64 = buf => { let s = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(s); };

/* ---------- GitHub ---------- */
const api = async (path, opt = {}) => {

  if (posterManual) return; const n = ++pT;
  const live = items.filter(x => !x.del), first = live.find(x => x.kind === 'v') || live.find(x => x.kind === 'i');
  // 기존 작품은 맨 앞 소재가 새 파일일 때만 썸네일을 새로 만듦
  const b = first && first.file ? (first.kind === 'v' ? await frame(first.url) : await imgJpg(first.url)) : null;
  if (n !== pT) return; posterBlob = b; preview();
};
const autoTitle = () => { const f = items.find(x => x.file && !x.del); return f ? f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim() : ''; };
const autoKinds = () => { const live = items.filter(x => !x.del); return live.some(x => x.kind === 'v') ? ['motion'] : live.length ? ['image'] : ['motion']; };
const preview = () => {
  const w = mode === 'add' ? W(sel) : null;
  if (pURL) URL.revokeObjectURL(pURL); pURL = posterBlob ? URL.createObjectURL(posterBlob) : '';
  const src = pURL || posterURL(w) || '';
  $('#pv').style.backgroundImage = src ? `url('${src}')` : ''; $('#pvEmpty').classList.toggle('hide', !!src);
  const ks = kindsSel().length ? kindsSel() : autoKinds();
  $('#pvT').textContent = $('#title').value.trim() || autoTitle() || (w ? w.title : '');
  $('#pv .tx').classList.toggle('hide', !src);
  $('#pvS').textContent = [$('#type').value.trim() || (w && w.type) || TYPE_AUTO[ks[0]], ($('#period').value || (w && w.period) || new Date().toISOString().slice(0, 7)).slice(0, 4)].filter(Boolean).join(' · ');
  $('#pvNote').textContent = posterManual ? '직접 고른 썸네일' : posterBlob ? '첫 소재에서 자동' : w ? '지금 썸네일 유지' : '첫 영상 1초 장면 자동';
};
$('#pfile').onchange = async e => { const f = e.target.files[0]; if (!f) return; posterManual = true; posterBlob = await imgJpg(URL.createObjectURL(f)); preview(); e.target.value = ''; };

/* ---------- 올리기 ---------- */
const csv = s => s.split(',').map(x => x.trim()).filter(Boolean);
const stamp = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${String(d.getFullYear()).slice(2)}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; };
const go = async () => {
  if (busy) return;
  if (mode === 'add' && !sel) { status('err', '고칠 작품을 먼저 골라 주세요'); return; }
  if (mode === 'new' && !items.some(x => !x.del)) { status('err', '영상이나 이미지를 하나 이상 넣어 주세요'); $('#drop').classList.add('on'); setTimeout(() => $('#drop').classList.remove('on'), 700); return; }
  if (items.some(x => x.file && !x.del && x.file.size > MAXMB * 1e6)) { status('err', '95MB 넘는 파일이 있어요 — 줄여서 다시 넣어 주세요'); return; }
  if (!token && !(await connect())) return;
  busy = true; $('#go').disabled = true; prog(3);
  const ks = kindsSel().length ? kindsSel() : (mode === 'add' && (W(sel).kinds || []).length ? W(sel).kinds : autoKinds());
  const title = $('#title').value.trim() || (mode === 'add' ? W(sel).title : autoTitle()) || '새 작품';
  try {
    let sha = '', id = mode === 'new' ? `up_${stamp()}` : sel;
    for (let attempt = 0; !sha; attempt++) {
      status('busy', '최신 내용 확인 중…');
      const head = (await api(`${R}/git/ref/heads/${GH.branch}`)).object.sha;
      const commit = await api(`${R}/git/commits/${head}`);
      const remote = JSON.parse(await api(`${R}/contents/data/works.json?ref=${head}`, { raw: true }));
      let w = remote.find(x => x.id === id);
      if (mode === 'new') { if (w) id += 'b'; w = { id, group: 'performance', links: { live: null, github: null, artifact: null, embed: null }, metrics: [], channels: [], copy: { one: '', problem: null, decision: null, result: null }, media: {} }; remote.push(w); }
      else if (!w) throw new Error('작품을 찾지 못했어요 — 새로고침 후 다시 시도해 주세요');
      const m = w.media = w.media || {};
      const period = $('#period').value || (mode === 'new' ? new Date().toISOString().slice(0, 7) : '');
      Object.assign(w, { title, grade: gradeSel(), kinds: ks });
      if (period) { w.period = period; w.year = +period.slice(0, 4); } else if (!w.year) w.year = new Date().getFullYear();
      if (!w.period) w.period = String(w.year);
      (w.copy = w.copy || {}).one = $('#one').value.trim() || (w.copy.one || '');
      w.type = $('#type').value.trim() || w.type || TYPE_AUTO[ks[0]] || '';
      w.contrib = $('#contrib').value.trim() || '1인 제작';
      const role = $('#role').value.trim(); if (role) w.role = role; else if (mode === 'new') delete w.role;
      w.tools = csv($('#tools').value); w.tags = csv($('#tags').value);
      w.subtitle = `${ks.map(k => KINDS[k]).join(' · ')} · ${w.period}`;
      // 파일 경로(이미 있는 이름은 피함)
      const tree = [], used = new Set([...(m.videos || []).flatMap(v => [v.hd, v.sd]), ...(m.images || []).map(v => v.src), m.poster].filter(Boolean));
      let treeFiles = new Set(); try { treeFiles = new Set((await api(`${R}/git/trees/${commit.tree.sha}?recursive=1`)).tree.map(t => t.path)); } catch (e) { }
      const taken = [];
      const pick = (dir, ext, first) => { for (let n = 1; ; n++) { const p = `assets/${dir}/${id}${n === 1 && first ? '' : '-' + n}.${ext}`; if (!used.has(p) && !treeFiles.has(p) && !taken.includes(p)) { taken.push(p); return p; } } };
      const vids = [], imgs = [], files = [];
      for (const it of items) {
        if (it.del) continue;
        if (it.old) { (it.kind === 'v' ? vids : imgs).push({ ...it.ref, label: it.label }); continue; }
        if (it.kind === 'v') { const p = pick('v', 'mp4', true); vids.push({ label: it.label, hd: p, w: it.w, h: it.h, dur: it.dur }); files.push([p, it.file]); }
        else { const p = pick('i', it.ext, false); imgs.push({ label: it.label, src: p, w: it.w, h: it.h }); files.push([p, it.file]); }
      }
      if (vids.length) m.videos = vids; else delete m.videos;
      if (imgs.length) m.images = imgs; else delete m.images;
      if (vids.length && m.start == null) m.start = 0;
      if (m.billboard && (!vids[0] || m.billboard[1] > vids[0].dur)) delete m.billboard;
      if (posterBlob) { const p = pick('poster', 'jpg', true); m.poster = p; files.push([p, posterBlob]); }
      if (!m.poster && imgs[0]) m.poster = imgs[0].src;
      w.formats = [...new Set([...vids, ...imgs].map(x => (x.label || '').split(' — ')[0].split(' · ').pop()).filter(Boolean))];
      const total = files.reduce((s, [, f]) => s + f.size, 0) || 1; let done = 0;
      for (const [p, f] of files) {
        status('busy', `올리는 중 · ${Math.round(100 * done / total)}% · ${esc(p.split('/').pop())} (${mb(f.size)})`);
        const b = await api(`${R}/git/blobs`, { method: 'POST', body: JSON.stringify({ content: await b64(f), encoding: 'base64' }) });
        tree.push({ path: p, mode: '100644', type: 'blob', sha: b.sha }); done += f.size; prog(5 + 85 * done / total);
      }
      const jb = await api(`${R}/git/blobs`, { method: 'POST', body: JSON.stringify({ content: JSON.stringify(remote, null, 1) + '\n', encoding: 'utf-8' }) });
      tree.push({ path: 'data/works.json', mode: '100644', type: 'blob', sha: jb.sha });
      status('busy', '저장 중…');
      const t = await api(`${R}/git/trees`, { method: 'POST', body: JSON.stringify({ base_tree: commit.tree.sha, tree }) });
      const c = await api(`${R}/git/commits`, { method: 'POST', body: JSON.stringify({ message: `올리기: ${title}${files.length ? ` (파일 ${files.length}개)` : ''}`, tree: t.sha, parents: [head] }) });
      try { await api(`${R}/git/refs/heads/${GH.branch}`, { method: 'PATCH', body: JSON.stringify({ sha: c.sha, force: false }) }); sha = c.sha; }
      catch (e) { if (e.status === 422 && attempt < 3) continue; throw e; }
    }
    prog(94);
    const view = `works.html?w=${encodeURIComponent(id)}`;
    status('ok', '저장 완료 · 사이트에 반영 중(1~2분)…');
    ensureLink();
    for (let k = 0; k < 40; k++) {
      await sleep(k ? 6000 : 12000);
      try { const ws = await fetch(`data/works.json?t=${Date.now()}`, { cache: 'no-store' }).then(r => r.json()); const w = ws.find(x => x.id === id);
        if (w && w.title === title) { prog(100); status('ok', `사이트 반영 완료 ✓ <a href="${view}" target="_blank">상영관에서 보기 ↗</a>`); break; } } catch (e) { }
      if (k === 39) status('ok', `저장 완료 · 반영이 조금 늦어요 <a href="${view}" target="_blank">상영관에서 보기 ↗</a>`);
    }
    await loadWorks(); mode = 'add';
    $$('.seg button').forEach(x => x.setAttribute('aria-pressed', x.dataset.mode === 'add')); $('#picker').classList.remove('hide');
    if (W(id)) choose(id);
  } catch (e) {
    console.warn(e);
    if (e.status === 401 || (e.status === 403 && !/rate limit/i.test(e.message))) { token = ''; localStorage.removeItem(TK); connUI(); status('err', '연결이 만료됐어요 — 다시 누르면 연결 창이 떠요(입력은 그대로)'); }
    else status('err', `올리기 실패 — 입력은 그대로예요, 다시 눌러 주세요<br><small style="opacity:.7">${esc(String(e.message || e).slice(0, 140))}</small>`);
  } finally { busy = false; $('#go').disabled = false; setTimeout(() => prog(null), 2000); }
};
$('#go').onclick = go;
addEventListener('beforeunload', e => { if (busy) { e.preventDefault(); e.returnValue = ''; } });
connUI(); loadWorks(); fill(null); ensureLink();
})();
</script>
</body></html>
