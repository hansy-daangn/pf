<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>김한결 — 영상 디자이너 · 광고 소재</title>
<link rel="icon" href="data:,"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"/>
<style>
:root{
 --ink:#111114;--mute:#6f6f76;--line:#e6e6e9;--tile:#f3f3f5;
 --san:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;
 --t1:22px;--t2:15px;--t3:13px;
 --maxw:1360px;--pad:clamp(20px,4vw,56px);
 --gut:max(var(--pad),calc((100% - var(--maxw)) / 2 + var(--pad)));
 --gap:clamp(14px,1.6vw,24px);--secgap:clamp(80px,10vw,140px);
 --H:clamp(320px,min(58vh,34vw),600px);
 --bar:44px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scrollbar-gutter:stable;scroll-padding-top:calc(var(--bar) + 16px)}
html.lock{overflow:hidden}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:#fff;color:var(--ink);font-family:var(--san);font-size:var(--t2);line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
img,video{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:0}
button:disabled{cursor:default;opacity:.28}
ul,ol{list-style:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--pad)}
.t3{font-size:var(--t3);color:var(--mute);line-height:1.6}
#hprobe{position:absolute;top:0;left:0;width:0;height:var(--H);visibility:hidden;pointer-events:none}

/* 0 header */
.hd{padding-block:clamp(56px,9vh,112px) clamp(36px,5vh,64px)}
.hd .id{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.hd h1{font-size:var(--t1);font-weight:700;letter-spacing:-.02em;line-height:1.3}
.toc{margin-top:clamp(36px,5vh,64px);border-top:1px solid var(--ink)}
.toc ol{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:var(--gap)}
.toc a{display:grid;grid-template-columns:2.2em 1fr;padding:13px 0;border-bottom:1px solid var(--line);line-height:1.45}
.toc a span:first-child{color:var(--mute);font-size:var(--t3);padding-top:.15em}
.toc a:hover span:last-child{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}

/* fixed slim toc */
#bar{position:fixed;top:0;left:0;right:0;z-index:30;height:var(--bar);background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transform:translateY(-100%);transition:transform .22s ease;visibility:hidden}
#bar.on{transform:none;visibility:visible}
#bar .in{max-width:var(--maxw);margin:0 auto;padding-inline:var(--pad);height:100%;display:flex;align-items:center;gap:20px;font-size:var(--t3)}
#bar .nm{font-weight:700;white-space:nowrap}
#bar ol{display:flex;gap:16px;margin-left:auto;overflow:hidden;white-space:nowrap}
#bar a{position:relative;display:inline-block;color:var(--mute);padding:7px 0 5px;border-bottom:1px solid transparent}
#bar a.cur{color:var(--ink);border-bottom-color:var(--ink)}
#bar a i{font-style:normal;margin-right:5px}
@media(max-width:1199px){#bar a span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}#bar a i{margin-right:0}#bar ol{gap:14px}}

/* 1 resume */
.cv{padding-top:clamp(20px,3vh,32px)}
.cv .g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:var(--gap) clamp(28px,4vw,64px);align-items:start}
.cv h2{font-size:var(--t3);color:var(--mute);font-weight:500;padding-bottom:10px;border-bottom:1px solid var(--line)}
.cv .blk+.blk{margin-top:28px}
.cv .r{display:grid;grid-template-columns:9.4em minmax(0,1fr);gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:var(--t3);line-height:1.55}
.cv .r .d{color:var(--mute);font-variant-numeric:tabular-nums}
.cv .r b{font-weight:600;color:var(--ink)}
.cv .r span{color:var(--mute)}
.cv .aw li{display:grid;grid-template-columns:4.8em minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:var(--t3);line-height:1.55;align-items:baseline}
.cv .aw .d{color:var(--mute);font-variant-numeric:tabular-nums}
.cv .aw b{font-weight:500}
.cv .aw .m{color:var(--mute)}
.cv .aw .o{color:var(--mute);text-align:right;white-space:nowrap}

/* section head */
.sec{padding-top:var(--secgap)}
.sec:last-of-type{padding-bottom:var(--secgap)}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:clamp(18px,2.6vw,30px)}
.sh .num{display:block;font-size:var(--t3);color:var(--mute);margin-bottom:8px}
.sh h2{font-size:var(--t1);font-weight:700;letter-spacing:-.02em;line-height:1.3}
.sh .duty{margin-top:6px;font-size:var(--t3);color:var(--mute)}
.sh .nv{display:flex;align-items:center;gap:4px;flex:none;font-size:var(--t3);color:var(--mute)}
.sh .nv.off{visibility:hidden}
.sh .nv .c{margin-right:8px;font-variant-numeric:tabular-nums;min-width:4.2em;text-align:right}
.sh .nv button{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:15px;color:var(--ink)}
.sh .nv button:hover:not(:disabled){border-color:var(--ink)}
.sec.rows .sh .nv{display:none}

/* track (desktop, sections 1–3: horizontal scroll-snap, same height) */
.track{position:relative;display:flex;align-items:flex-start;gap:var(--gap);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:6px var(--gut) 14px;scroll-padding-inline:var(--gut);overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:#d4d4d8 transparent}
.trk{position:relative}
.trk::after{content:"";position:absolute;top:0;right:0;bottom:22px;width:clamp(48px,6vw,96px);background:linear-gradient(to right,rgba(255,255,255,0),#fff 85%);pointer-events:none;opacity:0;transition:opacity .25s ease}
.trk.more::after{opacity:1}
.track::-webkit-scrollbar{height:6px}
.track::-webkit-scrollbar-thumb{background:#d4d4d8;border-radius:3px}
.track::-webkit-scrollbar-track{background:transparent}
.card{flex:none;scroll-snap-align:start;width:calc(var(--H) * var(--ar));min-width:0}
.card .pv{display:block;position:relative;width:100%;height:var(--H);background:var(--tile);overflow:hidden;padding:0;text-align:left}
.card .pv img,.card .pv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .pv video{opacity:0;transition:opacity .35s ease}
.card .pv video.on{opacity:1}
.card figcaption{padding-top:14px;font-size:var(--t3);line-height:1.6;cursor:pointer}
.card figcaption b{display:block;font-size:var(--t2);font-weight:600;color:var(--ink);line-height:1.45;margin-bottom:4px}
.card figcaption span{display:block;color:var(--mute)}
.card figcaption span+span{margin-top:2px}
.card:hover figcaption b,.card .pv:focus-visible+figcaption b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
/* tool card (section 3) */
.card.tool{width:calc(var(--H) * 2)}
.card.tool .bd{height:var(--H);display:flex;flex-direction:column;gap:18px;overflow:hidden}
.card.tool .bd .im{flex:none;position:relative;width:100%;aspect-ratio:1876/630;max-height:calc(var(--H) - 130px);background:var(--tile);overflow:hidden}
.card.tool .bd .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left top}
.card.tool .bd .tx{margin-top:auto}
.card.tool .bd h3{font-size:var(--t2);font-weight:600;line-height:1.45}
.card.tool .bd p{font-size:var(--t3);color:var(--mute);line-height:1.6;margin-top:4px;max-width:72ch}
/* rows (section 4 always; sections 1–3 at ≤900): wrapped rows, height equal within a row */
.track.rows{flex-wrap:wrap;overflow:visible;scroll-snap-type:none;padding:6px var(--pad) 0;row-gap:clamp(28px,4vw,44px);max-width:var(--maxw);margin:0 auto;scrollbar-width:auto}
.track.rows .card{scroll-snap-align:none;width:calc((100% - var(--gap)) / 2)}
.track.rows .card .pv{height:auto;aspect-ratio:var(--ar)}
.track.rows .card.tool{width:100%}
.track.rows .card.tool .bd{height:auto;overflow:visible}
.track.rows .card.tool .bd .im{max-height:none}

/* blocks (sections 5–6) */
.blocks{max-width:1080px}
.block{border-top:1px solid var(--line);padding-top:28px}
.block+.block{margin-top:clamp(48px,6vw,72px)}
.block .tag{display:block;font-size:var(--t3);color:var(--mute);margin-bottom:6px}
.block h3{font-size:var(--t2);font-weight:600;line-height:1.45}
.block .d{margin-top:8px;max-width:64ch;line-height:1.7}
.block .tools,.block .k{margin-top:6px;font-size:var(--t3);color:var(--mute)}
.figgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);margin-top:26px;align-items:start}
.figgrid.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.figgrid figure{min-width:0}
.figgrid .f{background:var(--tile);overflow:hidden}
.figgrid .f img{width:100%;height:auto}
.figgrid .col{display:grid;gap:var(--gap)}
.figgrid figcaption{font-size:var(--t3);color:var(--mute);line-height:1.5;margin-top:8px}
.fv{position:relative;background:var(--tile);overflow:hidden}
.fv img,.fv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fv video{opacity:0;transition:opacity .35s ease}
.fv video.on{opacity:1}
.notes{margin-top:22px;border-top:1px solid var(--line);max-width:64ch}
.notes li{padding:12px 0;border-bottom:1px solid var(--line)}
.notes li b{font-weight:600;display:block}
.notes li span{font-size:var(--t3);color:var(--mute);display:block;margin-top:2px}
.hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
.hero .im{aspect-ratio:4/3;background:var(--tile);overflow:hidden}
.hero .im img{width:100%;height:100%;object-fit:cover}
.hero h4{font-size:var(--t2);font-weight:600;margin-top:14px;line-height:1.45}
.hero .q{font-size:var(--t3);color:var(--mute);margin-top:2px}
.hero .w{margin-top:10px;font-size:var(--t3);line-height:1.6}
.hero .w span{display:block;color:var(--mute)}
/* top3 */
.yt{position:relative;display:block;width:100%;background:var(--tile);overflow:hidden;padding:0;aspect-ratio:var(--ar)}
.yt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.yt .pl{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;transition:transform .2s ease}
.yt .pl::after{content:"";width:0;height:0;border-style:solid;border-width:9px 0 9px 15px;border-color:transparent transparent transparent var(--ink);margin-left:4px}
.yt:hover .pl{transform:scale(1.06)}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.top3 .body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--gap) clamp(24px,4vw,56px);margin-top:22px}
.top3 .desc{margin-top:12px;line-height:1.75}
.top3 dl{display:grid;grid-template-columns:5em minmax(0,1fr);row-gap:8px;column-gap:12px;font-size:var(--t3);line-height:1.6;border-top:1px solid var(--line);padding-top:12px}
.top3 dt{color:var(--mute)}
.top3 dd{color:var(--ink)}

/* lightbox (white) */
#lb{position:fixed;inset:0;z-index:50;background:#fff;display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh;overscroll-behavior:contain}
#lb[hidden]{display:none}
#lb .top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 20px;align-items:start;padding:10px var(--pad);border-bottom:1px solid var(--line)}
#lb .txt{min-width:0;padding-top:7px}
#lb .txt h3{font-size:var(--t2);font-weight:600;line-height:1.45}
#lb .txt p{font-size:var(--t3);color:var(--mute);line-height:1.55}
#lb .ctl,#lb .nav{display:flex;align-items:center;gap:2px;font-size:var(--t3);color:var(--mute)}
#lb .nav .c{margin-right:8px;font-variant-numeric:tabular-nums}
#lb .ctl button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:16px;color:var(--ink)}
#lb .ctl button:hover:not(:disabled){background:var(--tile)}
#lb #lbX{margin-left:6px;font-size:18px}
#lb .stage{min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;padding:16px var(--pad);position:relative}
#lb .box{position:relative;background:var(--tile);flex:none;max-width:100%;max-height:100%}
#lb .box video,#lb .box img{width:100%;height:100%;object-fit:contain;background:#fff}
#lb .igrid{width:100%;max-width:min(1100px,100%);max-height:100%;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr));gap:var(--gap);align-items:start;align-content:start;padding:4px 2px}
#lb .igrid figure{min-width:0}
#lb .igrid img{width:100%;height:auto;background:var(--tile)}
#lb .igrid figcaption{font-size:var(--t3);color:var(--mute);padding-top:6px;font-variant-numeric:tabular-nums}
#lb .foot{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px var(--pad) 12px;min-width:0}
#lb .foot[hidden]{display:none}
#lb .ctx{flex:none;font-size:var(--t3);color:var(--mute)}
#lb .thumbs{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;overflow-y:hidden;min-width:0;flex:0 1 auto;justify-content:flex-start;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:4px}
#lb .thumbs::-webkit-scrollbar{display:none}
#lb .ch{flex:none;height:44px;display:flex;align-items:center;gap:8px;padding:0 10px 0 7px;border:1px solid var(--line);color:var(--mute);font-size:var(--t3);white-space:nowrap;scroll-snap-align:start;font-variant-numeric:tabular-nums}
#lb .ch .sp{display:block;width:var(--w);height:var(--h);background:var(--ink);opacity:.25;overflow:hidden}
#lb .ch .sp.im{opacity:1;background:var(--tile)}
#lb .ch .sp img{width:100%;height:100%;object-fit:cover}
#lb .ch:hover,#lb .ch[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
#lb .ch[aria-pressed="true"] .sp{opacity:1}

/* responsive: 900 → 2 col rows, 520 → 1 col */
@media(max-width:1000px){.cv .g{grid-template-columns:1fr}}
@media(max-width:900px){
 :root{--t1:20px}
 .toc ol{grid-template-columns:repeat(2,1fr)}
 .cv .c1{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap) clamp(24px,4vw,48px);align-items:start}
 .cv .c1 .blk+.blk{margin-top:0}
 .sh .nv{display:none}
 .figgrid,.figgrid.n3{grid-template-columns:1fr}
 .figgrid .two{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
 .hero{grid-template-columns:1fr 1fr}
 .top3 .body{grid-template-columns:1fr}
 #lb .ctx{display:none}
 #lb .thumbs{flex:1 1 auto}
}
@media(max-width:520px){
 .toc ol{grid-template-columns:1fr}
 .cv .c1{grid-template-columns:1fr}
 .cv .c1 .blk+.blk{margin-top:28px}
 .cv .aw li{grid-template-columns:4.8em minmax(0,1fr)}
 .cv .aw .o{grid-column:2;text-align:left;white-space:normal}
 .track.rows .card{width:100%}
 .hero{grid-template-columns:1fr}
 .figgrid .two{grid-template-columns:1fr}
 #lb .top{gap:4px 8px}
 #lb .ctl{display:contents}
 #lb .txt{grid-column:1;grid-row:1}
 #lb #lbX{grid-column:2;grid-row:1;margin-left:0}
 #lb .nav{grid-column:1/-1;grid-row:2;margin-left:-8px}
 #lb .txt h3{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
 #lb .txt p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
 #lb .stage{padding:10px 16px}
 #lb .foot{padding-inline:12px}
}
</style>
</head>

function labBlocks(){
 const [c0,c1]=DATA.C2D,L=DATA.LAB[1],H=DATA.HERO.cards;
 const a=`<article class="block"><span class="tag">${esc(c0.tag)}</span><h3>${esc(c0.t)}</h3><p class="d">${c0.d.map(esc).join(" ")}</p><p class="tools">${esc(c0.tools.join(" · "))}</p>
  <div class="figgrid"><figure>${figVideo("assets/fig/move.mp4","assets/fig/cd_mv.png","536/440","After Effects 관성 익스프레션 데모")}</figure><div class="col"><figure><div class="f"><img src="assets/fig/cd_r1.png" alt="After Effects 익스프레션 컨트롤 패널" loading="lazy" decoding="async"/></div></figure><figure><div class="f"><img src="assets/fig/cd_b1.png" alt="After Effects 익스프레션 코드" loading="lazy" decoding="async"/></div></figure></div></div>
  <ul class="notes">${c0.bub.map(b=>`<li><b>${esc(b[0])}</b><span>${esc(b[1])}</span></li>`).join("")}</ul></article>`;
 const b=`<article class="block"><span class="tag">${esc(c1.tag)}</span><h3>${esc(c1.t)}</h3><p class="d">${c1.d.map(esc).join(" ")}</p><p class="tools">${esc(c1.tools.join(" · "))}</p>
  <div class="figgrid n3">
   <figure><div class="f"><img src="assets/fig/nd_t1.png" alt="Cinema 4D 타임라인" loading="lazy" decoding="async"/></div><figcaption>${esc(c1.cap[0])}</figcaption></figure>
   <figure><div class="two col">${figVideo("assets/fig/nd_m2.mp4","assets/fig/nd_m2p.jpg","16/9","캐릭터 애니메이션 작업 뷰포트")}${figVideo("assets/fig/nd_m1.mp4","assets/fig/nd_m1p.jpg","16/9","캐릭터 애니메이션 렌더")}</div><figcaption>${esc(c1.cap[1])}</figcaption></figure>
   <figure><div class="f"><img src="assets/fig/nd_g1.png" alt="XPresso 노드 그래프" loading="lazy" decoding="async"/></div><figcaption>${esc(c1.cap[2])}</figcaption></figure>
  </div></article>`;
 const c=`<article class="block"><span class="tag">${esc(L.tag)}</span><h3>${esc(L.t)}</h3><p class="d">${esc(L.d)}</p><p class="k">${esc(L.k)}</p>
  <div class="figgrid"><figure style="grid-column:1/-1"><div class="f"><img src="${esc(L.figs[0][0])}" alt="${esc(L.figs[0][1])}" loading="lazy" decoding="async"/></div><figcaption>${esc(L.figs[0][1])}</figcaption></figure></div></article>`;
 const h=`<article class="block"><div class="hero">${H.map(x=>`<div><div class="im"><img src="${esc(x.img)}" alt="${esc(x.w)}" loading="lazy" decoding="async" style="object-position:${esc(x.pos)}"/></div><h4>${esc(x.t)}</h4><p class="q">${esc(x.q)}</p><p class="w">${esc(x.w)}<span>${esc(x.p)}</span>${x.a?`<span>${esc(x.a)}</span>`:""}</p></div>`).join("")}</div></article>`;
 return a+b+c+h;}
function top3Blocks(){
 return DATA.TOP3.map(t=>`<article class="block top3"><button type="button" class="yt" data-yt="${esc(t.yt)}" style="--ar:${esc(t.ar)}" aria-label="${esc(t.t)} 영상 재생"><img src="${esc(t.poster)}" alt="" loading="lazy" decoding="async"/><span class="pl" aria-hidden="true"></span></button>
  <div class="body"><div><h3>${esc(t.t)}</h3><p class="tools">${esc(t.tools.join(" · "))}</p><p class="desc">${esc(t.desc)}</p></div>
  <dl>${t.meta.map(m=>`<dt>${esc(m[0])}</dt><dd>${esc(m[1])}</dd>`).join("")}</dl></div></article>`).join("");}

function sectionHTML(s,idx){
 const head=(nav)=>`<div class="wrap sh"><div><span class="num">${idx+1}</span><h2 id="${s.id}h">${esc(s.t)}</h2>${s.duty?`<p class="duty">${esc(s.duty)}</p>`:""}</div>${nav?`<div class="nv"><span class="c" aria-live="polite"></span><button type="button" data-dir="-1" aria-label="이전 카드">←</button><button type="button" data-dir="1" aria-label="다음 카드">→</button></div>`:""}</div>`;
 if(s.kind)return `<section class="sec" id="${s.id}" aria-labelledby="${s.id}h">${head(false)}<div class="wrap"><div class="blocks">${s.kind==="lab"?labBlocks():top3Blocks()}</div></div></section>`;
 let body=s.ids.map((id,i)=>workCard(WORK.get(id),idx,i)).join("");if(s.tool)body+=toolCard();
 return `<section class="sec${s.rows?" rows":""}" id="${s.id}" aria-labelledby="${s.id}h">${head(!s.rows)}<div class="trk"><div class="track${s.rows?" rows":""}" data-track${s.rows?' data-rows="1"':""}>${body}</div></div></section>`;}
document.getElementById("main").innerHTML=SECS.map(sectionHTML).join("");

/* ---------- preview autoplay (IntersectionObserver, max 6) ---------- */
const MAX=6;let lbOpen=false;
const inView=new Set();
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)inView.add(e.target);else inView.delete(e.target);});reconcile();},{threshold:.2});
const allPv=[...document.querySelectorAll("video.pvv")];
allPv.forEach(v=>{v.addEventListener("playing",()=>v.classList.add("on"));v.addEventListener("pause",()=>v.classList.remove("on"));v.addEventListener("error",()=>v.classList.remove("on"));io.observe(v);});
function reconcile(){let n=0;allPv.forEach(v=>{const want=inView.has(v)&&!lbOpen&&!RM&&!document.hidden;if(want&&n<MAX){n++;if(!v.getAttribute("src"))v.src=v.dataset.src;if(v.paused)v.play().catch(()=>{});}else if(!v.paused)v.pause();});}
document.addEventListener("visibilitychange",reconcile);

/* ---------- layout: rows (wrapped, equal height per row) vs track ---------- */
const mqRows=matchMedia("(max-width:900px)"),mqOne=matchMedia("(max-width:520px)");
const hprobe=document.getElementById("hprobe");
const tracks=[...document.querySelectorAll("[data-track]")];
function cardsOf(t){return [...t.children];}
function padStart(t){return parseFloat(getComputedStyle(t).paddingLeft)||0;}
function layoutTrack(t){
 const rows=!!t.dataset.rows||mqRows.matches;
 t.classList.toggle("rows",rows);t.closest(".sec").classList.toggle("rows",rows);
 const cards=cardsOf(t);
 if(!rows){cards.forEach(c=>{c.style.width="";const m=c.querySelector(".pv");if(m)m.style.height="";});updateNav(t);return;}
 t.parentElement.classList.remove("more");
 const cs=getComputedStyle(t),W=Math.floor(t.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)),g=parseFloat(cs.columnGap)||0;
 if(W<=0)return;
 const per=mqOne.matches?1:mqRows.matches?2:Infinity,Ht=hprobe.offsetHeight||440;
 const items=cards.map(c=>({el:c,ar:parseFloat(c.dataset.ar)||1,full:!!c.dataset.full}));
 const R=[];
 if(per===Infinity){let row=[],sum=0,prevH=0;
  items.forEach(it=>{if(it.full){if(row.length){R.push({row,H:prevH||Ht});row=[];sum=0;}R.push({row:[it],full:true});return;}
   row.push(it);sum+=it.ar;if(sum*Ht+(row.length-1)*g>=W){prevH=(W-(row.length-1)*g)/sum;R.push({row,H:prevH,just:true});row=[];sum=0;}});
  if(row.length){const s=row.reduce((a,b)=>a+b.ar,0),H=Math.min(prevH||Ht,Ht,(W-(row.length-1)*g)/s);R.push({row,H});}
 }else if(per===2){for(let i=0;i<items.length;){const a=items[i];
  if(a.full){R.push({row:[a],full:true});i++;continue;}
  if(a.ar>1.25){R.push({row:[a],H:W/a.ar,just:true});i++;continue;}
  const b=items[i+1];
  if(b&&!b.full&&b.ar<=1.25){R.push({row:[a,b],H:(W-g)/(a.ar+b.ar),just:true});i+=2;}
  else{const w=(W-g)/2;R.push({row:[a],H:w/a.ar});i++;}}
 }else items.forEach(a=>R.push(a.full?{row:[a],full:true}:{row:[a],H:W/a.ar,just:true}));
 R.forEach(r=>{if(r.full){r.row[0].el.style.width=W+"px";return;}
  const H=Math.floor(r.H);let used=0;
  r.row.forEach((it,k)=>{let w=Math.floor(H*it.ar);if(r.just&&k===r.row.length-1)w=W-(r.row.length-1)*g-used;used+=w;it.el.style.width=w+"px";const m=it.el.querySelector(".pv");if(m)m.style.height=H+"px";});});
}
function layoutAll(){tracks.forEach(layoutTrack);}
let rafL=0;addEventListener("resize",()=>{cancelAnimationFrame(rafL);rafL=requestAnimationFrame(layoutAll);});
mqRows.addEventListener("change",layoutAll);mqOne.addEventListener("change",layoutAll);

/* ---------- tracks: buttons · keys (vertical wheel is never hijacked) ---------- */
function curIndex(t){const cs=cardsOf(t),x=t.scrollLeft+padStart(t)+2;let k=0;cs.forEach((c,i)=>{if(c.offsetLeft<=x)k=i;});return k;}
function goTo(t,i,smooth=true){const cs=cardsOf(t);i=Math.max(0,Math.min(cs.length-1,i));t.scrollTo({left:cs[i].offsetLeft-padStart(t),behavior:smooth&&!RM?"smooth":"auto"});}
function updateNav(t){const nv=t.closest(".sec").querySelector(".nv");if(!nv||t.classList.contains("rows"))return;const cs=cardsOf(t),i=curIndex(t),max=t.scrollWidth-t.clientWidth,last=cs[cs.length-1];
 const lastRight=last?last.offsetLeft+last.offsetWidth-t.scrollLeft:0,allIn=t.scrollLeft<=2&&lastRight<=t.clientWidth+1;
 nv.querySelector(".c").textContent=`${i+1} / ${cs.length}`;nv.classList.toggle("off",max<=2||allIn);
 t.parentElement.classList.toggle("more",!(max<=2||allIn)&&lastRight>t.clientWidth+1);
 nv.querySelector('[data-dir="-1"]').disabled=t.scrollLeft<=2;nv.querySelector('[data-dir="1"]').disabled=max<=2||t.scrollLeft>=max-2||lastRight<=t.clientWidth+1;}
tracks.forEach(t=>{
 const sec=t.closest(".sec");
 sec.querySelectorAll(".nv button").forEach(b=>b.addEventListener("click",()=>goTo(t,curIndex(t)+ +b.dataset.dir)));
 t.addEventListener("scroll",()=>updateNav(t),{passive:true});
 t.addEventListener("keydown",e=>{if(t.classList.contains("rows"))return;const cs=cardsOf(t);let i=-1;const f=document.activeElement,fc=f&&f.closest?f.closest(".card"):null;if(fc)i=cs.indexOf(fc);
  const step=d=>{const k=i>=0?i+d:curIndex(t)+d;const j=Math.max(0,Math.min(cs.length-1,k));const b=cs[j].querySelector("button");if(b)b.focus({preventScroll:true});goTo(t,j);};
  if(e.key==="ArrowRight"){e.preventDefault();step(1);}else if(e.key==="ArrowLeft"){e.preventDefault();step(-1);}else if(e.key==="Home"){e.preventDefault();i=0;step(0);}else if(e.key==="End"){e.preventDefault();i=cs.length-1;step(0);}});
});
layoutAll();
/* focus into a card while scrolling keeps it aligned */
document.addEventListener("focusin",e=>{const c=e.target.closest&&e.target.closest(".card");const t=c&&c.parentElement;if(t&&t.hasAttribute("data-track")&&!t.classList.contains("rows")){const l=c.offsetLeft-padStart(t),r=l+c.offsetWidth;if(l<t.scrollLeft||r>t.scrollLeft+t.clientWidth)t.scrollTo({left:l,behavior:"auto"});}});

/* ---------- fixed toc bar ---------- */
const bar=document.getElementById("bar"),toc=document.querySelector(".toc");
new IntersectionObserver(es=>{const past=!es[0].isIntersecting&&es[0].boundingClientRect.top<0;bar.classList.toggle("on",past);bar.setAttribute("aria-hidden",String(!past));bar.querySelectorAll("a").forEach(a=>a.tabIndex=past?0:-1);},{threshold:0}).observe(toc);
const barLinks=[...bar.querySelectorAll("a")];
const secIO=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)barLinks.forEach(a=>a.classList.toggle("cur",a.dataset.s===e.target.id));});},{rootMargin:"-40% 0px -55% 0px",threshold:0});
document.querySelectorAll("section.sec").forEach(s=>secIO.observe(s));

/* ---------- YouTube inline ---------- */
document.querySelectorAll(".yt").forEach(b=>b.addEventListener("click",()=>{const f=document.createElement("iframe");f.src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(b.dataset.yt)}?autoplay=1&rel=0&playsinline=1`;f.title=b.getAttribute("aria-label");f.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";const d=document.createElement("div");d.className="yt";d.setAttribute("style",b.getAttribute("style"));d.appendChild(f);b.replaceWith(d);f.focus();}));

/* ---------- lightbox ---------- */
const lb=document.getElementById("lb"),lbS=document.getElementById("lbS"),lbF=document.getElementById("lbF"),lbTh=document.getElementById("lbTh"),lbCtx=document.getElementById("lbCtx"),lbT=document.getElementById("lbT"),lbC1=document.getElementById("lbC1"),lbC2=document.getElementById("lbC2"),lbN=document.getElementById("lbN"),lbPrev=document.getElementById("lbPrev"),lbNext=document.getElementById("lbNext"),lbX=document.getElementById("lbX");
let cur={sec:0,i:0},trigger=null,gallery=[],gIdx=0,chipToken=0;
function galleryOf(w){const g=[],seen=new Set(),push=m=>{if(!m.src||seen.has(m.src))return;seen.add(m.src);g.push(m);};
 if(w.full)push({kind:"video",src:w.full,poster:w.poster,ar:arNum(w.ar),label:"본편"});
 (w.variants||[]).forEach(v=>push({kind:"video",src:v.full,poster:v.poster,ar:arNum(v.ar||w.ar),label:v.label}));
 (w.pkg||[]).forEach(p=>push({kind:p.type==="video"?"video":"image",src:p.url,ar:resAr(p.res),label:resFmt(p.res)}));
 g.sort((a,b)=>(a.kind==="image")-(b.kind==="image"));
 const cnt={};g.forEach(m=>{cnt[m.label]=(cnt[m.label]||0)+1;});const seenL={};g.forEach(m=>{if(cnt[m.label]>1){seenL[m.label]=(seenL[m.label]||0)+1;m.label=`${m.label} ${"①②③④⑤⑥⑦⑧⑨"[seenL[m.label]-1]||seenL[m.label]}`;}});
 return g;}
function fitBox(){const box=lbS.querySelector(".box");if(!box)return;const cs=getComputedStyle(lbS),W=lbS.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),H=lbS.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom),ar=parseFloat(box.dataset.ar)||1;let w=H*ar,h=H;if(w>W){w=W;h=W/ar;}box.style.width=Math.floor(w)+"px";box.style.height=Math.floor(h)+"px";}
new ResizeObserver(fitBox).observe(lbS);
function clearStage(){const v=lbS.querySelector("video");if(v){v.pause();v.removeAttribute("src");v.load();}lbS.innerHTML="";}
function showMedia(k){gIdx=k;const m=gallery[k];clearStage();
 const box=document.createElement("div");box.className="box";box.dataset.ar=m.ar;
 if(m.kind==="video"){const v=document.createElement("video");v.controls=true;v.playsInline=true;v.preload="metadata";if(m.poster)v.poster=m.poster;v.setAttribute("aria-label",lbT.textContent+" — "+m.label);v.src=m.src;v.muted=false;v.volume=1;v.addEventListener("loadedmetadata",()=>{if(v.videoWidth&&v.videoHeight){box.dataset.ar=v.videoWidth/v.videoHeight;fitBox();}});box.appendChild(v);lbS.appendChild(box);fitBox();v.play().catch(()=>{});}
 else{const i=document.createElement("img");i.alt=lbT.textContent+" "+m.label;i.decoding="async";i.addEventListener("load",()=>{if(i.naturalWidth&&i.naturalHeight){box.dataset.ar=i.naturalWidth/i.naturalHeight;fitBox();}});i.src=m.src;box.appendChild(i);lbS.appendChild(box);fitBox();}
 lbTh.querySelectorAll("button").forEach((b,j)=>{b.setAttribute("aria-pressed",String(j===k));if(j===k)b.scrollIntoView({block:"nearest",inline:"nearest"});});}
function showGrid(){clearStage();const d=document.createElement("div");d.className="igrid";d.innerHTML=gallery.map(m=>`<figure><img src="${esc(m.src)}" alt="${esc(m.label)}" loading="lazy" decoding="async" style="aspect-ratio:${m.ar}"/><figcaption>${esc(m.label)}</figcaption></figure>`).join("");lbS.appendChild(d);}
/* chip thumbnails: shape + label; real images load one after another (never all at once) */
function chipHTML(m,j){const ar=m.ar||1,w=ar>=1?30:Math.max(6,Math.round(30*ar)),h=ar>=1?Math.max(6,Math.round(30/ar)):30,img=m.kind==="image"?m.src:m.poster;
 return `<button type="button" class="ch" aria-pressed="${j===0}" aria-label="${esc(m.label)} ${m.kind==="video"?"영상":"이미지"}"><span class="sp${img?" im":""}" style="--w:${w}px;--h:${h}px">${img?`<img alt="" data-src="${esc(img)}" decoding="async"/>`:""}</span><span>${esc(m.label)}</span></button>`;}
function loadChips(){const tk=++chipToken,q=[...lbTh.querySelectorAll("img[data-src]")];(function next(){if(tk!==chipToken)return;const i=q.shift();if(!i)return;i.onload=i.onerror=next;i.src=i.dataset.src;i.removeAttribute("data-src");})();}
function renderItem(){const s=SECS[cur.sec],w=WORK.get(s.ids[cur.i]),c=capOf(w);
 lbT.textContent=w.title;lbC1.textContent=c[0];lbC2.textContent=c[1];lbN.textContent=`${cur.i+1} / ${s.ids.length}`;lbCtx.textContent=`${cur.sec+1} ${s.t}`;
 lbPrev.disabled=cur.i<=0;lbNext.disabled=cur.i>=s.ids.length-1;
 gallery=galleryOf(w);const hasVideo=gallery.some(m=>m.kind==="video");chipToken++;
 if(!hasVideo){lbTh.innerHTML="";lbF.hidden=true;showGrid();return;}
 lbTh.innerHTML=gallery.length>1?gallery.map(chipHTML).join(""):"";lbF.hidden=gallery.length<=1;
 lbTh.querySelectorAll("button").forEach((b,j)=>b.addEventListener("click",()=>showMedia(j)));
 showMedia(0);loadChips();}
function openLB(sec,i,trig){cur={sec,i};trigger=trig||document.activeElement;lbOpen=true;reconcile();document.documentElement.classList.add("lock");lb.hidden=false;renderItem();lbX.focus();}
function closeLB(){chipToken++;clearStage();lbTh.innerHTML="";lb.hidden=true;document.documentElement.classList.remove("lock");lbOpen=false;reconcile();if(trigger&&trigger.focus)trigger.focus();trigger=null;}
function navLB(d){const s=SECS[cur.sec],j=cur.i+d;if(j<0||j>=s.ids.length)return;cur.i=j;renderItem();const b=document.querySelector(`.card[data-sec="${cur.sec}"][data-i="${j}"] .pv`);if(b)trigger=b;
 const a=document.activeElement;if(!a||!lb.contains(a)||a.disabled){const alt=d>0?lbPrev:lbNext;(alt.disabled?lbX:alt).focus();}}
document.querySelectorAll(".card[data-sec]").forEach(c=>{const open=()=>openLB(+c.dataset.sec,+c.dataset.i,c.querySelector(".pv"));c.querySelector(".pv").addEventListener("click",open);c.querySelector("figcaption").addEventListener("click",open);});
lbX.addEventListener("click",closeLB);lbPrev.addEventListener("click",()=>navLB(-1));lbNext.addEventListener("click",()=>navLB(1));
lb.addEventListener("click",e=>{if(e.target===lb||e.target===lbS)closeLB();});
document.addEventListener("keydown",e=>{if(lb.hidden)return;
 if(e.key==="Escape"){e.preventDefault();closeLB();return;}
 const onVideo=e.target&&e.target.tagName==="VIDEO";
 if(e.key==="ArrowRight"&&!onVideo){e.preventDefault();navLB(1);return;}
 if(e.key==="ArrowLeft"&&!onVideo){e.preventDefault();navLB(-1);return;}
 if(e.key==="Tab"){const f=[...lb.querySelectorAll("button:not(:disabled),video[controls],[tabindex='0']")].filter(x=>x.offsetParent!==null);if(!f.length)return;const a=document.activeElement,first=f[0],last=f[f.length-1];
  if(e.shiftKey&&(a===first||!lb.contains(a))){e.preventDefault();last.focus();}else if(!e.shiftKey&&(a===last||!lb.contains(a))){e.preventDefault();first.focus();}}});
</script>
