const ICON = {
  heart: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>',

  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',

};
let mcp = null, db = null, downloads = null;
const S = { projects: FALLBACK.slice(), pid: null, view: "hf", folder: "all", order: "new", items: [], total: 0, offset: 0, loading: false,
  sel: new Set(), lastSel: null, mirror: new Map(), pins: [SANTA, PERSONA], ext: { alive: null }, refs: [] };
try { const c = localStorage.getItem("hfw_tile"); if (c) document.documentElement.style.setProperty("--tile", c + "px"); } catch (e) {}

/* ── 공통 ─────────────────────────────────────────── */
let toastT = null;
function toast(t, ms = 2600) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true }, ms); }
async function tool(name, args) {
  if (!mcp) throw { code: "no_mcp" };
  const r = await mcp.callTool(HFQ, name, args || {}, { cache: false });
  const p = r.payload !== undefined ? r.payload : (r.content || []).map(c => c.text || "").join("\n");
  if (typeof p === "string" && p.startsWith("오류:")) throw new Error(p.slice(3).trim());
  return p;
}
const errText = e => e && e.code === "no_mcp" ? "claude.ai에서 열어야 힉스필드와 연결돼요." :
  e && e.code === "not_granted" ? "hfq-mcp 연결을 허용해 주세요." :
  e && (e.code === "server_not_connected" || e.code === "needs_reauth") ? "hfq-mcp 커넥터 연결을 확인해 주세요." :
  "힉스필드 연동 오류" + (e && (e.message || e.code) ? ": " + String(e.message || e.code).slice(0, 120) : "");
const proj = id => S.projects.find(p => p.id === id) || FALLBACK.find(p => p.id === id) || null;
const cur = () => proj(S.pid);
const jobOf = img => img.job || ((String(img.hf || "").match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/) || [])[0]) || null;
const arCss = ar => { const m = String(ar || "4:3").split(":").map(Number); return m.length === 2 && m[0] && m[1] ? `${m[0]}/${m[1]}` : "4/3"; };

/* ── 프로젝트 목록·전환 ───────────────────────────── */
async function loadProjects() {
  try {
    const d = await tool("projects", {});
    if (d && Array.isArray(d.projects) && d.projects.length) {
      S.projects = d.projects;
      for (const f of FALLBACK) if (!S.projects.find(p => p.id === f.id)) S.projects.push(f);
    }
  } catch (e) { }
  renderHeader();
  if (S.view === "cast") renderCastBar();
}
function sortedProjects() {
  const pins = S.pins.map(id => proj(id)).filter(Boolean);
  const rest = S.projects.filter(p => !S.pins.includes(p.id));
  return { pins, rest };
}
function dot(p) { return COLORS[p && p.color] || "#7f7f7f"; }

    $("#pTitle").textContent = p.name;

}

  const q = $("#pSearch").value.trim().toLowerCase();

    const list = arr.filter(p => !q || (p.name || "").toLowerCase().includes(q));

      const row = document.createElement("div"); row.className = "pit"; row.setAttribute("role", "option"); row.tabIndex = 0;
      row.dataset.id = p.id; row.dataset.active = String(p.id === S.pid);

      row.querySelector(".nm").textContent = p.name;
      row.addEventListener("click", e => { if (e.target.closest(".pin")) return; closePop(); openProject(p.id); });
      row.addEventListener("keydown", e => { if (e.key === "Enter") { closePop(); openProject(p.id); } });

async function loadItems(reset) {

  if (S.loading) return; S.loading = true;
  const args = { project: p.id, offset: S.offset, limit: 60, order: S.order };
  if (S.folder === "liked") args.liked = true; else if (S.folder === "loose") args.loose = true; else if (S.folder !== "all") args.folder = S.folder;
  try {
    const d = await tool("items", args);
    const pidNow = p.id;
    if (S.pid !== pidNow) return;
    S.total = d.total || 0; S.items = S.items.concat(d.items || []); S.offset = S.items.length;
    if (p.id === SANTA) for (const it of d.items || []) S.mirror.set(it.job_id, it);
    renderGrid();
  } catch (e) {
    const msg = /찾지 못했어요/.test(String(e.message || "")) ? "아직 힉스필드와 동기화되지 않았어요. 확장이 켜져 있으면 1~2분 안에 채워져요." : errText(e);
    if (reset) $("#hGrid").innerHTML = `<div class="empty">${esc(msg)}</div>`;
  } finally { S.loading = false; }
}
function folderName(id) { const f = ((cur() || {}).folders || []).find(x => x.id === id); return f ? f.name : null; }
function renderGrid() {
  const g = $("#hGrid");
  if (!S.items.length) { g.innerHTML = `<div class="empty">${S.folder === "liked" ? "좋아요한 이미지가 없어요." : "이미지가 없어요."}</div>`; $("#moreBtn").hidden = true; return; }
  g.innerHTML = "";
  S.items.forEach((it, idx) => {
    const t = document.createElement("div"); t.className = "tile"; t.dataset.i = idx;
    t.setAttribute("aria-selected", String(S.sel.has(it.job_id)));

      <div class="ov"><button class="ck" type="button" aria-label="선택" aria-pressed="${S.sel.has(it.job_id)}">${ICON.check}</button>
      <button class="hrt" type="button" aria-label="좋아요" aria-pressed="${!!it.is_fav}">${it.is_fav ? ICON.heart : ICON.heartO}</button></div>
      ${fl.length && S.folder === "all" ? `<span class="fl"></span>` : ""}`;
    if (it.is_fav) t.querySelector(".ov").classList.add("keep");
    if (fl.length && S.folder === "all") t.querySelector(".fl").textContent = fl.join(" · ");
    const img = t.querySelector("img");

    img.onerror = () => thumbFallback(img, it);
    img.src = it.min_url || it.raw_url || "";
    t.addEventListener("click", e => {
      if (e.target.closest(".ck")) { toggleSel(it, idx, e.shiftKey); return; }
      if (e.target.closest(".hrt")) { like([it.job_id], !it.is_fav); return; }

const thumbQ = []; let thumbBusy = 0;

try { const c = localStorage.getItem("cols"); if (c === "2" || c === "3") setCols(c); } catch (e) {}

/* 자동 라운드(피드백 완료) */
const FIRE_ERR = { needs_reauth: "Claude Code Remote 연결이 만료됐어요. claude.ai 설정의 커넥터에서 다시 연결해 주세요.", server_not_connected: "Claude Code Remote 커넥터가 연결돼 있지 않아요.", approval_required: "자동 실행 승인이 필요해요. 버튼을 다시 누르고 뜨는 창에서 허용해 주세요.", not_in_manifest: "이 작업공간에서 자동 실행이 허용되지 않았어요. 버튼을 다시 누르고 허용해 주세요.", blocked_by_policy: "조직 정책이 자동 실행을 막고 있어요." };
async function fire(text) { if (!mcp) throw { code: "no_mcp" }; return mcp.callTool("Claude Code Remote", "fire_trigger", { trigger_id: TRIGGER_ID, text }); }
const fireErr = e => { const c = e && e.code || ""; const d = (e && e.message ? String(e.message) : "").replace(/\s+/g, " ").slice(0, 140);
  if (c === "no_mcp") return "claude.ai에서 열어야 자동 실행을 부를 수 있어요.";
  if (FIRE_ERR[c]) return FIRE_ERR[c];
  if (/not.?found|disabled|enabled/i.test(d)) return "자동 실행 작업을 찾지 못했거나 꺼져 있어요. Claude에게 '라운드 자동 실행 켜줘'라고 말해 주세요. (" + (c || "error") + ")";
  return "자동 실행 요청이 실패했어요. 잠시 후 다시 눌러 주세요." + (c || d ? " (" + [c, d].filter(Boolean).join(": ") + ")" : ""); };

/* ── 시작 ─────────────────────────────────────────── */
(async () => {
  try { S.pid = localStorage.getItem("hfw_pid") || SANTA; } catch (e) { S.pid = SANTA; }
  openProject(S.pid);
  db = window.claude ? await window.claude.use("db") : null;
  mcp = window.claude ? await window.claude.use("mcp") : null;
  window.claude && window.claude.use("downloads").then(d => { downloads = d; requestRender(); });
  try { if (localStorage.getItem("hfw_mode") === "cast") setView("cast", true); } catch (e) {}
  if (mcp) { await loadProjects(); renderFolders(); if (S.view === "hf") loadItems(true); pollExt(); setInterval(pollExt, 30000); setInterval(loadProjects, 90000); document.addEventListener("visibilitychange", pollExt); loadMirror(); }
  else { setExt("", "claude.ai에서 열어 주세요"); if (S.view === "hf") $("#hGrid").innerHTML = '<div class="empty">claude.ai에서 열어야 힉스필드 프로젝트를 불러올 수 있어요.</div>'; }
  if (!db) { $("#grid").innerHTML = '<div class="empty">로그인한 상태에서 열어야 평가 데이터를 불러올 수 있어요.</div>'; return; }
  db.doc("ws/main").onSnapshot(d => { const v = d.data && d.data(); if (v && Array.isArray(v.pins)) { S.pins = v.pins; renderHeader(); } });
  db.collection("images").onSnapshot(snap => { E.images = snap.docs.map(d => ({ id: d.id, ...d.data() })); E.gotImages = true; reconcile(); requestRender(); });
  db.collection("scores").onSnapshot(snap => { const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); Object.keys(drafts).forEach(id => { if (m[id]) m[id] = { ...m[id], memo: drafts[id] }; }); E.scores = m; E.gotScores = true; reconcile(); requestRender(); });
  let rounds = [];
  const rnum = r => parseInt(String(r.round || r.id).replace(/\D/g, "")) || 0;
  function renderRoundPanel() {
    rounds.sort((a, b) => rnum(b) - rnum(a));
    const ol = $("#rpList"); ol.innerHTML = "";
    rounds.forEach(r => { const li = document.createElement("li");
      const n = document.createElement("span"); n.className = "rn"; n.textContent = r.round || r.id;
      const b = document.createElement("div"); b.className = "rb";
      const p = document.createElement("span"); p.className = "pill"; p.dataset.s = r.status || ""; p.textContent = STATUS[r.status] || r.status || ""; p.style.alignSelf = "flex-start"; b.appendChild(p);
      const txt = r.summary || r.request; if (txt) { const s = document.createElement("div"); s.className = "rs"; s.textContent = txt; b.appendChild(s); }
      if (r.status === "blocked" && r.reason) { const s = document.createElement("div"); s.className = "rr"; s.textContent = "막힌 이유: " + r.reason; b.appendChild(s); }
      if (r.analysis) { const a = document.createElement("div"); a.className = "ra"; a.textContent = Array.isArray(r.analysis) ? r.analysis.join("\n") : r.analysis; b.appendChild(a); }
      if (r.ask) { const k = document.createElement("div"); k.className = "ask"; k.textContent = r.ask; b.appendChild(k); }
      li.append(n, b); ol.appendChild(li); });
    const busy = rounds.find(r => r.status === "queued" || r.status === "generating");
    const lastReady = rounds.find(r => r.status === "ready");
    const prev = evalBusy && evalBusy.round;
    evalBusy = busy ? { round: busy.round || busy.id, batch: busy.batch || ("santa_" + (busy.round || busy.id)) } : null;
    if ((evalBusy && evalBusy.round) !== prev) pollExt();
    const pill = $("#rpPill");
    if (busy) { pill.dataset.s = busy.status; pill.textContent = `${busy.round || busy.id} ${STATUS[busy.status]}`; }
    else if (lastReady) { pill.dataset.s = "ready"; pill.textContent = `${lastReady.round || lastReady.id} 평가 중`; }
    else { pill.dataset.s = ""; pill.textContent = ""; }
    $("#doneBtn").disabled = !!busy || !lastReady;
    $("#doneBtn").textContent = lastReady && !busy ? `${lastReady.round || lastReady.id} 피드백 완료` : "피드백 완료";
  }
  db.collection("rounds").onSnapshot(snap => { rounds = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderRoundPanel(); });
  $("#doneBtn").addEventListener("click", async () => {
    const lastReady = rounds.find(r => r.status === "ready"); if (!lastReady) return;
    const next = "R" + (rnum(lastReady) + 1);
    const { id: _omit, ...nextDoc } = rounds.find(r => (r.round || r.id) === next) || {};
    const prev = nextDoc.status || "planned";
    const btn = $("#doneBtn"), msg = $("#rpMsg"); btn.disabled = true; msg.textContent = "다음 라운드를 요청하는 중이에요.";
    try { await db.doc("rounds/" + next).set({ ...nextDoc, round: next, status: "queued", queuedAt: Date.now(), after: lastReady.round || lastReady.id }); }
    catch (e) { msg.textContent = "라운드 상태를 저장하지 못했어요. 로그인과 편집 권한을 확인해 주세요."; btn.disabled = false; return; }
    try { await fire(`${lastReady.round || lastReady.id} 피드백 완료. ${next} 진행.`);
      msg.textContent = S.ext.alive === false ? `${next} 진행을 요청했어요. 확장이 꺼져 있어 생성은 시작되지 않아요.` : `${next} 진행을 시작했어요. 몇 분 뒤 이미지가 여기에 쌓이고, 힉스필드 프로젝트의 「${next}」 폴더에도 들어가요.`; }
    catch (e) { msg.textContent = fireErr(e); try { await db.doc("rounds/" + next).set({ ...nextDoc, round: next, status: prev }); } catch (_) {} }
  });
  db.collection("feedback").onSnapshot(snap => {
    const items = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.at || 0) - (a.at || 0));
    const ol = $("#fbList"); ol.innerHTML = "";
    items.forEach(it => { const li = document.createElement("li");
      const t = document.createElement("time"); t.textContent = new Date(it.at || 0).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
      const p = document.createElement("div"); p.className = "t"; p.textContent = it.text || ""; li.append(t, p);
      if (it.reply) { const r = document.createElement("div"); r.className = "r"; const b = document.createElement("b"); b.textContent = "반영"; r.append(b, document.createTextNode(it.reply)); li.appendChild(r); }
      ol.appendChild(li); });
  });
  const send = $("#fbSend"), inp = $("#fbInput");
  send.addEventListener("click", async () => { const text = inp.value.trim(); if (!text) return; send.disabled = true;
    try { const at = Date.now(); await db.collection("feedback").doc(String(at)).set({ text, at }); inp.value = ""; }
    catch (e) { inp.setAttribute("aria-invalid", "true"); send.textContent = "다시 시도"; }
    finally { send.disabled = false; } });
})();
</script>

</body></html>
