<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8"><title>빵집 구도실 v17.1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 왼쪽 패널(샷·소품·인물·배치) + 3D 뷰(편집 뷰 / 폰 화면) + 오른쪽 위 선택 카드 + 오른쪽 아래 PIP·레퍼런스. 라이트 고정 */
:root{
  --bg:#efeee9; --paper:#fbfaf7; --ink:#1d1c1a; --sub:#6b6862; --line:#dedad2; --acc:#2f5fd0; --ok:#1f8a5b; --warn:#c2410c; --view:#c9c6bf; --bar:44px;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:13px;line-height:1.45;overflow:hidden}
.app{display:grid;grid-template-columns:300px 1fr;height:calc(100% - var(--bar));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.side{background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;font:inherit;font-weight:600;padding:10px 0;border:0;background:none;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.pane{flex:1;overflow:auto;padding:10px 12px;display:none;flex-direction:column;gap:10px;min-height:0}
.pane.on{display:flex}
.grp{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.04em;margin-top:4px}
.shot{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit}
.shot.on{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.shot img,.shot .noimg{width:44px;height:66px;object-fit:cover;border-radius:4px;background:#e7e4dd}
.shot .nm{font-weight:600}.shot .meta{font-family:var(--f-mono);font-size:11px;color:var(--sub)}
.tag{font-size:11px;font-weight:600}.tag.sv{color:var(--ok)}.tag.dr{color:var(--warn)}
.item{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;cursor:pointer}
.item:hover{background:#f1efe9}.item.on{background:#e3ebfb}.item.off .nm{color:var(--sub);text-decoration:line-through}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button.b{font:inherit;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;color:var(--ink)}
button.b.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.b.sm{padding:3px 8px;font-size:12px}
button.b:disabled{opacity:.4;cursor:default}
.field{display:grid;grid-template-columns:62px 1fr 52px;gap:6px;align-items:center}
.field input[type=range]{width:100%}
.field .v{font-family:var(--f-mono);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lib button{font:inherit;text-align:left;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 8px;cursor:pointer}
.lib button:hover{border-color:var(--acc)}
.main{position:relative;min-width:0;min-height:0;background:var(--view)}
canvas#c{display:block;width:100%;height:100%;touch-action:none}
/* 위 막대: 왼쪽 화면 전환(hud) + 오른쪽 편집 도구(tools)를 한 줄 흐름으로 — 좁으면 줄바꿈되고 서로 겹치지 않음. 빈 곳은 3D 뷰로 클릭이 통과 */
.topbar{position:absolute;left:10px;right:10px;top:10px;z-index:4;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;flex-wrap:wrap;pointer-events:none}
.topbar button{pointer-events:auto}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.hud button{font:inherit;font-weight:600;border:1px solid var(--line);background:rgba(251,250,247,.95);border-radius:999px;padding:6px 12px;cursor:pointer}
.hud button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.tools button{font:inherit;font-weight:600;border:1px solid var(--line);background:rgba(251,250,247,.96);border-radius:999px;padding:6px 12px;cursor:pointer}
.tools button.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tools button:disabled{opacity:.4;cursor:default}
.tools button.dirty{box-shadow:0 0 0 2px var(--warn)}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.presets button{font:inherit;font-weight:600;text-align:left;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 8px;cursor:pointer}
.presets button:hover{border-color:var(--acc)}
.card{position:absolute;right:10px;top:56px;z-index:3;overflow:auto;background:rgba(251,250,247,.97);border:1px solid var(--line);border-radius:10px;padding:10px;display:none;flex-direction:column;gap:8px;min-width:200px;max-width:260px}
.card .t{font-weight:700;font-size:14px}.card .k{font-family:var(--f-mono);font-size:11px;color:var(--sub)}
.read{position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:3;font-family:var(--f-mono);font-size:11px;background:rgba(251,250,247,.95);border:1px solid var(--line);border-radius:8px;padding:6px 8px;line-height:1.5;font-variant-numeric:tabular-nums;white-space:pre}
.ov{position:absolute;pointer-events:none;z-index:2;display:none}
.refbox{position:absolute;z-index:2;display:none;border:1px solid var(--line);background:#2a2927;border-radius:6px;overflow:hidden}
.refbox img{width:100%;height:100%;object-fit:contain;display:block}
.pipcap{position:absolute;z-index:3;font-size:11px;font-weight:600;color:#fff;background:rgba(29,28,26,.7);border-radius:4px;padding:1px 6px;pointer-events:none}
.frame{position:absolute;pointer-events:none;border:1px solid rgba(29,28,26,.55);z-index:2;display:none}
.frame::after{content:"";position:absolute;inset:33.3% 0;border-top:1px dashed rgba(255,255,255,.35);border-bottom:1px dashed rgba(255,255,255,.35)}
.pad{position:absolute;left:10px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:3;display:none;grid-template-columns:repeat(3,38px);gap:4px}
.pad button{height:38px;font:inherit;font-weight:700;border:1px solid var(--line);background:rgba(251,250,247,.95);border-radius:8px;cursor:pointer}
.toast{position:fixed;left:50%;top:calc(var(--bar) + 12px + env(safe-area-inset-top,0px));z-index:60;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:7px 14px;border-radius:999px;font-size:12px;display:none;z-index:60;pointer-events:none;max-width:calc(100% - 40px);text-align:center}
.toast.bad{background:var(--warn)}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--sub);z-index:4;text-align:center;padding:20px}
.note{font-size:12px;color:var(--sub)}
.gen{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px}
.gen .sum{font-size:12px;font-weight:600;line-height:1.5}
.gen .pr{font-family:var(--f-mono);font-size:11px;color:var(--sub);max-height:110px;overflow:auto;white-space:pre-wrap;word-break:break-word;border:1px solid var(--line);border-radius:6px;padding:6px;background:#fbfaf7}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:#f1efe9;color:var(--sub)}
.chip.run{background:#e3ebfb;color:var(--acc)}.chip.done{background:#e3f5ec;color:var(--ok)}.chip.fail{background:#fde8e0;color:var(--warn)}
.chip.run::before{content:"";width:8px;height:8px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.srow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:stretch}
.srow .hold{align-self:center;color:var(--sub)}.srow .hold.on{background:var(--warn);border-color:var(--warn);color:#fff}
.srow.held .shot{opacity:.55}
.jc{display:inline-flex;margin-left:4px}.jc .chip{font-size:11px;padding:1px 8px}
.allbar{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px}
.allbar .sum{font-size:12px;font-weight:600;line-height:1.5;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.gen .err{font-size:12px;color:var(--warn);word-break:break-word}
.gen img.res{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:6px;cursor:zoom-in;display:block;background:#e7e4dd}
.gen .meta{font-family:var(--f-mono);font-size:11px;color:var(--sub)}
.keys{font-size:11px;color:var(--sub);line-height:1.6}
.keys b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:#fff}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr 42%}
  .side{order:2;border-right:0;border-top:1px solid var(--line)}
  .main{order:1}
  .read{font-size:10px}.card{max-width:200px;min-width:160px}
  .topbar{gap:5px}.hud,.tools{gap:5px}.topbar button{padding:5px 9px;font-size:12px}
  .topbar .lg{display:none}
}
@media (min-width:761px){.topbar .sh{display:none}}
/* v17: 위 탭 막대(3D 구도실 · 생성 직전 시트 · 포즈 후보) + 시트·포즈 화면(화면 너비만큼 자동 열 수) + 크게 보기 */
.appbar{height:var(--bar);display:flex;align-items:center;gap:10px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--paper);border-bottom:1px solid var(--line);position:relative;z-index:30}
.vt{display:flex;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none}
.vt button{font:inherit;font-weight:700;font-size:13px;border:0;background:none;color:var(--sub);padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
.vt button:hover{color:var(--ink);background:#f1efe9}
.vt button.on{background:var(--ink);color:var(--paper)}
.sync{margin-left:auto;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:#b9b5ad}.dot.on{background:var(--ok)}.dot.off{background:var(--warn)}
.hud .back{background:var(--acc);color:#fff;border-color:var(--acc)}
.view{position:fixed;left:0;right:0;top:calc(var(--bar) + env(safe-area-inset-top,0px));bottom:0;z-index:20;overflow:auto;overscroll-behavior:contain;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
.s-bar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:10px;border-bottom:1px solid var(--line)}
.s-chips{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.s-chip{font:inherit;font-family:var(--f-mono);font-size:12px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.s-chip b{font-weight:500;color:var(--sub);font-variant-numeric:tabular-nums}
.s-chip.done{border-color:var(--ok)}.s-chip.done b{color:var(--ok)}
.s-chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}.s-chip.on b{color:#c9c6bf}
.s-tools{display:flex;gap:10px;align-items:center;margin-left:auto;font-size:12px;color:var(--sub)}
.s-tg{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.s-btn{font:inherit;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.s-btn:disabled{opacity:.4;cursor:default}
.s-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px;padding-top:12px;align-items:start}
.s-empty{grid-column:1/-1;padding:40px 0;text-align:center;color:var(--sub)}
.s-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:7px;min-width:0;transition:box-shadow .3s}
.s-card.s-pick{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.s-card.s-hid{opacity:.55}
.s-card.s-flash{box-shadow:0 0 0 3px var(--acc)}
.s-head{display:flex;align-items:center;gap:6px;min-width:0;min-height:26px}
.s-code{flex:none;font-family:var(--f-mono);font-size:13px;color:var(--acc)}
.s-name{min-width:0;font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-ok{flex:none;font-size:11px;font-weight:700;color:#fff;background:var(--ok);border-radius:999px;padding:1px 7px}
.s-hold{flex:none;margin-left:auto;font:inherit;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--sub);cursor:pointer}
.s-hold.on{background:var(--warn);border-color:var(--warn);color:#fff}
.s-card.s-held .s-pvw,.s-card.s-held .s-desc{opacity:.5}
.s-x{flex:none;margin-left:6px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:16px;line-height:1;cursor:pointer;padding:0}
.s-x:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.s-back{flex:none;margin-left:6px;font:inherit;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--acc);color:var(--acc);background:var(--paper);cursor:pointer}
.s-pvw{position:relative}
.s-pv{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:9/16;border:0;padding:0;border-radius:7px;overflow:hidden;background:#ddd9d1;cursor:pointer}
.s-pv img{width:100%;height:100%;object-fit:cover;display:block}
.s-mod{position:absolute;left:7px;top:7px;font-size:11px;font-weight:700;background:var(--ok);color:#fff;padding:2px 8px;border-radius:999px}
.s-open{position:absolute;left:7px;bottom:7px;font-size:12px;font-weight:700;background:var(--ink);color:#fff;padding:5px 10px;border-radius:999px}
.s-pv:hover .s-open{background:var(--acc)}
.s-dl{position:absolute;right:7px;bottom:7px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(251,250,247,.94);color:var(--ink);font-size:15px;font-weight:700;cursor:pointer}
.s-desc{font-size:12.5px;line-height:1.45}
.s-lab{font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:6px}.s-lab .s-btn{margin-left:auto;padding:1px 8px;font-size:11px}
.s-ev,.s-ph{display:flex;gap:5px;flex-wrap:wrap}
.s-ev img{width:46px;height:46px;object-fit:cover;border-radius:5px;cursor:zoom-in;display:block}
.s-p{position:relative;width:54px}
.s-p img{width:54px;height:54px;object-fit:cover;border-radius:5px;display:block;cursor:zoom-in;border:2px solid transparent}
.s-p.s-att img{border-color:var(--acc)}
.s-n{position:absolute;left:3px;bottom:3px;font-family:var(--f-mono);font-size:10px;background:var(--acc);color:#fff;border-radius:3px;padding:0 4px}
.s-px{position:absolute;right:-5px;top:-5px;width:20px;height:20px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:12px;line-height:20px;padding:0;cursor:pointer}
.s-refs{font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:2px 5px;align-items:center}.s-refs i{font-style:normal;opacity:.6}
.s-rl{font:inherit;font-size:11.5px;border:0;background:none;padding:0;color:var(--acc);cursor:zoom-in;text-decoration:underline;text-underline-offset:2px}
.s-pr summary{cursor:pointer;font-size:12px;color:var(--acc);font-weight:600}
.s-pr pre{margin:6px 0;white-space:pre-wrap;word-break:break-word;font-family:var(--f-mono);font-size:10.5px;line-height:1.5;background:#f2f0ea;border-radius:6px;padding:8px;max-height:220px;overflow:auto}
.s-pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding-top:14px;align-items:start}
.s-pose{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:5px;min-width:0}
.s-pose img{width:100%;max-width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;cursor:zoom-in;display:block}
.s-pose b{font-family:var(--f-mono);font-weight:500;color:var(--acc)}.s-pose .s-t{font-size:12.5px}.s-pose .s-c{font-size:11.5px;color:var(--sub)}
.s-up{font-size:11px;font-weight:700;color:var(--ok)}
#lb{position:fixed;inset:0;z-index:70;background:rgba(20,19,17,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#lb[hidden]{display:none}
#lb img{max-width:100%;max-height:calc(100% - 70px);border-radius:6px;object-fit:contain}
.lbbar{display:flex;gap:8px}.lbbar button{font:inherit;font-weight:700;padding:8px 16px;border-radius:999px;border:0;cursor:pointer;background:var(--paper);color:var(--ink)}
.lbbar #lbSave{background:var(--acc);color:#fff}
.s-x:focus-visible,.s-px:focus-visible,.s-pv:focus-visible,.s-dl:focus-visible,.s-chip:focus-visible,.s-btn:focus-visible,.s-rl:focus-visible,.vt button:focus-visible,.lbbar button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:560px){.s-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.s-open{font-size:11px;padding:4px 8px;right:42px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.s-tools{margin-left:0}.vt button{padding:7px 9px}.sync #syncTxt{display:none}}
@media (prefers-reduced-motion:reduce){.s-card{transition:none}}
.v-imgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}

.v-im img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:5px;display:block;cursor:zoom-in;background:#ddd9d1}
.v-im.v-ok{border-color:var(--ok)}.v-im.v-ng{border-color:var(--warn)}.v-im.v-ng img{opacity:.45}
.v-k{position:absolute;left:8px;top:8px;font-family:var(--f-mono);font-size:11px;background:rgba(251,250,247,.92);border-radius:999px;padding:1px 7px}
.v-btns{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.v-b{font:inherit;font-size:12px;font-weight:700;padding:4px 0;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--sub);cursor:pointer}
.v-b.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}.v-b.ng.on{background:var(--warn);border-color:var(--warn);color:#fff}
.v-cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--sub)}
.v-card .s-pr pre{max-height:300px}

//   열 안: 빵 실측 크기로 가로 개수·앞뒤 줄 수 자동(간격 8 mm), fill[i] = 그 열 채움 비율 → 뒤(직원 쪽, −z)부터 채워 앞이 빔

  types.forEach((type,c)=>{const cx=-w/2+cw/2+c*(cw+gap),B=BREADS[type]||BREADS.bun;
    g.add(bx(cw,0.002,d,st,cx,0,0));for(const s of [-1,1]){g.add(bx(cw,0.012,0.0015,st,cx,0,s*(d/2-0.00075)));g.add(bx(0.0015,0.012,d-0.003,st,cx+s*(cw/2-0.00075),0,0))}
    g.add(bx(cw-0.01,0.0006,d-0.01,pw,cx,0.002,0));
    const mk=i=>{const o=new THREE.Group();o.add(B.make(i*13+type.length*7+c*5+1));o.rotation.y=(B.cr||0)+(hsh(i,type.length,c+3)-0.5)*0.05;return o};
    const f0=mk(0),bb=new THREE.Box3().setFromObject(f0),fx=bb.max.x-bb.min.x,fz=bb.max.z-bb.min.z,ox=(bb.max.x+bb.min.x)/2,oz=(bb.max.z+bb.min.z)/2;
    const nx=Math.max(1,Math.floor((cw-2*pad+gi)/(fx+gi))),nz=Math.max(1,Math.floor((d-2*pad+gi)/(fz+gi)));
    const f=Math.max(0,Math.min(1,fill&&fill[c]!=null?+fill[c]:1)),keep=Math.round(nz*f),px=(cw-2*pad)/nx,pz=(d-2*pad)/nz;let k=0;
    for(let j=0;j<keep;j++)for(let i=0;i<nx;i++){const o=k?mk(k):f0;k++;o.position.set(cx-cw/2+pad+px*(i+0.5)-ox,0.0026,-d/2+pad+pz*(j+0.5)-oz);g.add(o)}});return g}

// 나무 진열 쟁반(L16·ref-03 실물): 바닥 판 12 mm + 둘레 띠 10 mm 두께·높이 30 mm(바닥 위 18 mm). 긴 변 띠가 짧은 변 띠를 덮는 맞대기 짜임

  for(const s of [-1,1])g.add(bx(w-2*t,0.0015,0.004,M('woodD',0x7a5230,{r:0.8}),0,0.012,s*(d/2-t-0.002)));// 바닥 판 가장자리 틈(짜임 선)
  const B=BREADS[bread]||BREADS.bun;const G=BREAD_GRID[bread]||[3,3];const nx=Math.max(1,Math.round(G[0]*w/0.4)),nz=Math.max(1,Math.round(G[1]*d/0.3));const tot=nx*nz,keep=Math.max(1,Math.round(tot*(fill??1)));let k=0;

// 판 위 배열: 반죽볼 10×6 촘촘(u_bbdc62a1) · 모닝빵 6×4 정렬(K5/K6) · 소금빵 생반죽 3줄(5·4·5) 엇갈림, 줄 간격 2~3cm(saltdough_13)

// 산형 식빵 단면(아래 11×9 cm 직사각 + 위 둥근 산 5 cm) · 식빵 덩어리(길이 Lz) · 슬라이스

  for(const z of [t/2+0.0004,-t/2-0.0004]){const c=new THREE.Mesh(new THREE.ShapeGeometry(shokuShape(),16),crumb);c.scale.set(0.93,0.93,1);c.position.set(0,0.003,z);if(z<0)c.rotation.y=Math.PI;g.add(c)}return g}

// ── K9 디저트 틀 채우기(사용자 스틸 fb8d625c): 검은 코팅 12구 머핀틀(Westmark 32902270 실측 350×265×30 mm, 4×3칸) + 칸마다 생 타르트지 + 칸별 속재료

const tinM=()=>M('tin12',0x232426,{r:0.42,m:0.3,side:THREE.DoubleSide}),crustM=()=>M('crust',0xe8d6b0,{r:0.85}),chocM=()=>M('chocdough',0x4a2b1f,{r:0.8}),

  pecanM=()=>M('pecan',0xb5814d,{r:0.7}),pecanDM=()=>M('pecanD',0x7d5230,{r:0.7});

  const s=rrShape(TIN.W,TIN.L,0.022);for(const [x,z] of tinCells()){const h=new THREE.Path();h.absarc(x,-z,TIN.rt+0.0015,0,Math.PI*2,true);s.holes.push(h)}
  const top=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:0.0009,bevelEnabled:false,curveSegments:28}),m);top.rotation.x=-Math.PI/2;top.position.y=H-0.0009;g.add(top);
  const cup=[[0.0004,H-TIN.dp],[TIN.rb-0.005,H-TIN.dp],[TIN.rb-0.0012,H-TIN.dp+0.0012],[TIN.rb,H-TIN.dp+0.005],[TIN.rt-0.0004,H-0.003],[TIN.rt+0.0004,H-0.0006],[TIN.rt+0.0018,H]];

// 생 타르트지: 두께 2.8 mm, 칸 벽을 따라 깔림, 윗단은 칸 테두리 위로 0~5 mm 울퉁불퉁(손으로 눌러 붙인 가장자리)
function tartShell(seed=0){const H=TIN.H,y0=H-TIN.dp+0.0005,t=0.0028,rA=y=>TIN.rb+(TIN.rt-TIN.rb)*Math.min(1,Math.max(0,(y-(H-TIN.dp+0.005))/(TIN.dp-0.008)));
  const P=[[0.0004,y0],[TIN.rb-0.004,y0],[TIN.rb-0.0008,y0+0.004],[rA(H-0.006)-0.0005,H-0.006],[TIN.rt-0.0004,H-0.0005],[TIN.rt-0.0002,H+0.0022],[TIN.rt-0.0016,H+0.0038],[TIN.rt-t-0.0004,H+0.0018],[rA(H-0.006)-t,H-0.006],[TIN.rb-t-0.0008,y0+t+0.003],[TIN.rb-t-0.004,y0+t],[0.0004,y0+t]];
  const a=hsh(seed,1)*6.28,b=hsh(seed,2)*6.28;
  return latheD(P,40,crustM(),(v,r,th,j,k)=>{if(j>=4&&j<=7){const w=0.0016*Math.sin(7*th+a)+0.0009*Math.sin(13*th+b)+(hsh(k,seed,3)-0.5)*0.0007;v.y+=w*(j===4?0.3:1);if(j>=5)setR(v,r,r+0.0005*Math.sin(23*th+a))}})}
// 칸 속 더미: 타르트지 바닥에서 안벽을 따라 올라가 가장자리 높이 top, 가운데 dome만큼 볼록, lump = 울퉁불퉁 정도(0 매끈 ~ 0.15 덩어리)
function cupMound(mat,top,dome,R,lump,seed=0,blob=0.012){const y0=TIN.H-TIN.dp+0.0035,P=[[0.0004,y0],[0.019,y0],[R*0.93,top-0.008]];
  for(let i=0;i<=10;i++){const f=i/10;P.push([Math.max(0.0004,R*Math.cos(f*Math.PI/2)),top+dome*Math.sin(f*Math.PI/2)])}
  const B=[];for(let k=0;k<26;k++){const big=k<7,rr=R*(big?0.75:0.85)*Math.sqrt(hsh(seed,k,11)),an=hsh(seed,k,12)*6.28;B.push([Math.cos(an)*rr,Math.sin(an)*rr,(hsh(seed,k,13)-(big?0.3:0.5))*lump*(big?0.07:0.06),big?blob:blob*0.4])}// 숟가락으로 떠 넣은 덩어리(가우시안 혹 7개)
  const a=hsh(seed,1)*6.28,b=hsh(seed,2)*6.28;
  return latheD(P,40,mat,(v,r,th,j,k)=>{if(j<2)return;const up=Math.min(1,Math.max(0,(v.y-y0)/(top-y0+0.001)));let hb=0;for(const [bx_,bz,am,bs] of B)hb+=am*Math.exp(-((v.x-bx_)**2+(v.z-bz)**2)/(bs*bs));
    const ax=Math.min(1,r/(0.35*R));setR(v,r,r*(1+lump*0.18*(0.6*Math.sin(2*th+a)+0.4*Math.sin(3*th+b))*up));v.y+=hb*up*(j>3?1:0.3)})}
// 마시멜로(일반 크기 지름 27 mm·길이 33 mm, 모서리 둥근 원기둥) 2개를 옆으로 눕혀 나란히 — 칸 테두리 위로 1.5 cm 솟음
function marsh(r=0.0135,h=0.033){return latheD([[0.0004,-h/2],[r-0.004,-h/2],[r-0.0012,-h/2+0.0009],[r,-h/2+0.004],[r,h/2-0.004],[r-0.0012,h/2-0.0009],[r-0.004,h/2],[0.0004,h/2]],24,marshM())}
function fillMarsh(g,seed){const p=new THREE.Group();for(const s of [-1,1]){const m=marsh(0.0132+0.0008*hsh(seed,s),0.032+0.003*hsh(seed,s+5));m.rotation.z=Math.PI/2;m.position.set((hsh(seed,s+2)-0.5)*0.004,0,s*0.0142);p.add(m)}
  p.rotation.y=0.55+(hsh(seed,9)-0.5)*0.3;p.position.y=TIN.H+0.0025;g.add(p)}
// 쿠키 반죽(베이지 덩어리 + 초코칩 7개) · 초코 쿠키 반죽(테두리 위로 1.5 cm 솟은 큰 더미) · 캐러멜(매끈한 낮은 돔) · 피칸(바닥 채움 + 조각 26개 수북이)

const SBC='bakery_art_cache_v17',DOC_MAX=250*1024;const HOLDS={};const REF={};let SUI={hidden:[],hist:[],t:0};let VRT={r:{},t:0};const SYNC={ok:null,at:0,pend:new Set(),busy:false,putAt:{}};

function putLocal(k,d){const [kind,id]=kp(k);if(!id||!d||typeof d!=='object')return;
  if(kind==='shot'){if(d.cam&&!d.reset)SAVED[id]=d}else if(kind==='hold'){HOLDS[id]={on:!!d.on,t:d.t||0};if(d.on)PARK[id]=true;else delete PARK[id]}

const WCH={};let RT=null;function retrySoon(){if(RT)return;RT=setTimeout(()=>{RT=null;if(SYNC.pend.size)pushPend()},8000)}

async function sbPut1(k,doc){let d=doc;let body=JSON.stringify(d);
  if(bytes(body)>DOC_MAX&&d&&d.thumb){d={...d};delete d.thumb;body=JSON.stringify(d)}
  if(bytes(body)>DOC_MAX){SYNC.pend.delete(k);return {ok:false,why:'big'}}

// 화면 전환: 3D 구도실 ↔ 시트 ↔ 포즈. 3D 는 시트·포즈에 있는 동안 그리기 멈춤

function openFromSheet(id){SHEET.from=id;setView('3d');if(!docOf(id)){toast(id+' 샷을 찾지 못했어요',true);return}if(cur!==id)openShot(id);setMode('cam');backBtn()}

const RUI={showX:false,onlyLike:false};const RPR={};

    <button type="button" class="r-b r-h${r==='like'?' on':''}" data-rr="${esc(d.code)}" data-v="like" aria-label="${esc(d.code)} 좋음" aria-pressed="${r==='like'}">♥</button>

function refRender(){if(VIEW!=='ref')return;const L=typeof RD!=='undefined'?RD:[];const nL=L.filter(d=>refRate(d.code)==='like').length,nX=L.filter(d=>refRate(d.code)==='x').length;

  $('#rgrid').innerHTML=vis.length?vis.map(refCard).join(''):'<div class="s-empty">보여줄 이미지가 없어요</div>';
  const cb=$('#rShowX');if(cb)cb.onchange=e=>{RUI.showX=e.target.checked;refRender()}}
let RLAST=null;
async function refSet(c,v){const r={...VRT.r};const k='ref:'+c;const prev=r[k];if(prev===v)delete r[k];else r[k]=v;VRT={...VRT,r,t:Date.now()};refRender();cacheSoon();

  if(d.rr){refSet(d.rr,d.v);return}if(d.rf){RUI.onlyLike=!RUI.onlyLike;refRender();return}
  const cp=(txt,msg)=>{try{navigator.clipboard.writeText(txt).then(()=>toast(msg),()=>toast('복사하지 못했어요',true))}catch(_){toast('복사하지 못했어요',true)}};
  if(d.rcp){cp(d.rcp,'주소 복사됨');return}if(d.rpc){cp(RPR[d.rpc]||'','프롬프트 복사됨')}});

function tick(now){requestAnimationFrame(tick);const dt=Math.min(0.05,(now-last)/1000);last=now;if(VIEW!=='3d')return;
  if(mode==='cam'){const sp=1.2*dt;let mv=false;if(KEYS.w){dolly(sp);mv=true}if(KEYS.s){dolly(-sp);mv=true}if(KEYS.a){truck(-sp,0);mv=true}if(KEYS.d){truck(sp,0);mv=true}if(KEYS.e){truck(0,sp);mv=true}if(KEYS.q){truck(0,-sp);mv=true}if(mv)kick(200)}
  if(orbit.update()||tc.dragging)kick(200);if(now>ACT&&(now-LASTR<1000||now-ACT>5000))return;LASTR=now;const r=$('#main').getBoundingClientRect();const W=r.width,H=r.height;R.setScissorTest(false);R.setViewport(0,0,W,H);R.setClearColor(mode==='edit'?0xc9c6bf:0x2a2927);R.clear();

    const hv=handle.visible;camHelper.visible=phone.visible=tc.visible=handle.visible=false;cutaway(scam,'cam');view(PIP.x,PIP.y,PIP.w,PIP.h,H);R.setClearColor(0x2a2927);R.clear();scam.aspect=9/16;scam.updateProjectionMatrix();R.render(S,scam);handle.visible=hv}
