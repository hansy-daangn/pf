  .sc-ov{position:fixed;inset:0;z-index:100000;background:rgba(22,20,16,.5);display:flex;align-items:center;justify-content:center;padding:20px}

<body>
<div id="bootOv" hidden><div class="boot-in">저장소 불러오는 중</div></div>
<div id="landing" class="hidden">

      </form>
      <button class="llink" type="button" id="toRegister">회원가입</button>

          <svg viewBox="0 0 48 48" aria-hidden="true"><g stroke-linecap="round"><line x1="24" y1="11" x2="12" y2="38" stroke="#FBBC04" stroke-width="12"/><line x1="24" y1="11" x2="36" y2="38" stroke="#4285F4" stroke-width="12"/></g><circle cx="12" cy="38" r="6.6" fill="#34A853"/></svg>

        <a class="tool" href="https://superset.apache.org/" target="_blank" rel="noopener" aria-label="SuperSet">

</div>
<div class="app">
  <!-- SIDEBAR: identity + media + summary + actions -->
  <aside class="side">

    </div>
    <!-- 필터: 매체(드롭다운) · 기간 · 보기. 모바일은 3개를 가로 드롭다운으로 압축 -->

      <div class="sf-item" id="msegSec" hidden>
        <div class="side-h">매체</div>
        <div id="mseg"></div>
      </div>
      <div class="sf-item" id="periodSec" hidden>
        <div class="side-h">기간</div>
        <div id="pseg"></div>
      </div>
      <div class="sf-item" id="viewSec" hidden>

        <div id="vseg"></div>
      </div>
    </div>
    <div class="pcustom-wrap" id="pcustomWrap"></div>

      <div class="prange-info" id="dataRangeLine" hidden></div>
      <div class="prange-info" id="dataAsOf" hidden title="이 화면이 보고 있는 데이터의 기준 시각"></div>
      <div class="side-actions" id="adminActions"></div>

<script>
"use strict";



try{if("scrollRestoration" in history)history.scrollRestoration="manual";}catch(_){}
addEventListener("DOMContentLoaded",()=>{try{window.scrollTo(0,0);}catch(_){}});

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const tip=$("#tip");
function placeTip(x,y){const w=tip.offsetWidth,ht=tip.offsetHeight;let nx=x+14,ny=y+14;if(nx+w>innerWidth-8)nx=x-w-14;if(ny+ht>innerHeight-8)ny=y-ht-14;tip.style.left=Math.max(6,nx)+"px";tip.style.top=Math.max(6,ny)+"px";}
function showTip(h,x,y,big){tip.innerHTML=h;tip.classList.toggle("big",!!big);tip.style.opacity=1;placeTip(x,y);}
function hideTip(){tip.style.opacity=0;tip.classList.remove("big");tip.innerHTML="";}
function isVideoUrl(u){return /\.(mp4|webm|mov)(\?|$)/i.test(String(u||""));}
function isAdManagerUrl(u){return /(?:adsmanager|business)\.facebook\.com|facebook\.com\/adsmanager/i.test(String(u||""));}
function isImageUrl(u){return /simgad|googlesyndication\.com|\.(png|jpe?g|gif|webp)(\?|$)/i.test(String(u||""));}




const IMG_PROXY=u=>"https://wsrv.nl/?url="+encodeURIComponent(u);
 
 
function offSrc(u){const m=window.CR_OFFLINE&&CR_OFFLINE.manifest;if(!m||!u)return null;return m[u]||null;}
function imgSrc(u){const o=offSrc(u);if(o)return o;try{if(localStorage.getItem("crImgProxy")||sessionStorage.getItem("crImgProxy"))return IMG_PROXY(u);}catch(e){}return u;}
function imgOk(img){if(String(img.src).indexOf("wsrv.nl/")>-1&&(+img.dataset.rt||0)>0){try{localStorage.setItem("crImgProxy","1");}catch(e){try{sessionStorage.setItem("crImgProxy","1");}catch(_){}}}try{mdimEl(img);}catch(_){}}




const VID_PROXY=u=>SB_URL+"/functions/v1/mediaproxy?u="+encodeURIComponent(u);
function vidSrc(u){const o=offSrc(u);if(o)return o;try{if(u&&(localStorage.getItem("crVidProxy")||sessionStorage.getItem("crVidProxy")))return VID_PROXY(u);}catch(e){}return u;}
function vidOk(v){if(String(v.currentSrc||v.src).includes("/mediaproxy?")&&(+v.dataset.rt||0)>0){try{localStorage.setItem("crVidProxy","1");}catch(e){try{sessionStorage.setItem("crVidProxy","1");}catch(_){}}}try{mdimEl(v);}catch(_){}}
function vidRetry(v){
  if(window.CR_OFFLINE){const w=v.closest(".isle-frame");if(w){const e=w.querySelector(".asset-verr");
    if(e){e.hidden=false;if(e.firstChild&&e.firstChild.nodeType===3)e.firstChild.textContent="오프라인 패키지에 동봉되지 않은 영상이에요 — 재생은 온라인 사이트에서";}
    v.hidden=true;}return;}
  const n=(+v.dataset.rt||0)+1;
  if(n>3){
    const t=v.closest(".tthumb");if(t){t.classList.add("err");return;}
    const f=v.closest(".isle-frame");
    if(f){const err=f.querySelector(".asset-verr");if(err){err.hidden=false;v.hidden=true;return;}}
    v.style.display="none";return;}
  v.dataset.rt=n;
  if(!v.dataset.osrc)v.dataset.osrc=String(v.getAttribute("src")||"").split("#")[0];
  const orig=v.dataset.osrc,frag=v.dataset.frag||"";
  if(!orig)return;
  const onProxy=String(v.src).includes("/mediaproxy?");
  const set=u=>{v.src=u+frag;try{v.load();}catch(_){}};
  if(n===1){set(onProxy?orig:VID_PROXY(orig));return;}  
  setTimeout(()=>{if(!v.isConnected)return;
    if(n===2)set(orig+(orig.includes("?")?"&":"?")+"rt="+Date.now());
    else set(VID_PROXY(orig)+"&rt="+Date.now());
  },1200);}


function stableMediaUrl(u){u=safeUrl(u);if(!u)return "";
  if(isVideoUrl(u)&&/adsmoloco\.com/i.test(u))return VID_PROXY(u);
  if(isImageUrl(u)&&/adsmoloco\.com|googlesyndication\.com/i.test(u))return IMG_PROXY(u);
  return u;}



let MDIM={}; try{MDIM=JSON.parse(localStorage.getItem("cr_mdim")||"{}")||{};}catch(_){MDIM={};}



const YT_THUMB_HOST=/(^|\/\/)(i\.ytimg\.com|img\.youtube\.com)\//i;
const YT_THUMB_DIM=new Set(["120x90","320x180","480x360","640x480","1280x720","686x386"]);
(function _mdimPurge(){
   
  try{
    let n=0;
    for(const k of Object.keys(MDIM)){
      const d=MDIM[k]||{};
      if(YT_THUMB_HOST.test(k)||(/youtube\.com|youtu\.be/i.test(k)&&YT_THUMB_DIM.has(d.w+"x"+d.h))||(d.w===120&&d.h===90)){delete MDIM[k];n++;}}
    if(n){localStorage.setItem("cr_mdim",JSON.stringify(MDIM));console.info("[mdim] 유튜브 썸네일 오염",n,"건 정화");}
  }catch(_){}})();
let _mdimSaveT=null,_mdimApplyT=null,_mdimDeferred=false;
function _mdimSave(){try{localStorage.setItem("cr_mdim",JSON.stringify(MDIM));}catch(_){}}
function mdimSet(url,w,h,dur){
  if(!url)return;w=Math.round(w||0);h=Math.round(h||0);
  if(YT_THUMB_HOST.test(url))return;  
  if(w===120&&h===90)return;  
  const cur=MDIM[url]||{};let ch=false;
  if(w>1&&h>1&&(cur.w!==w||cur.h!==h)){cur.w=w;cur.h=h;ch=true;}
  if(dur&&isFinite(dur)&&dur>0){const dv=Math.round(dur);if(cur.dur!==dv){cur.dur=dv;ch=true;}}
  if(!ch)return;MDIM[url]=cur;
  clearTimeout(_mdimSaveT);_mdimSaveT=setTimeout(_mdimSave,800);
  clearTimeout(_mdimApplyT);_mdimApplyT=setTimeout(mdimApply,700);}
 
function mdimEl(el){if(!el||!el.tagName)return;
  if(el.tagName==="IMG"&&String(el.src).includes("wsrv.nl"))return;
  const url=(el.dataset&&el.dataset.osrc)||el.getAttribute("src")||"";
  mdimSet(url,el.naturalWidth||el.videoWidth||0,el.naturalHeight||el.videoHeight||0,el.duration||0);}
 
function mdimApply(){
  let changed=false;
  const scan=list=>{for(const e of (list||[])){if(!e||e._isGroup)continue;const pu=previewUrlOf(e),d=pu&&MDIM[pu];if(!d)continue;
    if(ytIdOf(e._g_url||pu||e.name))continue;  
    if(d.dur&&e._dur==null)e._dur=d.dur;
    if(d.w&&d.h){e.tags=e.tags||{ve:null,fo:null,size:null,nat:null,shape:null};
      const meas=d.w+"×"+d.h;
      const isVid=(e.tags.fo==="영상")||/video/i.test(String(e._m_ctype||""));
      

      if(!e.tags.size){e.tags.size=meas;e.tags.shape=d.w>d.h?"가로":d.w<d.h?"세로":"정사각";changed=true;}
      else if(isVid&&e.tags.size!==meas&&!e._szMeas){e._szDecl=e.tags.size;e.tags.size=meas;
        e.tags.shape=d.w>d.h?"가로":d.w<d.h?"세로":"정사각";e._szMeas=1;changed=true;}}}};
  for(const k in DATASETS){const ds=DATASETS[k];scan(ds.aggAll);if(ds.aggByChannel)for(const v of ds.aggByChannel.values())scan(v.aggAll);}
  if(curDS)scan(curDS.agg);  
  if(!changed||!curDS)return;
  


  if(ISLE.name){_mdimDeferred=true;refreshIsleDim();return;}
  if(mainTab==="table")renderTable(curDS); else if(mainTab==="analysis")renderQuad(curDS);}
 
function refreshIsleDim(){
  if(!ISLE.name||!curDS)return;
  const e=findRow(curDS,ISLE.name);if(!e||e._isGroup)return;
  const url=previewUrlOf(e);
  if(/youtube\.com|youtu\.be/i.test(String(url||"")))return;  
  const d=url&&MDIM[url];if(!d)return;
  const el=document.querySelector(".isle .asset-dim");if(!el)return;
   
  const res=(d.w&&d.h&&!isVideoEnt(e))?`${d.w}×${d.h}`:arDispOf(e);
  el.title=(d.w&&d.h&&!isVideoEnt(e))?"실측 해상도":(arDispTitle(e)||"해상도");
  el.classList.toggle("unver",!(d.w&&d.h&&!isVideoEnt(e))&&!!(arInfoOf(e)||{}).unver);
  el.textContent=[res,d.dur?`⏱ ${fmtDur(d.dur)}`:""].filter(Boolean).join(" · ");}
function fmtDur(s){s=Math.round(s||0);if(!s)return"";return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
 
let _mdimVidRan=false;
async function hydrateMediaDims(){
  if(window.CR_OFFLINE)return;  
  if(_mdimVidRan)return;_mdimVidRan=true;
  const urls=new Set();
  for(const k in DATASETS){for(const e of (DATASETS[k].aggAll||[])){const u=previewUrlOf(e);
    if(u&&isVideoUrl(u)&&!(MDIM[u]&&MDIM[u].w))urls.add(u);}}
  const list=[...urls].slice(0,240);
  const probe=u=>new Promise(res=>{const v=document.createElement("video");v.preload="metadata";v.muted=true;
    let done=false;const fin=()=>{if(done)return;done=true;try{v.removeAttribute("src");v.load();}catch(_){}res();};
    v.onloadedmetadata=()=>{mdimSet(u,v.videoWidth,v.videoHeight,v.duration);fin();};
    v.onerror=fin;setTimeout(fin,8000);v.src=vidSrc(u);});
  for(let i=0;i<list.length;i+=2)await Promise.all(list.slice(i,i+2).map(probe));}
 
function imgHi(img){const h=img.dataset.hi;if(!h)return;img.dataset.hi="";
  const p=new Image();p.referrerPolicy="no-referrer";
  p.onload=()=>{if(img.isConnected&&!(+img.dataset.rt||0))img.src=p.src;};p.src=h;}
function imgRetry(img){
   
  const n=window.CR_OFFLINE?9:((+img.dataset.rt||0)+1);
  if(n>3){
    const t=img.closest(".tthumb");if(t)t.classList.add("err");
    const w=img.closest(".asset-wrap,.isle-frame");if(w){const e=w.querySelector(".asset-err");if(e)e.hidden=false;img.hidden=true;}
    return;}
  img.dataset.rt=n;
  if(!img.dataset.osrc)img.dataset.osrc=img.getAttribute("src");
  const orig=img.dataset.osrc;
  const onProxy=String(img.src).indexOf("wsrv.nl/")>-1;
  if(n===1){img.src=onProxy?orig:IMG_PROXY(orig);return;}  
  setTimeout(()=>{if(!img.isConnected)return;
    if(n===2)img.src=orig+(orig.includes("?")?"&":"?")+"rt="+Date.now();
    else img.src=IMG_PROXY(orig)+"&rt="+Date.now();
  },1200);}
function assetPreviewTipHTML(url,label){if(!url)return "";
  if(window.CR_OFFLINE){const yt0=ytIdOf(url);
    if(yt0){const th=imgSrc(`https://img.youtube.com/vi/${yt0}/hqdefault.jpg`);
      return `<div class="apt"><img src="${escAttr(th)}" style="max-width:100%;border-radius:8px"><div class="apt-n">오프라인 — 재생은 온라인에서</div></div>`;}}
  const yt=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{6,})/);
  if(yt){ 
    const hi=`https://img.youtube.com/vi/${yt[1]}/hqdefault.jpg`;
    return `<div class="tp-ytwrap" style="background-image:url('${escAttr(imgSrc(hi))}')"><iframe class="tp-yt" width="320" height="180" src="https://www.youtube.com/embed/${yt[1]}?autoplay=1&mute=1&controls=0&playsinline=1&loop=1&playlist=${yt[1]}&modestbranding=1" frameborder="0" allow="autoplay; encrypted-media"></iframe></div><div class="tp-cap">▶ ${escHtml(label||"영상")}</div>`;}

function runScoring(pop,elig,specs,reachKey,reachW,groupOf){
  const rw=(typeof reachW==="number")?reachW:SCORING.REACH_W;  
  

  const dists={},foDists={};
  for(const s of specs){
    dists[s.k]=buildWDist(pop.filter(e=>e[s.k]!=null).map(e=>[e[s.k],1]));
    if(!groupOf&&MEDIA_COHORT_KEYS.has(s.k)){  
      const byFo=new Map();
      for(const e of pop){if(e[s.k]==null)continue;const fo=specCohortOf(s,e);
        let arr=byFo.get(fo);if(!arr){arr=[];byFo.set(fo,arr);}arr.push([e[s.k],1]);}
      const m=new Map();for(const[fo,arr]of byFo){if(arr.length>=8)m.set(fo,buildWDist(arr));}
      if(m.size)foDists[s.k]=m;}}
  const rk=reachKey||"노출 수";
  const reachDist=buildWDist(pop.map(e=>[e[rk]||0,1]));  
  

  const gDists={};let gReach=null;
  if(groupOf){
    for(const s of specs){
      const byG=new Map();
      for(const e of pop){if(e[s.k]==null)continue;const gid=groupOf(e);if(gid==null)continue;
        let arr=byG.get(gid);if(!arr){arr=[];byG.set(gid,arr);}arr.push([e[s.k],1]);}
      const m=new Map();for(const[gid,arr]of byG)m.set(gid,buildWDist(arr));
      gDists[s.k]=m;}
    const byG=new Map();
    for(const e of pop){const gid=groupOf(e);if(gid==null)continue;
      let arr=byG.get(gid);if(!arr){arr=[];byG.set(gid,arr);}arr.push([e[rk]||0,1]);}
    gReach=new Map();for(const[gid,arr]of byG)gReach.set(gid,buildWDist(arr));}
  const denomLn=Math.log(1+SCORING.MIN_CONV_FOR_FULL_CONF);
  const convOf=e=>e._g_conversions??e["어트리뷰션 수"]??e["활성 유저 수"]??e["클릭 수"]??0;
  elig.forEach(e=>{
    let composite=0,wsum=0;e._specPct={};
    e._evW=specs.length?evidenceW(e,specs[0].k):null;  
    const gid=groupOf?groupOf(e):null;
    for(const s of specs){if(e[s.k]==null||!dists[s.k].vals.length)continue;
      if(s.entFo&&((e.tags&&e.tags.fo)||"")!==s.entFo)continue;  
      if(s.entCt&&String(e._m_ctype||"")!==s.entCt)continue;  
      let d=dists[s.k];
      if(gid!=null&&gDists[s.k]&&gDists[s.k].has(gid))d=gDists[s.k].get(gid);  
      else{const fm=foDists[s.k];if(fm){const fo=specCohortOf(s,e);if(fm.has(fo))d=fm.get(fo);}}
      const p=wPctRank(d,e[s.k]);let g=s.dir<0?1-p:p;
      const w=evidenceW(e,s.k);g=0.5+(g-0.5)*w;
      e._specPct[s.k]={g,w};
      composite+=g*s.w;wsum+=s.w;}
    const E=wsum>0?composite/wsum:0;
    let rd=reachDist;
    if(gid!=null&&gReach&&gReach.has(gid))rd=gReach.get(gid);  
    const R=rd.vals.length?wPctRank(rd,e[rk]||0):0.5;
    const C=Math.min(1,Math.log(1+convOf(e))/denomLn);
    e._E=E;e._R=R;e._C=C;
    e._raw=100*((1-rw)*E+rw*R);});
  


  const raws=elig.map(e=>e._raw).sort((x,y)=>x-y);
  const rLo=quantile(raws,0.05),rHi=quantile(raws,0.95);
  const lin=(elig.length>=8&&rHi>rLo)?(v=>12+(v-rLo)/(rHi-rLo)*80):(v=>v);
  const soft=v=>v>92?92+(v-92)*7/((v-92)+7):v<12?12-(12-v)*10/((12-v)+10):v;
  const remap=v=>Math.round(Math.max(2,Math.min(99.4,soft(lin(v))))*10)/10;  
  elig.forEach(e=>{e.score=remap(e._raw);});
  const sc=elig.map(e=>e.score).sort((x,y)=>x-y);
  elig.forEach(e=>{const p=pctRank(sc,e.score);e.tier=p>=0.8?"g2":p>=0.6?"g1":p>=0.4?"m":p>=0.2?"w1":"w2";});
   
  return {dists,foDists,reachDist,rk,rLo,rHi,useLin:(elig.length>=8&&rHi>rLo),sc,specs,rw,remap,gOf:groupOf||null,gDists,gReach};}

function nrHistory(ds){

function nrPool(ds,K,hist){
  const ck=(ds.media||"")+"|"+K+"|"+(ds.dataAll?ds.dataAll.length:0);

  const nameCol=ds.L.nameCol;

  const agg=aggregate(sub,ds.L);ds._nrPool[ck]=agg;return agg;}



function nrScore(ds,e,K,hist,specs){
  const pool=nrPool(ds,K,hist);

  const pe=pool.find(x=>x.name===e.name)||e;
  const gOf=(typeof groupOfFor==="function")?groupOfFor(ds):null;

  let comp=0,wsum=0,confNum=0,basis="매체 전체";const parts=[];
  for(const s of specs){
    if(pe[s.k]==null)continue;
    if(s.entFo&&((pe.tags&&pe.tags.fo)||"")!==s.entFo)continue;  
    if(s.entCt&&String(pe._m_ctype||"")!==s.entCt)continue;      
    const base=pool.filter(x=>x[s.k]!=null&&x.name!==pe.name);
    let cand=base,how="매체 전체";
    

    if(myG!=null){const sg=base.filter(x=>gOf(x)===myG);if(sg.length>=NR_MIN_POOL){cand=sg;how="그룹 내";}}

    const d=buildWDist(cand.map(x=>[x[s.k],1]));

  if(wsum<=0)return{err:"metric"};

  parts.sort((a,b)=>Math.abs(b.g-0.5)-Math.abs(a.g-0.5));

function newCreatives(ds){

  const hist=nrHistory(ds);if(!hist.size)return null;
  let latest="";for(const wks of hist.values()){const w=wks[wks.length-1];if(w>latest)latest=w;}
  if(!latest)return null;
  const cut=nrAddDays(latest,-(NR_WIN-1)*7);
  


  let dataFirst="";for(const wks of hist.values()){const w=wks[0];if(!dataFirst||w<dataFirst)dataFirst=w;}
  const byName=new Map();for(const e of ds.agg)if(!e._isGroup)byName.set(e.name,e);
  const out=[];let truncated=0;
  for(const[nm,wks]of hist){
    if(wks[0]<cut)continue;                  
    if(wks[0]===dataFirst){truncated++;continue;}  
    const e=byName.get(nm);if(!e||!(e.비용>0))continue;  
    out.push({e,name:nm,K:wks.length,first:wks[0],live:wks[wks.length-1]===latest});}
  return{latest,cut,dataFirst,truncated,items:out};}

function perfRadarData(ds,e){

function weeklyAggOf(ds,e,full){
  

  const nameCol=ds.L.nameCol;
  const src=full?nrRowsOf(ds):ds.data;
  let rows;
  if(e._isGroup){const gid=e._m_group||e._g_adGroupId;rows=src.filter(r=>r._m_group===gid||r._g_adGroupId===gid);}
  else rows=src.filter(r=>r[nameCol]===e.name);
  const wkMap=new Map();
  const blank=()=>({c:0,imp:0,clk:0,attr:0,act:0,conv:0,cval:0,vn:0,vd:0,tv:0,fo:0,home:0,inter:0,nu:0,rB:0,rU:0,afI:0});
  for(const r of rows){const d=String(r.date||"").slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(d))continue;
    let o=wkMap.get(d);if(!o){o=blank();wkMap.set(d,o);}
    o.c+=num(r["비용"])||0;o.imp+=num(r["노출 수"])||0;o.clk+=num(r["클릭 수"])||0;
    o.attr+=num(r["어트리뷰션 수"])||0;o.act+=num(r["활성 유저 수"])||0;
    o.conv+=num(r["_g_conversions"])||0;o.cval+=num(r["_g_convValue"])||0;
    o.vn+=num(r["_vcrNum"])||0;o.vd+=num(r["_vcrDen"])||0;o.tv+=num(r["_g_trueViews"])||0;
    o.fo+=num(r["_g_firstOpen"])||0;o.home+=num(r["_g_home"])||0;o.inter+=num(r["_g_interactions"])||0;
    o.nu+=num(r["신규+재활성 유저 수"])||0;o.rB+=num(r["_q_retD1Base"])||0;o.rU+=num(r["_q_retD1Users"])||0;o.afI+=num(r["_q_afInstalls"])||0;}
  




  if(e._isGroup&&e._g_adGroupId&&typeof gWeekMap==="object"){
    const wk=gWeekMap[String(e._g_adGroupId)];
    if(wk&&typeof wk==="object"){const lo=full?null:(ds.range&&ds.range.first);
      for(const w in wk){if(!/^\d{4}-\d{2}-\d{2}$/.test(w))continue;if(lo&&w<lo)continue;
        const a=wk[w];if(!Array.isArray(a)||!(+a[0]>0))continue;
        let o=wkMap.get(w);if(!o){o=blank();wkMap.set(w,o);}
        o.c=+a[0]||0;o.imp=+a[1]||0;o.clk=+a[2]||0;o._auth=1;}}}
  const ws=[...wkMap.keys()].sort();
  return{ws,os:ws.map(w=>wkMap.get(w))};}









function weeklyScoresOf(ds,e){
  const isG=!!e._isGroup,key=isG?"_wkScoreG":"_wkScore";
  if(!ds._scoreCtx)return ()=>null;  
  if(!ds[key]){
    const C=ds._scoreCtx;
    const m=new Map(),byW=new Map();
    for(const r of ds.data){const d=String(r.date||"").slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(d))continue;
      let a=byW.get(d);if(!a){a=[];byW.set(d,a);}a.push(r);}
     
    const remap=C.remap||(v=>Math.round(Math.max(2,Math.min(99.4,v))*10)/10);
     
    const wkEnts=[...byW.entries()].map(([w,rows])=>[w,isG?buildAdGroupAgg({agg:aggregate(rows,ds.L)}):aggregate(rows,ds.L)]);
    const wkReach=buildWDist(wkEnts.flatMap(([,ents])=>ents.map(x=>[x[C.rk]||0,1])));
     
    const wkReachG=(!isG&&C.gOf)?(()=>{const by=new Map();
      for(const[,ents]of wkEnts)for(const x of ents){const gid=C.gOf(x);if(gid==null)continue;
        let arr=by.get(gid);if(!arr){arr=[];by.set(gid,arr);}arr.push([x[C.rk]||0,1]);}
      const r=new Map();for(const[gid,arr]of by)r.set(gid,buildWDist(arr));return r;})():null;
    for(const[w,ents]of wkEnts){
      const wm=new Map();
      for(const x of ents){
        if((x.비용||0)<=0)continue;
        const gid=(!isG&&C.gOf)?C.gOf(x):null;
        let comp=0,wsum=0;
        for(const sp of C.specs){const v=x[sp.k];if(v==null)continue;
          if(sp.entFo&&((x.tags&&x.tags.fo)||"")!==sp.entFo)continue;
          if(sp.entCt&&String(x._m_ctype||"")!==sp.entCt)continue;
          const d0=C.dists[sp.k];if(!d0||!d0.vals.length)continue;
          let d=d0;
          if(gid!=null&&C.gDists&&C.gDists[sp.k]&&C.gDists[sp.k].has(gid))d=C.gDists[sp.k].get(gid);  
          else{const fm=C.foDists[sp.k];if(fm){const fo=specCohortOf(sp,x);if(fm.has(fo))d=fm.get(fo);}}
          const p=wPctRank(d,v);let g=sp.dir<0?1-p:p;
          const ww=evidenceW(x,sp.k);g=0.5+(g-0.5)*ww;
          comp+=g*sp.w;wsum+=sp.w;}
        if(!(wsum>0))continue;  
        const E=comp/wsum;
        let rd=wkReach;if(gid!=null&&wkReachG&&wkReachG.has(gid))rd=wkReachG.get(gid);
        const R=rd.vals.length?wPctRank(rd,x[C.rk]||0):0.5;
        const raw=100*((1-(C.rw??SCORING.REACH_W))*E+(C.rw??SCORING.REACH_W)*R);
        const scv=remap(raw);
        const p2=C.sc&&C.sc.length?pctRank(C.sc,scv):0.5;
        const t=p2>=0.8?"g2":p2>=0.6?"g1":p2>=0.4?"m":p2>=0.2?"w1":"w2";
        wm.set(isG?String(x._g_adGroupId||x._m_group):x.name,{s:scv,t});}
      m.set(w,wm);}
    ds[key]=m;}
  const id=isG?String(e._g_adGroupId||e._m_group):e.name;
  return w=>{const wm=ds[key].get(w);return (wm&&wm.get(id))||null;};}

function prefixTrimmer(names){
  const list=names.filter(Boolean);
  if(list.length<2)return s=>s;
  let p=list[0];
  for(const n of list){let i=0;const L=Math.min(p.length,n.length);while(i<L&&p[i]===n[i])i++;p=p.slice(0,i);if(!p)break;}
  const m=p.match(/^.*[_\-·\s./]/);const cut=m?m[0].length:0;
  if(cut<10)return s=>s;
  return s=>s&&s.length>cut+2?"\u2026"+s.slice(cut):s;}

const UM_TIERS=[[80,"매우 좋음","g2"],[60,"좋음","g1"],[35,"보통","m"],[0,"낮음","w1"]];




function umInformative(pool,v){
  if(v==null||!isFinite(v))return false;
  if(!pool||pool.length<4)return false;
  const u=new Set(pool);
  if(u.size<=2)return false;                        
  const s=pool.slice().sort((a,b)=>a-b);
  const p10=quantile(s,0.1),p90=quantile(s,0.9),med=quantile(s,0.5);
  if(p90===p10)return false;                        
  if(med!==0&&Math.abs(p90-p10)/Math.abs(med)<0.02)return false;  
  return true;}
 
function umPctRank(pool,v){
  if(!pool||pool.length<4||v==null||!isFinite(v))return null;
  let lo=0,hi=0;for(const x of pool){if(x<v)lo++;if(x<=v)hi++;}
  return (lo+hi)/(2*pool.length)*100;}
 
function umTierOf(pct,dir){
  if(pct==null)return null;
  const good=dir<0?100-pct:pct;
  for(const[lo,lab,t]of UM_TIERS)if(good>=lo)return{lab,t,good};
  return null;}


function umTrack(pool,v,dir){
  if(!umInformative(pool,v))return null;  
  const srt=pool.slice().sort((a,b)=>a-b);
  const med=quantile(srt,0.5),p10=quantile(srt,0.1),p90=quantile(srt,0.9);
  const spread=Math.max(Math.abs(p90-med),Math.abs(med-p10))||Math.abs(med)||1;
  const raw=50+(v-med)/spread*50;
  return{pos:Math.max(3,Math.min(97,raw)),out:raw<3?-1:(raw>97?1:0),med,p10,p90,
    pct:umPctRank(srt,v),tier:umTierOf(umPctRank(srt,v),dir)};}
 
function umRow(o){
  const t=o.tr&&o.tr.tier;
  

  const rank=o.rank||"";
  


  const tc=t?` t-${t.t}`:"";
  return `<div class="mrow${tc}"${o.tip?` data-tip="${escAttr(o.tip)}"`:""}>`
    +`<span class="mr-k">${escHtml(o.k)}</span>`
    +`<b class="mr-v num">${escHtml(o.v)}</b>`
    +(t?`<span class="sp ${t.t==="g2"?"sp-g2":t.t==="g1"?"sp-g1":t.t==="w1"?"sp-w1":"sp-mid"} mr-t">${t.lab}</span>`:`<span class="mr-t"></span>`)
    +`<span class="mr-d">${rank}</span></div>`;}
const TIER_COL={g2:"var(--g2)",g1:"var(--g1)",m:"var(--mid)",w1:"var(--w1)",w2:"var(--w2)"};

  if(it.length<3)return "";
  const W=264,H=204,cx=W/2,cy=H/2-4,R=64;  
  const N=it.length,ang=i=>-Math.PI/2+i*2*Math.PI/N;
  const P=(i,r)=>[cx+Math.cos(ang(i))*R*r,cy+Math.sin(ang(i))*R*r];
  const poly=fr=>it.map((o,i)=>P(i,fr(o)).map(n=>n.toFixed(1)).join(",")).join(" ");
  let s="";
  for(const r of[0.25,0.5,0.75,1])
    s+=`<polygon points="${poly(()=>r)}" fill="none" stroke="${r===0.5?"var(--muted)":"var(--surface-2)"}" stroke-width="${r===0.5?1.2:1}"${r===0.5?' stroke-dasharray="4 3" stroke-opacity="0.55"':""}/>`;
  for(let i=0;i<N;i++){const[x,y]=P(i,1);
    s+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--surface-2)" stroke-width="1"/>`;}
  const rOf=o=>Math.max(0.07,Math.min(1,o.pct/100));  
  s+=`<polygon points="${poly(rOf)}" fill="var(--karrot)" fill-opacity="0.13" stroke="var(--karrot)" stroke-width="1.6" stroke-opacity="0.7"/>`;
  it.forEach((o,i)=>{const[x,y]=P(i,rOf(o));
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.6" fill="${TIER_COL[o.tier]||"var(--mid)"}" stroke="#FFFDF7" stroke-width="1.5"`
       
      +` data-tip="${escAttr(o.tip||`<b>${escHtml(o.lab)}</b>${o.val?`<br>${escHtml(o.val)}`:""}<br>비교군 중 상위 ${Math.max(1,Math.round(100-o.pct))}%`)}"/>`;});
  it.forEach((o,i)=>{const[x,y]=P(i,1.3),a=ang(i);
    const anc=Math.abs(Math.cos(a))<0.34?"middle":(Math.cos(a)>0?"start":"end");
     
     
     
    s+=`<text x="${x.toFixed(1)}" y="${(y+3.2).toFixed(1)}" font-size="10" font-weight="600" text-anchor="${anc}" fill="${TIER_COL[o.tier]||"var(--muted)"}">${escHtml(o.slab||o.lab)}</text>`;});
  

  return `<svg class="rdr" viewBox="0 0 ${W} ${H}" style="width:${W}px;max-width:min(100%,${W}px)" role="img" aria-label="지표별 또래 대비 위치">${s}</svg>`;}

function umFromLookup(sm,kind){
  const list=sm&&Array.isArray(sm.lookup)?sm.lookup:null;
  if(!list||!UMET)return null;
  const re=new RegExp("(?:^|\\.)("+kind+"_w(\\d{2})(\\d{2}))\\.");
  for(const path of list){
    const mm=String(path||"").match(re);
    if(!mm)continue;
    const blk=UMET[mm[1]];
    if(blk&&blk.creatives&&typeof blk.creatives==="object")return{val:blk,m:[mm[0],mm[2],mm[3]]};}
  return null;}

function umSvc7For(ds,e){
  const sm=UMET&&UMET.svcmap;if(!sm||!sm.map)return null;
  const ch=umChOf(ds&&ds.media);
  const ad=markAd(e&&e.name);
  


  const s7=umFromLookup(sm,"svc7")||umLatest(/^svc7_w(\d{2})(\d{2})$/);
  const sr7=umFromLookup(sm,"svcRe7")||umLatest(/^svcRe7_w(\d{2})(\d{2})$/);
  let hit=null,basis=null,wk=null;
  if(s7&&s7.val.creatives&&ch){
     
    const kk=umKeyFor(ds,e);
    const key=kk?kk.key:umNorm(ch+"|"+ad);
    const v=umNMap(s7.val.creatives).get(key);
    if(v&&typeof v==="object"){hit=v;basis="svc7";wk=`${+s7.m[1]}/${+s7.m[2]}`;}}
  if(!hit&&sr7&&sr7.val.creatives&&ch==="Moloco"){

  if(!hit)return null;
  const _ov=svcOverrideFor(e),_OV2SVC={"중고거래":"fleamarket","중고차":"car","부동산":"realty","알바":"jobs","비즈니스":"biz","브랜딩":"brand","기타":"unknown"};

  const always=Array.isArray(sm.always_show)?sm.always_show:[{key:"home",label:"앱 접속(홈피드)"},{key:"common",label:"재방문"}];
  const rows=[];
  const seen=new Set();
  const push=(key,label,primary)=>{
    if(seen.has(key))return;seen.add(key);
    const v=hit[key]==null?0:+hit[key];if(!isFinite(v))return;  
    rows.push({key,label,v,primary});};
  push(mapped.key,mapped.label,true);

  if(!rows.length)return null;
  const base=(basis==="svc7"&&sm.peer_baseline_svc7&&typeof sm.peer_baseline_svc7==="object")?sm.peer_baseline_svc7:null;

  return {rows,basis,wk,n:+hit.n||0,svc,svcLabel:mapped.label,
    basisLabel:(sm.basis_label&&sm.basis_label[basis])||(basis==="svc7"?"신규 설치 7일":"복귀 후 7일"),base,distOf};}

function computeDhash(url){
  if(DHASH[url]!==undefined)return Promise.resolve(DHASH[url]);
  if(window.CR_OFFLINE)return Promise.resolve(null);  
  const px=`https://wsrv.nl/?url=${encodeURIComponent(url)}&w=9&h=8&fit=fill&output=jpg`;
  return new Promise(res=>{
    const im=new Image();im.crossOrigin="anonymous";
    const done=h=>{DHASH[url]=h;_dhashDirty=true;_dhashGen++;res(h);};

          for(let x=0;x<8;x++){nib=(nib<<1)|(lum[y*9+x]<lum[y*9+x+1]?1:0);cnt++;
            if(cnt===4){hex+=nib.toString(16);nib=0;cnt=0;}}}

    const val=vs.filter(v=>v!=null&&v>0);
    if(val.length<2)continue;
    const best=d.dir>0?Math.max(...val):Math.min(...val);
    vs.forEach((v,j)=>{if(v==null||v<=0)return;dom[j].s+=d.dir>0?v/best:best/v;dom[j].n++;});}
  R.domPct=dom.map(o=>o.n?o.s/o.n:null);
  R.order=[...ents.keys()].sort((a,b)=>((R.domPct[b]!=null?R.domPct[b]:-1)-(R.domPct[a]!=null?R.domPct[a]:-1)));
  R.order.forEach((j,rank)=>{R.colorByList.set(ents[j].i,CMP_COLORS[rank%CMP_COLORS.length]);R.rankByList.set(ents[j].i,rank);});
  return R;}

const CMP_RADAR_MAX=5;
function cmpAxesSVG(R){
  const{ents,tots,defs}=R;
  let cols=defs.map(d=>{
    const raw=tots.map(t=>d.of(t));
    const eff=raw.map(v=>v==null?null:(d.dir<0?(v>0?1/v:null):v));  
    const mx=Math.max(...eff.filter(v=>v!=null).concat([0]));
    return {d,raw,eff,mx};}).filter(c=>c.mx>0&&c.eff.filter(v=>v!=null).length>=2);
  if(!cols.length)return `<div class="fam-note">겹쳐 볼 지표 값이 부족해요</div>`;
   
  if(cols.length>CMP_RADAR_MAX){
    const spread=c=>{const v=c.eff.filter(x=>x!=null).map(x=>x/c.mx);
      return v.length<2?0:Math.max(...v)-Math.min(...v);};
    cols=cols.slice().sort((a,b)=>spread(b)-spread(a)).slice(0,CMP_RADAR_MAX);
     
    cols.sort((a,b)=>defs.indexOf(a.d)-defs.indexOf(b.d));}
  const N=cols.length;
  

  const W=620,H=376,cx=W/2,cy=178;
  const Rr=118;
   
  const ang=i=>-Math.PI/2+i*2*Math.PI/N;
  const at=(i,t)=>[cx+Math.cos(ang(i))*Rr*t,cy+Math.sin(ang(i))*Rr*t];
  const poly=t=>cols.map((_,i)=>at(i,t).map(v=>v.toFixed(1)).join(",")).join(" ");
  let g="";
   
  for(const t of[0.25,0.5,0.75,1])
    g+=`<polygon points="${poly(t)}" fill="none" stroke="${t===1?"#E5E2D8":"#F0EEE6"}" stroke-width="1"/>`;
  cols.forEach((c,i)=>{const[x,y]=at(i,1);
    g+=`<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#F0EEE6" stroke-width="1"/>`;});
   
  let shapes="",dots="";
  [...R.order].reverse().forEach(j=>{
    const en=ents[j],col=R.colorByList.get(en.i)||CMP_GRAY;
    const ps=cols.map((c,i)=>{const v=c.eff[j];return v==null?null:at(i,Math.max(0.04,v/c.mx));});
    const have=ps.filter(Boolean).length;
    if(!have)return;
    const pts=ps.filter(Boolean).map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ");
     
    shapes+=have>=3
      ?`<polygon class="cmp-ln" data-ci="${en.i}" points="${pts}" fill="${col}" fill-opacity="0.10" stroke="${col}" stroke-width="1.8" stroke-opacity="0.9" stroke-linejoin="round"/>`
      :`<polyline class="cmp-ln" data-ci="${en.i}" points="${pts}" fill="none" stroke="${col}" stroke-width="1.8" stroke-opacity="0.9"/>`;
    ps.forEach((p,i)=>{if(!p)return;const c=cols[i];
      dots+=`<circle class="cmp-dot" data-ci="${en.i}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="${col}" data-cv="${escAttr(c.d.lab+" "+c.d.fmt(c.raw[j]))}" data-cc="${col}"/>`;});});
  

  let vals="";
  cols.forEach((c,i)=>{
    const[lx,ly]=at(i,1.13);
    const anch=Math.abs(lx-cx)<8?"middle":(lx>cx?"start":"end");
    const lab=c.d.lab+(c.d.dir<0?" ↓":c.d.dir>0?" ↑":"");
    let best=null;
    ents.forEach((_,j)=>{const v=c.eff[j];if(v==null)return;if(!best||v>best.v)best={v,j};});
    const up=ly<cy-4;  
    const y0=up?ly-13:ly+11;
    vals+=`<text x="${lx.toFixed(1)}" y="${y0.toFixed(1)}" font-size="10" font-weight="650" fill="var(--muted)" text-anchor="${anch}">${escHtml(lab)}</text>`;
    if(best){const col=R.colorByList.get(ents[best.j].i)||CMP_GRAY;
      vals+=`<text x="${lx.toFixed(1)}" y="${(y0+11).toFixed(1)}" font-size="10" font-weight="750" fill="${col}" text-anchor="${anch}">${escHtml(c.d.fmt(c.raw[best.j]))}</text>`;}});
  return `<div class="cmpm-chartwrap"><svg class="cmp-radar" viewBox="0 0 ${W} ${H}">${g}${shapes}${dots}${vals}</svg>`
    +`<div class="cmp-radar-note">축 = 지표 · <b>바깥쪽일수록 좋음</b>(단가는 뒤집어 정렬) · 축마다 최고값을 테두리로 정규화 — 축 간 크기는 비교하지 마세요</div></div>`;}
function cmpGridHTML(R){

    return `<th data-ci="${en.i}" style="color:${R.colorByList.get(en.i)}" title="${escAttr(nm)}">${rank+1}위 · ${escHtml(trunc(nm,nmLen))}</th>`;}).join("");

    const sorted=val.slice().sort((a,b)=>d.dir>0?b-a:a-b);
    const second=sorted.length>=2?sorted[1]:null;
    const domi=best!=null&&second!=null&&second>0&&best>0&&(d.dir>0?best/second:second/best)>=1.5;

  return `<div class="cmpg-wrap"><table class="cmpg"><thead><tr><th class="l">지표</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;}



let cmpTrendMinN=null;             
let _cmpTrendMinEff=1;             




const CMP_TR_WANT=["광고비","노출수","홈 방문","데려온 유저","신규 유저","신규 단가"];
const CMP_TR_MAX=6;
function cmpTrendGridDefs(defs){
  const norm=x=>String(x||"").replace(/\s/g,"");
  const used=new Set(),out=[];
  for(const want of CMP_TR_WANT){
    const d=defs.find(x=>!used.has(x.k)&&norm(x.lab)===norm(want));
    if(d){used.add(d.k);out.push(d);}}
   
  for(const d of defs){
    if(out.length>=CMP_TR_MAX)break;
    if(used.has(d.k)||norm(d.lab)==="CTR")continue;
    used.add(d.k);out.push(d);}
  return out.slice(0,CMP_TR_MAX);}
function cmpTrendSectionHTML(R){
  const{ents}=R;
  const defs=cmpTrendGridDefs(R.defs);
  const was=ents.map(en=>weeklyAggOf(en.ds,en.e,true));  
  const allWeeks=[...new Set(was.flatMap(w=>w.ws))].sort();
  const maps=was.map(w=>new Map(w.ws.map((x,i)=>[x,w.os[i]])));
  const cnt=w=>maps.reduce((n,mp)=>n+(mp.has(w)?1:0),0);
  const N=ents.length;
  const pick=v=>allWeeks.filter(w=>cnt(w)>=v);
  let minN=Math.max(1,Math.min(N,cmpTrendMinN==null?N-2:cmpTrendMinN));
  if(cmpTrendMinN==null)while(minN>1&&pick(minN).length<2)minN--;  
  _cmpTrendMinEff=minN;
  const weeks=pick(minN);
  if(weeks.length<2)return `<div class="fam-note">겹쳐 볼 주간 데이터가 부족해요 (2주 이상 필요)</div>`;
  const weeksTip=i=>weeks[i].slice(5,7)+"/"+weeks[i].slice(8,10)+"주";
  const xlab=(xat,W,H,fs)=>{const lstep=Math.max(1,Math.ceil(weeks.length/(W>420?9:5)));
    let lab="";weeks.forEach((w,i)=>{const last=i===weeks.length-1;
      if(!last&&i%lstep)return;
      if(!last&&weeks.length>1&&(weeks.length-1-i)<Math.ceil(lstep/2))return;
      lab+=`<text x="${xat(i).toFixed(1)}" y="${H-5}" font-size="${fs}" fill="var(--faint)" text-anchor="middle">${w.slice(5,7)}/${w.slice(8,10)}</text>`;});
    return lab;};
  const cells=defs.map(d=>{
    const series=maps.map(mp=>weeks.map(w=>{const o=mp.get(w);return o?d.of(o):null;}));
    const all=series.flat().filter(v=>v!=null);
    if(!all.length)return "";
    const mx=Math.max(...all)*1.1||1;
    

    const W2=286,H2=132,pl2=18,pr2=18,pt2=10,pb2=18,iw2=W2-pl2-pr2,ih2=H2-pt2-pb2;
    const xat2=i=>pl2+(weeks.length===1?iw2/2:(i/(weeks.length-1))*iw2);
    let svg=`<line x1="${pl2}" y1="${(pt2+0.5*ih2).toFixed(1)}" x2="${W2-pr2}" y2="${(pt2+0.5*ih2).toFixed(1)}" stroke="#E5E2D8" stroke-dasharray="2 3" stroke-width="0.6"/>`;
    [...R.order].reverse().forEach(j=>{
      const en=ents[j],col=R.colorByList.get(en.i)||CMP_GRAY;
      let p="",st=false,dots="";
      series[j].forEach((v,i)=>{if(v==null)return;
        const x=xat2(i),y=pt2+(1-v/mx)*ih2;
        p+=st?` L ${x.toFixed(1)} ${y.toFixed(1)}`:`M ${x.toFixed(1)} ${y.toFixed(1)}`;st=true;
        dots+=`<circle class="cmp-dot" data-ci="${en.i}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4" fill="${col}" data-cv="${escAttr(weeksTip(i)+" · "+d.fmt(v))}" data-cc="${col}"/>`;});
      if(!st)return;
       
      svg+=`<path class="cmp-ln" data-ci="${en.i}" d="${p}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/>`+dots;});
    return `<div class="cmp-trc"><h5>${escHtml(d.lab)}${d.dir<0?" ↓":d.dir>0?" ↑":""}</h5><svg viewBox="0 0 ${W2} ${H2}" style="width:100%;height:auto">${svg}${xlab(xat2,W2,H2,9)}</svg></div>`;}).filter(Boolean);
  if(!cells.length)return `<div class="fam-note">주간 값이 있는 지표가 없어요</div>`;
  return `<div class="cmp-trgrid">${cells.join("")}</div>`;}

function cmpRecoHTML(R){
  const ds=R.ds;if(!ds||!R.ents.length)return "";
  const inSet=new Set(R.ents.map(g=>g.e.name));
   
  if(!ds._spanCache||ds._spanCacheKey!==ds.media){
    const m=new Map(),nameCol=ds.L.nameCol;
    for(const r of nrRowsOf(ds)){const d=String(r.date||"").slice(0,10);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d))continue;
      const nm=r[nameCol];if(nm==null||nm==="")continue;
      const o=m.get(nm);if(!o)m.set(nm,{f:d,l:d});else{if(d<o.f)o.f=d;if(d>o.l)o.l=d;}}
    ds._spanCache=m;ds._spanCacheKey=ds.media;}
  const span=ds._spanCache;
  const T=x=>Date.parse(x),WK=7*864e5;
  const ov=(a,b)=>{if(!a||!b)return 0;  
    const s=Math.max(T(a.f),T(b.f)),e2=Math.min(T(a.l),T(b.l));
    const u=Math.max(T(a.l),T(b.l))-Math.min(T(a.f),T(b.f))+WK;
    return u>0?Math.max(0,e2-s+WK)/u:0;};
  const gidOf=x=>String(x._g_adGroupId||x._m_group||"");
  const ref=R.ents.map(g=>({e:g.e,sp:span.get(g.e.name)}));
  const cand=[];
  for(const e of (ds.agg||[])){
    if(e._isGroup||inSet.has(e.name))continue;
    const th=thumbHTML(e);if(!th)continue;  
    const sp=span.get(e.name);let s=0;
    for(const r of ref){
      s+=2*ov(sp,r.sp);
      if(gidOf(e)&&gidOf(e)===gidOf(r.e))s+=3;
      if(e._svc&&r.e._svc&&e._svc===r.e._svc)s+=1.5;
      if(e.tags&&r.e.tags&&e.tags.fo&&e.tags.fo===r.e.tags.fo)s+=1;}
    s/=ref.length;
    if(s>0.5)cand.push({e,s,th,sp});}
  cand.sort((a,b)=>b.s-a.s);
  const top=cand.slice(0,10);
  if(!top.length)return "";
  const md=w=>String(w).slice(5,7).replace(/^0/,"")+"/"+String(w).slice(8,10).replace(/^0/,"");
  return `<div class="cmp-reco"><span class="cr-h" title="기간이 겹치고 광고그룹·서비스·유형이 같은 순서예요">비교 추천</span>${
    top.map(o=>`<span class="cr-it" role="button" tabindex="0" data-nm="${escAttr(o.e.name)}"
      title="${escAttr(displayNameOf(o.e)+(o.sp?`\n${md(o.sp.f)}~${md(o.sp.l)} 집행`:"")+"\n클릭 = 비교에 추가")}">${o.th}<span class="cr-add">＋</span></span>`).join("")}</div>`;}

function scrollRowToTop(tr){
  if(!tr)return;
  const doIt=()=>{
    const r=tr.getBoundingClientRect();
    const head=document.querySelector("#table thead");
    const off=(head?head.getBoundingClientRect().height:0)+12;
    const y=r.top+window.pageYOffset-off;
    const prev=document.documentElement.style.scrollBehavior;
    document.documentElement.style.scrollBehavior="auto";  
    window.scrollTo(0,Math.max(0,y));
    document.documentElement.style.scrollBehavior=prev;};
  doIt();
  requestAnimationFrame(doIt);}  




function scrollIsleToKeepTop(tr,wantTop){
  if(!tr)return;
  const head=document.querySelector("#table thead");
  const minTop=(head?head.getBoundingClientRect().height:0)+12;  
  const want=Math.max(minTop,wantTop);
  const doIt=()=>{
    const nx=tr.nextElementSibling;
    const isle=(nx&&nx.classList.contains("isle-row"))?nx:tr;
    const d=isle.getBoundingClientRect().top-want;
    if(Math.abs(d)<1)return;
    const prev=document.documentElement.style.scrollBehavior;
    document.documentElement.style.scrollBehavior="auto";  
    window.scrollTo(0,Math.max(0,window.pageYOffset+d));
    document.documentElement.style.scrollBehavior=prev;};
  doIt();
  requestAnimationFrame(doIt);}

function orderedRowsForTable(ds){
  let rows=getRowsForTable(ds);
  

  if(!tableShowAll){const hasLab=rows.some(r=>perfLabelOf(r));

  if(tState.sort!=="name"&&tState.sort!=="score"&&!tableCols(ds.L,ds).some(c=>c.k===tState.sort))tState.sort="비용";  
  rows.sort((a,b)=>{
    if(tState.sort==="name")return tState.dir*a.name.localeCompare(b.name);
    const k=tState.sort;
    

    if(k==="score"){
      const px=perfSortKey(a),py=perfSortKey(b);
      if(px!==py)return tState.dir*(px>py?1:-1);
      const cx=a.비용||0,cy=b.비용||0;
      return cx===cy?0:tState.dir*(cx>cy?1:-1);}
    let x=a[k],y=b[k];
    if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1;
    return tState.dir*((x>y?1:x<y?-1:0));});
  return rows;}

function abVariantOf(name){let s=String(name||"");
  s=s.replace(/\.(mp4|png|jpe?g|gif|webp|mov|webm)$/i,"");
  s=s.replace(/\d{3,4}\s*[xX×]\s*\d{3,4}/g," ");
  s=s.replace(/(?<!\d)\d{1,2}\s*[xX×:\-]\s*\d{1,2}(?!\d)/g," ");
  s=s.replace(/[_\-\s.]*(mp4|mov|webm|jpe?g|png|gif)\s*$/i," ");
  s=s.replace(/[_\-\s.]+$/,"").trim();
  let m=s.match(/^(.{2,}?)[_\-\s.]+(?:[Vv](?:er|ersion)?|시안)?[_\-\s.]*([A-F])$/);
  if(m){const bq=m[1].replace(/[^A-Za-z0-9가-힣]/g,"");
    if(bq.length>=4||/[가-힣]{2}/.test(bq))return{base:m[1],variant:m[2],kind:"L"};}
  




  m=s.match(/^(.{4,}?)[_\-\s.]*[Vv](?:er|ersion)?[_\-\s.]*([1-5])$/);
  if(m)return{base:m[1].replace(/[_\-\s.]+$/,""),variant:m[2],kind:"N"};
  m=s.match(/^(.{4,}?)(?:[_\-\s.]+|(?<=[A-Za-z가-힣]))(0[1-5])$/);
  if(m)return{base:m[1].replace(/[_\-\s.]+$/,""),variant:String(parseInt(m[2],10)),kind:"N"};
  m=s.match(/^(.{2,}?)[_\-\s.]*([1-5])$/);
  if(m){const b=m[1].replace(/[_\-\s.]+$/,"");
    if(/(?:^|[_\-\s.])(ep|episode|part|pt|cut)$/i.test(b)||/[편화]$|회차$/.test(b))return{base:b,variant:m[2],kind:"N"};}
  m=s.match(/^(.{4,}?)(?<=[A-Za-z가-힣])([1-5])$/);
  if(m)return{base:m[1],variant:m[2],kind:"N"};
  return null;}

function abCurStrip(name){let s=String(name||"");
  s=s.replace(/\.(mp4|png|jpe?g|gif|webp|mov|webm)$/i,"");
  s=s.replace(/\d{3,4}\s*[xX×]\s*\d{3,4}/g," ");
  s=s.replace(/(?<!\d)\d{1,2}\s*[xX×:\-]\s*\d{1,2}(?!\d)/g," ");
  s=s.replace(/[_\-\s.]*(mp4|mov|webm|jpe?g|png|gif)\s*$/i," ");
  return s.replace(/[_\-\s.]+$/,"").trim();}
 
function abDetect(name){const out={};
  if(!name||/^https?:\/\//i.test(String(name)))return out;
   
  const nm=String(name).replace(/(?<!\d)\d{3,4}\s*[xX×]\s*\d{2}(?!\d)/g," ");
  const tk=abToks(abStrip(nm));
  const put=(k,toks,variant,sub)=>{out[k]={key:abKeyOf(toks),variant,disp:toks.join("_"),sub:sub||""};};
  const lastIdx=fn=>{let i=-1;tk.forEach((t,j)=>{if(fn(t,j))i=j;});return i;};
   
  let i=lastIdx(t=>abIsDbl(t));
  if(i>=0){const rest=tk.slice(0,i).concat(tk.slice(i+1));if(rest.length&&abBaseOk(rest))put("T",rest,tk[i].toUpperCase());}
   
  const v=abVariantOf(nm);
  if(v&&v.kind==="L")out.L={key:abKeyOf(abNormBase(v.base).split(" ")),variant:v.variant,disp:v.base,sub:""};
  else if(v&&v.kind==="N"){const s2=abCurStrip(nm);
    const sub=/[Vv](?:er|ersion)?[_\-\s.]*[1-5]$/.test(s2)?"v":/0[1-5]$/.test(s2)?"pad"
      :(/(?:^|[_\-\s.])(ep|episode|part|pt|cut)[_\-\s.]*[1-5]$/i.test(s2)||/([편화]|회차)[_\-\s.]*[1-5]$/.test(s2))?"ep":"tail";
    out.N={key:abKeyOf(abNormBase(v.base).split(" ")),variant:v.variant,disp:v.base,sub};}
  else if(!v){const m=abCurStrip(nm).match(/^(.{2,}?)[_\-\s.]+(?:시안)?([a-f])$/);
    if(m){const bq=m[1].replace(/[^A-Za-z0-9가-힣]/g,"");
      if(bq.length>=4||/[가-힣]{2}/.test(bq))out.L={key:abKeyOf(abNormBase(m[1]).split(" ")),variant:m[2].toUpperCase(),disp:m[1],sub:"lc"};}}
   
  i=lastIdx((t,j)=>j<tk.length-1&&/^[A-F]$/.test(t));
  if(i>=0){const rest=tk.slice(0,i).concat(tk.slice(i+1));if(abBaseOk(rest))put("M",rest,tk[i]);}
   
  i=lastIdx(t=>t.length>=3&&/[a-z가-힣][A-F]$/.test(t));
  if(i>=0){const rest=tk.slice(0,i).concat([tk[i].slice(0,-1)],tk.slice(i+1));if(abBaseOk(rest))put("C",rest,tk[i].slice(-1));}
   
  let vc=null;
  tk.forEach((t,j)=>{const m=t.match(/^[Vv](?:er)?([1-9])$/);if(m&&j<tk.length-1)vc=[j,j+1,m[1]];
    if(/^(?:v|ver|version)$/i.test(t)&&j+1<tk.length-1&&/^[1-9]$/.test(tk[j+1]))vc=[j,j+2,tk[j+1]];});
  if(vc){const rest=tk.slice(0,vc[0]).concat(tk.slice(vc[1]));if(abBaseOk(rest))put("V",rest,vc[2]);}
   
  i=lastIdx(t=>/^([A-Fa-f]|[1-5])안$/.test(t));
  if(i>=0){const rest=tk.slice(0,i).concat(tk.slice(i+1));if(rest.length&&abBaseOk(rest))put("K",rest,tk[i][0].toUpperCase());}
  return out;}


function abSeriesLabel(nm,re){
  const vm=nm.match(/[Vv](\d+)/),em=nm.match(/ep\s?(\d+)/i);
  const lab=[vm?"V"+vm[1]:null,em?"ep"+em[1]:null].filter(Boolean).join(" ");
  if(lab)return lab;
  const s=abToks(abStrip(nm)).filter(t=>!re.test(t)&&!AB_GENERIC.has(t.toLowerCase())&&!/^\d{4,6}$/.test(t)).join(" ");
  return s.length>18?s.slice(0,17)+"…":(s||trunc(String(nm).replace(/\.[a-z0-9]+$/i,""),14));}

function buildABFamilies(ds){
  const pool=((ds&&ds.agg)||[]).filter(e=>(e.비용||0)>0&&!e._isGroup);
  const nameOf=new Map(pool.map(e=>[e,abNameOf(e)]));
  const out=[],used=new Set();
   
  const settle=fams=>{for(const f of fams.values()){
    if(f.vars.size<2||((f.kind==="N"||f.kind==="V")&&!f.vars.has("1")))continue;
    out.push(f);for(const a of f.vars.values())for(const e of a)used.add(e);}};
  const add=(fams,key,mk,variant,e)=>{let f=fams.get(key);if(!f){f=mk();fams.set(key,f);}
    let arr=f.vars.get(variant);if(!arr){arr=[];f.vars.set(variant,arr);}arr.push(e);};
   
  {const fams=new Map();
    for(const e of pool){const nm=nameOf.get(e);if(!nm)continue;
      const sm=AB_SERIES_MERGE.find(([re])=>re.test(nm));if(!sm)continue;
      const fo=abFoOf(e),key="S|"+sm[1]+"|"+fo;
      add(fams,key,()=>({key,base:sm[1],kind:"S",sub:"",fo,vars:new Map()}),abSeriesLabel(nm,sm[0]),e);}
    settle(fams);}
   
  const cand=new Map();
  for(const kind of AB_KINDS){const fams=new Map();
    for(const e of pool){if(used.has(e))continue;const nm=nameOf.get(e);if(!nm)continue;
      let c=cand.get(e);if(!c){c=abDetect(nm);cand.set(e,c);}
      const d=c[kind];if(!d)continue;
       
      const fo=abFoOf(e),key=kind+"|"+d.key+"|"+fo;
      add(fams,key,()=>({key,base:d.disp,kind,sub:d.sub,fo,vars:new Map()}),d.variant,e);}
    settle(fams);}
  return out;}

    let top=null,bw=-1;for(const[r,w]of wt)if(w>bw){bw=w;top=r;}
    nx=nx.filter(c=>fd(c.v)===top);
    const stable=nx.length===cs.length;cs=nx;if(stable)break;}
  if(!cs.length)return null;
  const V=new Map(),S=new Map();
  for(const c of cs){(V.get(c.v)||V.set(c.v,[]).get(c.v)).push(c);(S.get(c.s)||S.set(c.s,[]).get(c.s)).push(c);}

  for(let it=0;it<120;it++){

  let cw=0,cb=0;for(const[s,l]of S){const c0=l.reduce((t,c)=>t+c.cost,0);cw+=c0;cb+=c0*b.get(s);}

  for(const c of cs)c.e=c.y-a.get(c.v)-b.get(c.s);

const AB_TRIM_X=2;
function abFitTrim(cells,trim){let cs=cells.slice();const ex=[];
  for(let k=0;k<=cells.length;k++){const F=abFitLog(cs);if(!F||!trim)return{F,ex};
    let w=null;for(const c of F.cells)if(!w||Math.abs(c.e)>Math.abs(w.e))w=c;
    if(!w||Math.abs(w.e)<=Math.log(AB_TRIM_X))return{F,ex};
    ex.push(w);cs=cs.filter(c=>c!==w);}
  return{F:abFitLog(cs),ex};}
let _abTrim=(()=>{try{const v=localStorage.getItem("cr_ab_trim");return v==null?true:v==="1";}catch(_){return true;}})();
function abOverall(f,trim){const K=f.rk,dir=K.dir||-1;
  const cellRows=new Map();
  for(const s of f.sizes){const m=new Map();for(const[v,mem]of s.vars)m.set(v,abRowOf(v,mem,K));cellRows.set(s.res,m);}
  const cellsOf=(k,skip)=>{const out=[];for(const[s,m]of cellRows)for(const[v,r]of m){const x=r[k];
    if(x==null||!isFinite(x)||!(x>0)||(skip&&skip.has(v+"|"+s)))continue;out.push({v,s,y:Math.log(x),w:abCellW(k,r),cost:+r.cost||0});}return out;};
  const T=abFitTrim(cellsOf(K.k),trim);
  if(!T.F)return null;
  const excl=new Set(T.ex.map(c=>c.v+"|"+c.s));
  const adj=F=>{const o=new Map();if(F)for(const[v,a]of F.a)o.set(v,Math.exp(a+F.B));return o;};
  const aK=adj(T.F);
  const rows=[...f.vars.entries()].map(([v,mem])=>{const r=abRowOf(v,mem,K);r._pooled=r.pv;r.pv=aK.has(v)?aK.get(v):null;r[K.k]=r.pv;r._ov=1;return r;});
   
  for(const m of AB_MET){if(!m.dir||m.k===K.k||m.g==="qua")continue;
    const o=adj(abFitLog(cellsOf(m.k,excl)));
    for(const r of rows)r[m.k]=o.has(r.variant)?o.get(r.variant):null;}
  for(const r of rows)r["영상 완주율"]=r.vcr;
  rows.sort(abRowCmp(dir));
  const better=(x,y)=>dir<0?x<y:x>y;
  const sizes=f.sizes.map(s=>{const m=cellRows.get(s.res),vals=new Map();
    for(const[v,r]of m){const x=r[K.k];vals.set(v,{x:x!=null&&isFinite(x)&&x>0?x:null,ex:excl.has(v+"|"+s.res),r});}
    const ok=[...vals.entries()].filter(([,c])=>c.x!=null&&!c.ex);
    let bs=null,ws=null;for(const q of ok){if(!bs||better(q[1].x,bs[1].x))bs=q;if(!ws||better(ws[1].x,q[1].x))ws=q;}
    const gap=ok.length>=2?(dir<0?ws[1].x/bs[1].x-1:bs[1].x/ws[1].x-1):null;
    return{res:s.res,cost:s.cost,vals,best:ok.length>=2?bs[0]:null,gap,n:ok.length,vol:ok.length>=2&&ok.every(([,c])=>abCellVolOk(K.k,c.r))};});
  let mx=null;for(const z of sizes)if(z.gap!=null&&z.vol&&z.gap>=0.05&&(!mx||z.gap>mx.gap))mx=z;
   
  const zOf=(va,vb)=>{let num=0,den=0,sh=0,win=0,cw=0,ct=0;
    for(const z of sizes){const ca=z.vals.get(va),cb=z.vals.get(vb);if(!ca||!cb||ca.x==null||cb.x==null||ca.ex||cb.ex)continue;
      if(abCellVolOk(K.k,ca.r)&&abCellVolOk(K.k,cb.r)){const c2=(+ca.r.cost||0)+(+cb.r.cost||0);sh++;ct+=c2;if(better(ca.x,cb.x)){win++;cw+=c2;}}
      const zz=abSig(K.k,ca.r,cb.r),n=abSigN(K.k,ca.r,cb.r);if(zz==null||!(n>0))continue;num+=Math.sqrt(n)*zz;den+=n;}
    return{z:den>0?num/Math.sqrt(den):null,shared:sh,wins:win,costShare:ct>0?cw/ct:null};};
  const rk=rows.filter(r=>r.pv!=null);
   
  const wins=new Map();for(const z of sizes)if(z.best!=null&&z.vol)wins.set(z.best,(wins.get(z.best)||0)+1);
  return{rows,sizes,excl:T.ex.length,max:mx,wins,nCmp:sizes.filter(z=>z.n>=2).length,nMain:sizes.filter(z=>z.vol).length,
    s12:rk.length>=2?zOf(rk[0].variant,rk[1].variant):null,s1n:rk.length>=2?zOf(rk[0].variant,rk[rk.length-1].variant):null};}

function abColorsOf(rows){const m=new Map(),rk=rows.filter(r=>r.pv!=null),n=rk.length;

function abPrepCore(f){f.multi=f.sizes.length>1;

  f.order=f.ovRows.map(r=>r.variant);

  f.defRes=f.multi?(f.cmp?"#":"*"):(f.sizes[0]?f.sizes[0].res:"*");

  f.sel=keep&&(keep==="#"?f.cmp&&f.multi:keep==="*"?!f.cmp&&f.multi:f.sizes.some(s=>s.res===keep))?keep:f.defRes;

function abViewRows(f){const K=f.rk;let rows;

function abWinOf(f,rows,mode){const K=f.rk,dir=K.dir||-1,rk=rows.filter(r=>r.pv!=null);
  if(rows.length<2)return{state:"single",a:rows[0]};
  if(rk.length<2)return{state:"none",a:rows[0],b:rows[1],partial:rk.length===1};
  const a=rk[0],b=rk[1],L=rk[rk.length-1];
  const gp=(x,y)=>dir<0?(y.pv-x.pv)/Math.abs(y.pv||1):(x.pv-y.pv)/Math.abs(y.pv||1);
  const adv=gp(a,b);let z,zl,sh=null,wn=null;
  let cs=null;
  if(mode==="#"&&f.ov){const q=f.ov.s12||{};z=q.z??null;zl=f.ov.s1n?f.ov.s1n.z:null;sh=q.shared??null;wn=q.wins??null;cs=q.costShare??null;}
  else{z=abSig(K.k,a,b);zl=abSig(K.k,a,L);}
   
  const st=(zz,g)=>g<0.05?"uncertain":K.k==="CPM"?"certain":zz==null?"uncertain":zz>=1.96?"certain":zz>=1.28?"probable":"uncertain";
  let state=st(z,adv);if(state==="certain"&&adv>=0.2)state="strong";

  return{state,a,b,adv,z,close:adv<0.05,shared:sh,wins:wn,costShare:cs,n:rk.length,lose:rk.length>=2?{r:L,adv:la,state:st(zl,la)}:null};}
 
function abRepOf(r){return r.mem.slice().sort((x,y)=>((y.score??-1)-(x.score??-1))||((y.비용||0)-(x.비용||0)))[0];}

const AB_RES_RE=/(?<!\d)\d{3,4}\s*[x×X]\s*\d{2,4}(?!\d)/g;
function abConceptOf(e){const n=String(abNameOf(e)||e.name||"")

  return n||"(이름 없음)";}  
function abConceptsOf(list){const m=new Map();
  for(const e of list){const c=abConceptOf(e);(m.get(c)||m.set(c,[]).get(c)).push(e);}
  const szOf=arr=>new Set(arr.map(e=>abResOf(e)||"?"));
   
  const keys=[...m.keys()].sort((a,b)=>a.length-b.length);
  for(const k of keys){if(!m.has(k))continue;const sz=szOf(m.get(k));
    for(const k2 of keys){if(k2===k||!m.has(k2)||!(k2+" ").startsWith(k+" "))continue;
      const s2=szOf(m.get(k2));if([...s2].some(x=>sz.has(x)))continue;

function abGrpLabels(keys){const clean=k=>{const t=k.split(" ").filter(w=>!/^(video|vid|img|image|mp4|png)$/i.test(w)&&!/^\d{4}$|^\d{6}$/.test(w));return t.length?t:k.split(" ");};
  const toks=keys.map(clean),n=toks.length;
   
  const df=new Map();for(const t of toks)for(const w of new Set(t.map(x=>x.toLowerCase())))df.set(w,(df.get(w)||0)+1);
  const common=w=>{const c=df.get(w.toLowerCase())||0;return n>=3?c>=Math.ceil(n*0.6):c>=n;};
  const out=toks.map(t=>t.filter(w=>!common(w)).join(" "));
  if(out.some(x=>!x)||new Set(out).size<out.length)return toks.map(t=>t.join(" "));

function abGrpFam(b,C){const keys=[...C.keys()],labs=abGrpLabels(keys),vars=new Map();

const abFamCost=f=>[...f.vars.values()].reduce((s,a)=>s+a.reduce((t,e)=>t+(e.비용||0),0),0);
 
function abApplyGroups(ds,fams){const media=String((ds&&ds.media)||"");
  const pool=((ds&&ds.agg)||[]).filter(e=>(e.비용||0)>0&&!e._isGroup);
  const inFam=new Set();fams.forEach(f=>{for(const a of f.vars.values())for(const e of a)inFam.add(e);});
  const B=new Map();
  for(const e of pool){const gid=abGrpIdOf(e);if(!gid)continue;const fo=abFoOf(e);if(fo!=="영상"&&fo!=="이미지")continue;
    const gk=media+"|"+gid+"|"+fo;let b=B.get(gk);if(!b){b={gk,fo,list:[],lab:abGrpLabOf(e)};B.set(gk,b);}b.list.push(e);}
  const add=[],cands=[];
  for(const b of B.values()){const st=abGrpState(b.gk);if(st==="out")continue;
    const C=abConceptsOf(b.list);
    if(st==="in"){if(C.size>=2)add.push(abGrpFam(b,C));continue;}
    if(b.list.every(e=>inFam.has(e)))continue;
    for(const[k,a]of[...C])if(a.reduce((s,e)=>s+(e.비용||0),0)<AB_POOL_MIN)C.delete(k);
    const W=new Map();for(const[k,a]of C)W.set(k,abWeeksOfRow({mem:a}));

      if(f.vars.size<2)fams.splice(i,1);}
    fams.push(...add);}

  finally{clearTimeout(to);}

const IDB={_db:null,
  open(){if(this._db)return Promise.resolve(this._db);
    return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error("no idb"));
      const q=indexedDB.open("cr_cache",1);
      q.onupgradeneeded=()=>{q.result.createObjectStore("kv");};
      q.onsuccess=()=>{this._db=q.result;res(this._db);};
      q.onerror=()=>rej(q.error);});},
  async get(k){try{const db=await this.open();
    return await new Promise((res,rej)=>{const t=db.transaction("kv").objectStore("kv").get(k);
      t.onsuccess=()=>res(t.result||null);t.onerror=()=>rej(t.error);});}catch(_){return null;}},
  async set(k,v){try{const db=await this.open();
    return await new Promise((res,rej)=>{const t=db.transaction("kv","readwrite").objectStore("kv").put(v,k);
      t.onsuccess=()=>res(true);t.onerror=()=>rej(t.error);});}catch(_){return false;}},
  async del(k){try{const db=await this.open();
    return await new Promise((res,rej)=>{const t=db.transaction("kv","readwrite").objectStore("kv").delete(k);
      t.onsuccess=()=>res(true);t.onerror=()=>rej(t.error);});}catch(_){return false;}}};

async function cloudDeltaLoad(pw,st,sig,cached){
  const lastW=st&&st.last_week?String(st.last_week).slice(0,10):null;
  if(!cached||!cached.rows||!cached.rows.length||!lastW||!/^\d{4}-\d{2}-\d{2}$/.test(lastW))
    return cloudFullLoad(pw,sig);
  const cut=new Date(Date.parse(lastW)-8*7*864e5).toISOString().slice(0,10);
  const [part,kvb]=await Promise.all([sbRpc("cr_load_part",{pw,p_since:cut},{timeout:60000}),fetchNameMapBundle(pw)]);
  const keep=cached.rows.filter(r=>String(r.week_start).slice(0,10)<cut);
  const rows=keep.concat(part);
  if(sig&&isFinite(+sig.rows)&&rows.length!==+sig.rows)
    return cloudFullLoad(pw,sig);  
  applyNameMapBundle(kvb);
  loadCloudRows(rows);
  if(sig)bootCacheSave(rows,kvb,sig);
  return rows;}
async function cloudFullLoad(pw,sig){
  const [rows,kvb]=await Promise.all([sbRpc("cr_load",{pw},{timeout:120000}),fetchNameMapBundle(pw)]);
  applyNameMapBundle(kvb);
  if(rows.length)loadCloudRows(rows);
  if(!sig){try{sig=bootSigOf(await sbRpc("cr_status",{pw}));}catch(_){sig=null;}}
  if(sig)bootCacheSave(rows,kvb,sig);
  return rows;}

    <li><b>반응 좋음 ≠ 좋은 유저 획득</b> — 점수(반응·효율)가 높아도 규모(AUU)가 작으면 위너 판단 금지. 그래서 규모가 점수의 절반이에요</li>
    <li><b>구글 ROAS는 점수 0% 반영</b> — 모델링 값이라 주간 1,000배도 널뜀. 표에선 '참고'로만 (몰로코·메타의 ROAS D7은 AF 실측이지만 역시 참고)</li>
    <li><b>D1·D7 잔존율 = 보조 지표</b>(회의: 메인 아님 — 채점 기본 제외, D7이 주 보조) — 표·상세·효율지도에서 유저 질 확인용. 채점설정에서 수동 추가는 가능. Shayna 바로구매 잔존 대시보드 기준과의 연동은 향후 검토</li>
    <li><b>CTR은 참고용</b> — 신규+재활성 eCPA와 비상관(회의 실측 합의). 물리적으로 불가능한 CTR(15% 초과)은 노출 과소집계 이상이라 ⚠ 배지와 함께 자동 무효화 · 몰로코 영상은 '클릭'에 재생 혼입(중앙값 31%)이라 CTR·CPC 자체를 제외</li>
    <li><b>"광고비를 늘리면 불리한 것 아닌가요?"</b> — 등수는 소재 1개=1표(광고비 비가중)이고, 소액 쪽 운빨만 표본·지출 축소와 광고비 하위 15% 컷으로 차단해요. 증액 자체는 불이익이 없어요</li>
    <li><b>표본·지출이 적으면 점수 50 쪽 축소</b>(내부 점수) · '학습중' 배지는 첫 집행 주에만 붙어요</li>
    <li><b>총점은 주차 점수의 평균이 아님</b> — 선택 기간 전체를 합산한 성과의 점수 · <b>±3점 이내는 사실상 동점</b> · <b>최신 주 단가는 부풀어 보임</b>(전환 집계 지연 — 그 주 판단 보류)</li>
    <li><b>등급 = 계정 내 5분위</b> · 규모는 50%(효율:규모 반반 — 2026-07 회의 확정) · 창이 좁으면 중요도 낮은 열부터 자동 숨김</li>
  </ul>

function setupDual(rootId,vertical,getQ,setQ){const el=$("#"+rootId);
  const fill=el.querySelector(".dfill"),thumbs=[...el.querySelectorAll(".dthb")];
  const t=h=>thumbs.find(x=>x.dataset.h===h);
  function paint(){const q=getQ();
    if(vertical){const lo=q.lo+"%",hi=q.hi+"%";
      t("lo").style.top=(100-q.lo)+"%";t("hi").style.top=(100-q.hi)+"%";
      fill.style.top=(100-q.hi)+"%";fill.style.bottom=q.lo+"%";}
    else{t("lo").style.left=q.lo+"%";t("hi").style.left=q.hi+"%";
      fill.style.left=q.lo+"%";fill.style.right=(100-q.hi)+"%";}}
  function fracFromEvent(e){const r=el.getBoundingClientRect();
    if(vertical){const f=(e.clientY-r.top)/r.height;return Math.max(0,Math.min(1,1-f));}
    const f=(e.clientX-r.left)/r.width;return Math.max(0,Math.min(1,f));}
  let drag=null;
  function down(e){e.preventDefault();const tg=e.target.closest(".dthb");
    if(tg){drag=tg.dataset.h;tg.classList.add("act");}
    else{const pct=fracFromEvent(e)*100,q=getQ();drag=Math.abs(pct-q.lo)<Math.abs(pct-q.hi)?"lo":"hi";t(drag).classList.add("act");}
    move(e);window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);}
  function move(e){if(!drag)return;const pct=Math.round(fracFromEvent(e)*100),q={...getQ()};
    if(drag==="lo")q.lo=Math.min(pct,q.hi-1);else q.hi=Math.max(pct,q.lo+1);
    setQ(q);paint();}
  function up(){if(drag)t(drag).classList.remove("act");drag=null;
    window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);}
  el.addEventListener("pointerdown",down);
  return{paint,reset:()=>{const q=getQ();q.lo=0;q.hi=100;setQ(q);paint();}};}
const _qxRange=setupDual("qxRange",false,()=>({lo:qView.xlo,hi:qView.xhi}),q=>{qView.xlo=q.lo;qView.xhi=q.hi;_qRender();});

let _markChain=new Map();
function _seqMarkWrite(id,fn){
  const prev=_markChain.get(id)||Promise.resolve();
  const next=prev.catch(()=>{}).then(fn);
  _markChain.set(id,next);
  next.catch(()=>{}).finally(()=>{if(_markChain.get(id)===next)_markChain.delete(id);});
  return next;}

const CH_LABEL={Meta:"메타",Google:"구글","Google AEO":"구글 AEO","Google ACE":"구글 ACE",Moloco:"몰로코",몰로코:"몰로코",구글:"구글",메타:"메타"};
function chLabel(c){return CH_LABEL[c]||c;}
const TIER_LAB={g2:"매우좋음",g1:"좋음",m:"보통",w1:"나쁨",w2:"매우나쁨",na:"–"};
function _med(a){const s=(a||[]).filter(v=>v!=null&&isFinite(v)).sort((x,y)=>x-y);if(!s.length)return null;const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function _fmtCell(v,f){if(v==null||(typeof v==="number"&&!isFinite(v)))return "–";return f==="won"?fmtWon(v):f==="int"?fmtInt(v):f==="pct"?fmtPct(v):f==="num"?(v.toFixed(1)+"×"):String(v);}
function _effF(L){return (L.effCol==="CTR"||L.key==="cg")?"pct":"won";}
function expCols(L,list){
  const cols=[{k:"비용",lab:"광고비",f:"won"},{k:"노출 수",lab:"노출",f:"int"}];
  if(L.volCol&&L.volCol!=="노출 수")cols.push({k:L.volCol,lab:L.volLab||L.volCol,f:"int"});
  if(L.effCol)cols.push({k:L.effCol,lab:L.effLabel||L.effCol,f:_effF(L)});
  if(L.effCol!=="CTR"&&list.some(e=>e.CTR!=null))cols.push({k:"CTR",lab:"CTR",f:"pct"});
  if(list.some(e=>e["영상 완주율"]!=null))cols.push({k:"영상 완주율",lab:"완주율",f:"pct"});
  if(list.some(e=>e._g_ROAS!=null))cols.push({k:"_g_ROAS",lab:"ROAS",f:"num"});
  return cols;}
function expRow(e,cols,withCreator,nRank){
  const nm=String(displayNameOf(e)).replace(/\|/g,"/").replace(/\s+/g," ").trim();
   
  const pu=stableMediaUrl(previewUrlOf(e));
  const nmCell=pu?`[${trunc(nm,44).replace(/([\[\]])/g,"\\$1")}](${pu})`:trunc(nm,44);
  const cells=[nmCell,svcOf(e)||"기타"];
  if(withCreator)cells.push(rosterCreatorsOf(e).join(",")||"기타");
  for(const c of cols)cells.push(_fmtCell(e[c.k],c.f));
   
  return "| "+cells.join(" | ")+" |";}
function expTable(list,cols,withCreator,nRank){
  const h=["소재","서비스",...(withCreator?["제작자"]:[]),...cols.map(c=>c.lab)];  
  const lines=["| "+h.join(" | ")+" |","| "+h.map(()=>"---").join(" | ")+" |"];
  for(const e of list)lines.push(expRow(e,cols,withCreator,nRank));
  return lines.join("\n");}
function _tierDistStr(list){const d={g2:0,g1:0,m:0,w1:0,w2:0};for(const e of list)if(d[e.tier]!=null)d[e.tier]++;
  return `매우좋음 ${d.g2}·좋음 ${d.g1}·보통 ${d.m}·나쁨 ${d.w1}·매우나쁨 ${d.w2}`;}
function expSummary(list,L,peers){
  const sum=k=>list.reduce((s,e)=>s+(+e[k]||0),0);
  let s=`총 광고비 ${fmtWon(sum("비용"))}`;
  if(L.volCol)s+=` · 총 ${L.volLab||L.volCol} ${fmtInt(sum(L.volCol))}`;
  if(L.effCol)s+=` · ${L.effLabel||L.effCol} 중앙값 ${_fmtCell(_med(list.map(e=>e[L.effCol])),_effF(L))}`;
  const medS=_med(list.map(e=>e.score));
  if(medS!=null){s+=` · 점수 중앙값 ${Math.round(medS)}`;
    if(peers&&peers.length){const mp=_med(peers.map(e=>e.score));if(mp!=null){const d=Math.round(medS)-Math.round(mp);s+=` (비교군 중앙값 ${Math.round(mp)} 대비 ${d>=0?"+":""}${d})`;}}}
  s+=` · 등급 ${_tierDistStr(list)}`;
  return s;}
function expBench(mine,peers,L){
  const ps=peers.map(e=>e.score);const medP=_med(ps);

  authSnapSave(pw,{name,viewer});
