<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI 생성 API 요금 비교</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F6F4F1; --surface:#FFFFFF; --sunk:#EFEBE6; --hover:#F4F0EB;
  --ink:#1D1B19; --ink2:#47423D; --muted:#7A736B; --line:#E5E0D9; --line2:#D3CCC3;
  --accent:#E35B12; --accent-soft:#FDEBDF; --accent-ink:#A8410A;
  --base:#2D6BB5; --other:#8C857C; --off:#D9D3CB;
  --sans:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:1200px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:clamp(24px,3.4vw,32px);line-height:1.2;letter-spacing:-.01em;margin:0 0 10px;text-wrap:balance}
h2{font-size:16px;line-height:1.35;margin:0 0 12px;text-wrap:balance}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.badge{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
.badge.key{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-weight:600}
.verdict{font-size:clamp(17px,2.1vw,21px);font-weight:600;line-height:1.45;margin:0;text-wrap:balance;max-width:62ch}
.verdict em{font-style:normal;color:var(--accent-ink)}
.todo{margin:8px 0 0;font-size:14px;color:var(--ink2)}
.todo b{color:var(--ink)}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;margin-top:22px;align-items:start}
.panel,.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel,.card,.kpi,.results>*{min-width:0}
.controls{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));display:grid;gap:14px}
.results{display:grid;gap:14px;min-width:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--sunk);border-radius:10px;padding:3px}
.tabs button,.seg button,.chips button{font:inherit;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--ink2)}
.tabs button{font-size:14px;font-weight:600;padding:8px 6px;border-radius:8px}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(40,30,20,.12)}
.field{display:grid;gap:4px}
.field .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.field label,.field .lab{font-size:14px;font-weight:600}
.val{font-family:var(--mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;margin:0;height:24px;accent-color:var(--accent);cursor:pointer}
.grp{display:grid;gap:12px}
.sep{height:1px;background:var(--line);margin:2px 0}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{flex:1 1 0;min-width:0;font-size:13px;padding:6px 6px;border-radius:8px;border-color:var(--line2);background:var(--surface);white-space:nowrap}
.seg.wide button{flex:1 1 100%}
.seg button[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.kpi.hl{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.kpi .lab{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .num{font-family:var(--mono);font-size:clamp(20px,2.4vw,26px);font-weight:600;letter-spacing:-.02em;line-height:1.25;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:13px;color:var(--ink2);margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin:-4px 0 10px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sw.s{background:var(--accent)} .sw.b{background:var(--base)} .sw.o{background:var(--other)}
.bars{display:grid;gap:2px}
.brow{display:grid;grid-template-columns:minmax(130px,200px) minmax(0,1fr);gap:4px 12px;align-items:center;padding:6px 8px;border-radius:9px}
.brow.click{cursor:pointer}
.brow.click:hover{background:var(--hover)}
.brow.on{background:var(--accent-soft)}
.bname{font-size:13.5px;font-weight:600;line-height:1.3;min-width:0}
.bname small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:1px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:5px;margin-left:5px;vertical-align:1px;background:var(--sunk);color:var(--ink2)}
.tag.rec{background:var(--accent);color:#fff}
.tag.base{background:var(--base);color:#fff}
.btrack{display:flex;align-items:center;gap:8px;min-width:0}
.btrack + .btrack{margin-top:2px}
.bar{height:14px;flex:none;min-width:2px;border-radius:0 4px 4px 0;background:var(--other)}
.bar.s{background:var(--accent)} .bar.b{background:var(--base)} .bar.na{background:repeating-linear-gradient(135deg,var(--off) 0 3px,transparent 3px 6px);border:1px solid var(--off)}
.blab{font-family:var(--mono);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink)}
.blab .d{color:var(--ink2)} .blab .d.up{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}
.two .h{font-size:11.5px;color:var(--muted);margin-bottom:1px}
.colhead{display:grid;grid-template-columns:minmax(130px,200px) minmax(0,1fr);gap:12px;padding:0 8px 4px;font-size:12px;color:var(--muted)}
.colhead .two{gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button{font-size:13px;padding:5px 11px;border-radius:999px;border-color:var(--line2);background:var(--surface)}
.tbl{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
td:first-child{font-weight:600;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:#E3F1E8;color:#1E6B45} .pill.sub{background:#FBE4E1;color:#A3271B}
.notes ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13.5px;color:var(--ink2)}
.notes .src{margin-top:12px;font-size:13px;color:var(--muted);line-height:1.8}
.notes a{color:var(--base)}
.tip{position:fixed;z-index:9;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;line-height:1.45;padding:7px 10px;border-radius:8px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tip b{font-family:var(--mono);font-weight:600}
@media (max-width:920px){.layout{grid-template-columns:minmax(0,1fr)}.controls{position:static}}
@media (max-width:600px){
  .kpis{grid-template-columns:minmax(0,1fr)}
  .brow,.colhead{grid-template-columns:minmax(0,1fr)}
  .colhead>span:first-child{display:none}
  .panel,.card{padding:14px}
}
</style>
<div class="wrap">
  <header>
    <h1>AI 생성 API 요금 비교</h1>
    <div class="badges">
      <span class="badge key">추천안 = 쓴 만큼 내는 API · 구독 아님</span>
      <span class="badge">월 기준</span>
      <span class="badge">단가 2026-10-14</span>
      <span class="badge">₩1,450 / $1</span>
    </div>
    <p class="verdict" id="verdict"></p>
    <p class="todo" id="todo"></p>
  </header>

  <div class="layout">
    <aside class="panel controls" aria-label="계산 조건">
      <div class="tabs" role="tablist">
        <button id="tab-use" role="tab" aria-selected="true" data-mode="use">사용량으로 계산</button>
        <button id="tab-bud" role="tab" aria-selected="false" data-mode="bud">예산으로 계산</button>
      </div>

      <div class="grp" id="grp-use">
        <div class="field"><div class="row"><label for="sl-main">본편 영상</label><span class="val" id="v-main"></span></div>
          <input type="range" id="sl-main" min="0" max="200" step="1" data-k="main"></div>
        <div class="field"><div class="row"><label for="sl-tests">테스트 영상</label><span class="val" id="v-tests"></span></div>
          <input type="range" id="sl-tests" min="0" max="400" step="2" data-k="tests"></div>
        <div class="field"><div class="row"><label for="sl-prem">프리미엄 이미지</label><span class="val" id="v-prem"></span></div>
          <input type="range" id="sl-prem" min="0" max="1000" step="5" data-k="prem"></div>
        <div class="field"><div class="row"><label for="sl-cheap">저가 이미지</label><span class="val" id="v-cheap"></span></div>
          <input type="range" id="sl-cheap" min="0" max="3000" step="10" data-k="cheap"></div>
      </div>

      <div class="grp" id="grp-bud" hidden>
        <div class="field"><div class="row"><label for="sl-budget">월 예산</label><span class="val" id="v-budget"></span></div>
          <input type="range" id="sl-budget" min="10000" max="2000000" step="10000" data-k="budget"></div>
        <div class="field"><div class="row"><label for="sl-share">영상 비중</label><span class="val" id="v-share"></span></div>
          <input type="range" id="sl-share" min="0" max="100" step="5" data-k="share"></div>
      </div>

      <div class="sep"></div>

      <div class="field"><span class="lab">영상 길이</span>
        <div class="seg" data-k="len"><button data-v="5">5초</button><button data-v="8">8초</button><button data-v="10">10초</button><button data-v="15">15초</button></div></div>
      <div class="field"><span class="lab">해상도</span>
        <div class="seg" data-k="res"><button data-v="480">480p</button><button data-v="720">720p</button><button data-v="1080">1080p</button></div></div>
      <div class="field"><span class="lab">이미지 모델</span>
        <div class="seg" data-k="tier"><button data-v="req">GPT 2 · NB Pro</button><button data-v="new">GPT 2.5 · NB 2.1</button></div></div>
      <div class="field"><span class="lab">비교 기준</span>
        <div class="seg" data-k="base"><button data-v="hfapi">힉스필드 API</button><button data-v="hfsub">힉스필드 구독</button></div></div>
    </aside>

    <main class="results">
      <section class="kpis" id="kpis" aria-live="polite"></section>

      <section class="card">
        <h2 id="c1-title"></h2>
        <div class="legend"><span><i class="sw s"></i>선택한 안</span><span><i class="sw b"></i>비교 기준</span><span><i class="sw o"></i>그 외</span></div>
        <div id="c1-head"></div>
        <div class="bars" id="c1"></div>
      </section>

      <section class="card">
        <h2 id="c2-title"></h2>
        <div class="legend" id="c2-legend"></div>
        <div class="bars" id="c2"></div>
      </section>

      <section class="card">
        <h2 id="c3-title"></h2>
        <div class="chips" id="chips"></div>
        <div class="legend" id="c3-legend"></div>
        <div class="bars" id="c3"></div>
      </section>

      <section class="card">
        <h2>결제 방식 — 구독인지, 쓴 만큼인지</h2>
        <div class="tbl"><table>
          <thead><tr><th>결제처</th><th>방식</th><th>구독</th><th>알아둘 점</th></tr></thead>
          <tbody id="pay"></tbody>
        </table></div>
      </section>

      <section class="card notes">
        <h2>계산 가정</h2>
        <ul id="notes"></ul>
        <div class="src" id="src"></div>
      </section>
    </main>
  </div>
</div>
<div class="tip" id="tip" hidden></div>
<script>
(()=>{
const FX=1450, TL=4, ORF=1.055;
const S={mode:'use',main:10,tests:20,prem:60,cheap:150,budget:100000,share:70,len:8,res:720,tier:'new',base:'hfapi',sel:'rec',model:'seedance'};
try{const z=JSON.parse(localStorage.getItem('apisim1')||'null');if(z&&typeof z==='object')for(const k in S)if(k in z&&typeof z[k]===typeof S[k])S[k]=z[k];}catch(e){}
const save=()=>{try{localStorage.setItem('apisim1',JSON.stringify(S))}catch(e){}};

const PN={byteplus:'BytePlus',openai:'OpenAI',google:'Google',fal:'fal',replicate:'Replicate',openrouter:'OpenRouter',wavespeed:'WaveSpeed',kie:'Kie.ai',runware:'Runware',hfapi:'힉스필드 API'};
// Seedance 2.5, $/초 (null = 해당 해상도 없음)
const VID={
  byteplus:{480:.1028,720:.2312,1080:.569},
  replicate:{480:.1028,720:.2312,1080:null},
  openrouter:{480:.1028*ORF,720:.2312*ORF,1080:null},
  kie:{480:.14,720:.315,1080:.79},
  wavespeed:{480:.18,720:.36,1080:null},
  hfapi:{480:.2054,720:.4622,1080:1.1372},
  fal:{480:.2205,720:.473,1080:1.164}
};
// 이미지, $/장
const IMG={
  sd5pro:{byteplus:.045,replicate:.045,wavespeed:.045,kie:.035,fal:.0675},
  gpt2:{openai:.053,fal:.053,openrouter:.053*ORF,replicate:.047,wavespeed:.057,kie:.03},
  gpt25:{openai:.0132,fal:.0132,replicate:.047},
  nbpro:{google:.134,openrouter:.134*ORF,fal:.15,replicate:.15,wavespeed:.14,kie:.09},
  nb21:{google:.0504,fal:.0593},
  cheap:{byteplus:.018,openrouter:.018*ORF,runware:.019,wavespeed:.027,fal:.035,replicate:.035}
};
const MN={seedance:'Seedance 2.5',sd5pro:'Seedream 5.0 Pro',gpt2:'GPT Image 2',gpt25:'GPT Image 2.5',nbpro:'Nano Banana Pro',nb21:'Nano Banana 2.1',cheap:'Seedream 저가'};
const VAR={byteplus:'Flash',openrouter:'Flash',runware:'Flash',wavespeed:'Flash',fal:'5.0 Lite',replicate:'5.0 Lite'};
const OFFICIAL={sd5pro:'byteplus',gpt2:'openai',gpt25:'openai',nbpro:'google',nb21:'google',cheap:'byteplus'};
const TIER={req:['sd5pro','gpt2','nbpro'],new:['sd5pro','gpt25','nb21']};
// 힉스필드 구독: 크레딧 단가, 플랜
const HCR={v:{480:3,720:6.5,1080:9},sd5pro:1,gpt2:1,gpt25:1,nbpro:2,nb21:2,cheap:1};

const sb=(usd,label)=>({usd,sub:label});
const HFI=sb(.0527,'GPT Image 2.5 high');
const OPT=[
  {id:'rec',name:'BytePlus + fal',n:2,rec:true,map:{v:'byteplus',sd5pro:'byteplus',gpt2:'fal',gpt25:'fal',nbpro:'fal',nb21:'fal',cheap:'byteplus'}},
  {id:'direct3',name:'BytePlus + OpenAI + Google',n:3,map:{v:'byteplus',sd5pro:'byteplus',gpt2:'openai',gpt25:'openai',nbpro:'google',nb21:'google',cheap:'byteplus'}},
  {id:'openrouter',name:'OpenRouter',n:1,map:{v:'openrouter',sd5pro:sb(.04*ORF,'Seedream 4.5'),gpt2:'openrouter',gpt25:sb(.053*ORF,'GPT Image 2'),nbpro:'openrouter',nb21:sb(.134*ORF,'Nano Banana Pro'),cheap:'openrouter'}},
  {id:'replicate',name:'Replicate',n:1,map:{v:'replicate',sd5pro:'replicate',gpt2:'replicate',gpt25:'replicate',nbpro:'replicate',nb21:sb(.15,'Nano Banana Pro'),cheap:'replicate'}},
  {id:'kie',name:'Kie.ai',n:1,map:{v:'kie',sd5pro:'kie',gpt2:'kie',gpt25:sb(.03,'GPT Image 2'),nbpro:'kie',nb21:sb(.09,'Nano Banana Pro'),cheap:sb(.035,'Seedream 5.0 Pro')}},
  {id:'wavespeed',name:'WaveSpeed',n:1,map:{v:'wavespeed',sd5pro:'wavespeed',gpt2:'wavespeed',gpt25:sb(.057,'GPT Image 2'),nbpro:'wavespeed',nb21:sb(.14,'Nano Banana Pro'),cheap:'wavespeed'}},
  {id:'fal',name:'fal',n:1,map:{v:'fal',sd5pro:'fal',gpt2:'fal',gpt25:'fal',nbpro:'fal',nb21:'fal',cheap:'fal'}},
  {id:'hfapi',name:'힉스필드 API',n:1,map:{v:'hfapi',sd5pro:HFI,gpt2:HFI,gpt25:HFI,nbpro:HFI,nb21:HFI,cheap:sb(.04,'Qwen Image')}},
  {id:'hfsub',name:'힉스필드 구독',n:1,isSub:true}
];
const O=Object.fromEntries(OPT.map(o=>[o.id,o]));

const unit=(o,k)=>{const m=o.map[k];return (m&&typeof m==='object')?m:{usd:IMG[k][m],sub:null};};
const vps=(o,res)=>VID[o.map.v][res];
const premAvg=o=>TIER[S.tier].reduce((a,k)=>a+unit(o,k).usd,0)/3;
const subsOf=o=>o.isSub?[]:[...TIER[S.tier],'cheap'].filter(k=>unit(o,k).sub).map(k=>MN[k]+' → '+unit(o,k).sub);

// 구독 플랜 조합
const CMB=[];
for(let u=0;u<=15;u++)for(let p=0;p<=2;p++)for(let s=0;s<=4;s++)CMB.push({u,p,s,usd:u*129+p*59+s*19,cr:u*3000+p*1200+s*270});
const planMin=(cr,seed)=>{let b=null;for(const c of CMB){if(seed&&c.u+c.p===0)continue;if(c.cr<cr)continue;if(!b||c.usd<b.usd||(c.usd===b.usd&&c.cr>b.cr))b=c;}return b;};
const planMax=(usd,seed)=>{let b=null;for(const c of CMB){if(c.usd>usd+1e-9)continue;const ok=c.u+c.p>0;if(b&&seed){const bok=b.u+b.p>0;if(bok&&!ok)continue;if(ok&&!bok){b=c;continue;}}if(!b||c.cr>b.cr||(c.cr===b.cr&&c.usd<b.usd))b=c;}return b;};
const planName=c=>{if(!c||!c.usd)return '구독 없음';const p=[];if(c.u)p.push('Ultra'+(c.u>1?'×'+c.u:''));if(c.p)p.push('Plus'+(c.p>1?'×'+c.p:''));if(c.s)p.push('Starter'+(c.s>1?'×'+c.s:''));return p.join(' + ');};
const premCr=()=>TIER[S.tier].reduce((a,k)=>a+HCR[k],0)/3;

function calcUse(o){
  if(o.isSub){
    const c={main:S.main*S.len*HCR.v[S.res],test:S.tests*TL*HCR.v[480],prem:S.prem*premCr(),cheap:S.cheap*HCR.cheap};
    c.total=c.main+c.test+c.prem+c.cheap;
    const pl=planMin(c.total,(S.main+S.tests)>0);
    const r=k=>c.total?pl.usd*c[k]/c.total:0;
    return {main:r('main'),test:r('test'),prem:r('prem'),cheap:r('cheap'),total:pl.usd,plan:pl,cr:c.total};
  }
  const vm=vps(o,S.res);
  const r={main:S.main===0?0:(vm==null?null:S.main*S.len*vm),test:S.tests*TL*vps(o,480),prem:S.prem*premAvg(o),cheap:S.cheap*unit(o,'cheap').usd};
  r.total=r.main==null?null:r.main+r.test+r.prem+r.cheap;
  return r;
}
function calcBud(o){
  const B=S.budget/FX, sh=S.share/100;
  if(o.isSub){
    const pl=planMax(B,sh>0), seed=pl.u+pl.p>0, perClip=S.len*HCR.v[S.res], perImg=premCr();
    const rate=pl.cr?pl.usd/pl.cr:59/1200;
    return {clips:seed?Math.floor(pl.cr*sh/perClip+1e-9):0,imgs:Math.floor(pl.cr*(1-sh)/perImg+1e-9),spent:pl.usd,plan:pl,noSeed:sh>0&&!seed,
      clipUsd:perClip*rate,testUsd:TL*HCR.v[480]*rate,imgUsd:perImg*rate,cheapUsd:HCR.cheap*rate};
  }
  const v=vps(o,S.res), clipUsd=v==null?null:v*S.len, imgUsd=premAvg(o);
  return {clips:clipUsd==null?null:Math.floor(B*sh/clipUsd+1e-9),imgs:Math.floor(B*(1-sh)/imgUsd+1e-9),spent:B,
    clipUsd,testUsd:TL*vps(o,480),imgUsd,cheapUsd:unit(o,'cheap').usd};
}

const nf=new Intl.NumberFormat('ko-KR');
const won=usd=>{if(usd==null)return '—';const w=usd*FX;const r=w>=10000?Math.round(w/100)*100:w>=1000?Math.round(w/10)*10:Math.round(w);return '₩'+nf.format(r);};
const dol=usd=>{if(usd==null)return '—';return '$'+String(+(usd>=10?usd.toFixed(1):usd>=1?usd.toFixed(2):usd.toFixed(4)));};
const diff=(a,b)=>(a==null||b==null||!b)?null:(a-b)/b*100;
const dtxt=d=>{if(d==null)return '';const r=Math.round(Math.abs(d));if(r===0)return '같음';return d<0?r+'% 저렴':r+'% 비쌈';};
const mult=(a,b)=>(a==null||b==null)?null:(!b?(a>0?Infinity:null):a/b);
const mtxt=m=>m==null?'—':m===Infinity?'기준 0':(Math.round(m*10)/10).toFixed(1)+'배';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const $=id=>document.getElementById(id);
const wa=w=>{const c=w.charCodeAt(w.length-1);return (c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?'과':'와';};
const PAY=[

  ['힉스필드 API','선불 크레딧 · 쓴 만큼 차감',0,'$1 = 16크레딧 · Seedream · 나노바나나 · GPT Image 2 없음'],
  ['힉스필드 구독','월 구독료 고정',1,'크레딧이 매월 소멸 · Seedance는 Plus($59) 이상']

const NOTES=[
  '영상은 Seedance 2.5 기준. BytePlus는 토큰 과금 — 초당 토큰 = 가로×세로×24÷1024 (720p = 21,600), $10.7 / 100만 토큰',

  '결제처에 없는 모델은 그 결제처의 가장 가까운 모델 단가로 계산 — 목록에 ‘일부 대체’로 표시',
  '힉스필드 API는 프리미엄 이미지를 GPT Image 2.5 high($0.0527), 저가 이미지를 Qwen Image($0.04)로 계산',

];
const SRC=[['BytePlus ModelArk','https://ai.byteplus.com/en'],['fal','https://fal.ai'],['OpenAI','https://openai.com/api/pricing'],['Gemini API','https://ai.google.dev/gemini-api/docs/pricing'],['OpenRouter','https://openrouter.ai'],['Replicate','https://replicate.com/pricing'],['WaveSpeed','https://wavespeed.ai'],['Kie.ai','https://kie.ai'],['힉스필드 API','https://cloud.higgsfield.ai/credits'],['힉스필드 구독','https://higgsfield.ai/pricing']];
const TYPES=[['main','본편 영상'],['test','테스트 영상'],['prem','프리미엄 이미지'],['cheap','저가 이미지']];

function sync(){
  document.querySelectorAll('input[type=range]').forEach(el=>{el.value=S[el.dataset.k];});
  $('v-main').textContent=S.main+'개'; $('v-tests').textContent=S.tests+'개';
  $('v-prem').textContent=nf.format(S.prem)+'장'; $('v-cheap').textContent=nf.format(S.cheap)+'장';
  $('v-budget').textContent='₩'+nf.format(S.budget); $('v-share').textContent=S.share+'%';
  document.querySelectorAll('.seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===String(S[g.dataset.k])))));
  $('tab-use').setAttribute('aria-selected',String(S.mode==='use')); $('tab-bud').setAttribute('aria-selected',String(S.mode==='bud'));
  $('grp-use').hidden=S.mode!=='use'; $('grp-bud').hidden=S.mode!=='bud';
}
const kpi=(lab,num,sub,hl)=>`<div class="kpi${hl?' hl':''}"><div class="lab">${esc(lab)}</div><div class="num">${num}</div><div class="sub">${sub}</div></div>`;
const tags=o=>(o.rec?'<span class="tag rec">추천</span>':'')+(o.id===S.base?'<span class="tag base">기준</span>':'');
const bar=(v,max,c,scale)=>v==null?'<div class="bar na" style="width:24%"></div>':`<div class="bar ${c}" style="width:calc(${scale}% * ${max?Math.max(0,v)/max:0})"></div>`;
const clsOf=o=>o.id===S.sel?'s':o.id===S.base?'b':'';
const dspan=(d,isBase)=>isBase?' <span class="d">기준</span>':(d==null?'':` <span class="d${d>0.5?' up':''}">${dtxt(d)}</span>`);
const rowOpen=(o,tip)=>`<div class="brow click${o.id===S.sel?' on':''}" role="button" tabindex="0" data-sel="${o.id}" data-tip="${esc(tip)}">`;

function typeChart(title,vs,vb,subtxt){
  const sel=O[S.sel], same=S.sel===S.base;
  $('c2-title').textContent=title;
  $('c2-legend').innerHTML=`<span><i class="sw s"></i>${esc(sel.name)}</span>`+(same?'':`<span><i class="sw b"></i>${esc(O[S.base].name)}</span>`);
  const m=Math.max(1e-9,...TYPES.flatMap(([k])=>[vs[k]||0,vb[k]||0]));
  $('c2').innerHTML=TYPES.map(([k,n])=>`<div class="brow"><div class="bname">${n}<small>${subtxt[k]}</small></div><div>`
    +`<div class="btrack">${bar(vs[k],m,'s',62)}<span class="blab">${won(vs[k])}${same?'':dspan(diff(vs[k],vb[k]))}</span></div>`
    +(same?'':`<div class="btrack">${bar(vb[k],m,'b',62)}<span class="blab">${won(vb[k])}</span></div>`)+`</div></div>`).join('');
}

function renderUse(){
  const base=O[S.base], sel=O[S.sel], same=sel.id===base.id;
  const R={}; OPT.forEach(o=>R[o.id]=calcUse(o));
  const bt=R[base.id].total, st=R[sel.id].total, d=diff(st,bt), dt=dtxt(d);
  $('verdict').innerHTML=st==null?`<em>${esc(sel.name)}</em>에는 ${S.res}p Seedance가 없어요`
    :same||!bt?`이 사용량이면 <em>${esc(sel.name)}</em> 월 <em>${won(st)}</em>`
    :`이 사용량이면 <em>${esc(sel.name)}</em> 월 <em>${won(st)}</em> — ${esc(base.name)}(${won(bt)})${dt==='같음'?wa(base.name)+' <em>비슷</em>':'보다 <em>'+dt+'</em>'}`;
  const how=o=>o.isSub?planName(R.hfsub.plan)+' 월 구독':'쓴 만큼 결제';
  $('kpis').innerHTML=kpi(sel.name+' · 월',won(st),st==null?`${S.res}p 미지원`:`${dol(st)} · ${how(sel)}`,true)
    +kpi(base.name+' · 월',won(bt),`${dol(bt)} · ${how(base)}`)
    +kpi('한 달 차이',(st==null||same)?'—':won(Math.abs(bt-st)),(st==null||same)?'&nbsp;':dt);

  $('c1-title').textContent='전체 — 결제처 조합별 월 비용';
  $('c1-head').innerHTML='';
  const rows=OPT.slice().sort((a,b)=>(R[a.id].total??1e9)-(R[b.id].total??1e9));
  const max=Math.max(1e-9,...rows.map(o=>R[o.id].total||0));
  $('c1').innerHTML=rows.map(o=>{
    const r=R[o.id], sbs=subsOf(o);
    const small=o.isSub?`${planName(r.plan)} · ${nf.format(Math.round(r.cr))} / ${nf.format(r.plan.cr)} 크레딧`:`${o.n}곳 결제 · 쓴 만큼`+(sbs.length?' · 일부 대체':'');
    const tip=TYPES.map(([k,n])=>`${n} <b>${won(r[k])}</b>`).join('<br>')+(sbs.length?'<br>대체: '+sbs.map(esc).join(', '):'')+(o.isSub?'<br>구독료를 크레딧 비율로 나눔':'');
    const lab=r.total==null?`<span class="blab d">${S.res}p 미지원</span>`:`<span class="blab">${won(r.total)}${dspan(diff(r.total,bt),o.id===S.base)}</span>`;
    return rowOpen(o,tip)+`<div class="bname">${esc(o.name)}${tags(o)}<small>${esc(small)}</small></div><div class="btrack">${bar(r.total,max,clsOf(o),62)}${lab}</div></div>`;
  }).join('');

  typeChart(same?`유형별 — ${sel.name} 월 비용`:`유형별 — ${sel.name} vs ${base.name} 월 비용`,R[sel.id],R[base.id],
    {main:`${S.main}개 × ${S.len}초 · ${S.res}p`,test:`${S.tests}개 × ${TL}초 · 480p`,prem:`${nf.format(S.prem)}장 · 3개 모델 균등`,cheap:`${nf.format(S.cheap)}장`});
}

function renderBud(){
  const base=O[S.base], sel=O[S.sel], same=sel.id===base.id;
  const R={}; OPT.forEach(o=>R[o.id]=calcBud(o));
  const rs=R[sel.id], rb=R[base.id];
  const bw='₩'+nf.format(S.budget);
  const qty=r=>r.clips==null?`${S.res}p 미지원`:`영상 ${nf.format(r.clips)}개 + 이미지 ${nf.format(r.imgs)}장`;
  const mc=mult(rs.clips,rb.clips), mi=mult(rs.imgs,rb.imgs);
  const head=S.share>0?`영상 ${mtxt(mc)}`:`이미지 ${mtxt(mi)}`;
  $('verdict').innerHTML=`월 ${bw}으로 <em>${esc(sel.name)}</em> <em>${qty(rs)}</em>`+(same?'':` · ${esc(base.name)} ${qty(rb)} → <em>${head}</em>`);
  const kq=r=>r.clips==null?'—':`${nf.format(r.clips)}개 · ${nf.format(r.imgs)}장`;
  const how=(o,r)=>o.isSub?`${planName(r.plan)} · ${won(r.spent)} 결제`+(r.noSeed?' · 영상은 Plus 이상':''):'영상 · 이미지 · 쓴 만큼 결제';
  $('kpis').innerHTML=kpi(sel.name,kq(rs),how(sel,rs),true)+kpi(base.name,kq(rb),how(base,rb))
    +kpi('같은 예산으로',same?'—':mtxt(S.share>0?mc:mi),same?'&nbsp;':`영상 ${mtxt(mc)} · 이미지 ${mtxt(mi)}`);

  $('c1-title').textContent=`전체 — 월 ${bw}으로 만드는 양`;
  $('c1-head').innerHTML=`<div class="colhead"><span></span><div class="two"><span>본편 영상 · ${S.len}초 ${S.res}p</span><span>프리미엄 이미지</span></div></div>`;
  const rows=OPT.slice().sort((a,b)=>((R[b.id].clips??-1)-(R[a.id].clips??-1))||(R[b.id].imgs-R[a.id].imgs));
  const mC=Math.max(1,...rows.map(o=>R[o.id].clips||0)), mI=Math.max(1,...rows.map(o=>R[o.id].imgs||0));
  $('c1').innerHTML=rows.map(o=>{
    const r=R[o.id], sbs=subsOf(o);
    const small=(o.isSub?`${planName(r.plan)} · ${won(r.spent)} 결제`+(r.noSeed?' · 영상은 Plus 이상':''):`${o.n}곳 결제 · 쓴 만큼`)+(o.id===S.base?'':` · 영상 ${mtxt(mult(r.clips,rb.clips))}`);
    const tip=`영상 1개 <b>${won(r.clipUsd)}</b><br>이미지 1장 <b>${won(r.imgUsd)}</b>`+(sbs.length?'<br>대체: '+sbs.map(esc).join(', '):'');
    return rowOpen(o,tip)+`<div class="bname">${esc(o.name)}${tags(o)}<small>${esc(small)}</small></div><div class="two">`
      +`<div class="btrack">${bar(r.clips,mC,clsOf(o),68)}<span class="blab${r.clips==null?' d':''}">${r.clips==null?'미지원':nf.format(r.clips)+'개'}</span></div>`
      +`<div class="btrack">${bar(r.imgs,mI,clsOf(o),68)}<span class="blab">${nf.format(r.imgs)}장</span></div></div></div>`;
  }).join('');

  const pick=r=>({main:r.clipUsd,test:r.testUsd,prem:r.imgUsd,cheap:r.cheapUsd});
  typeChart(same?`유형별 — ${sel.name} 1개당 단가`:`유형별 — 1개당 단가 (${sel.name} vs ${base.name})`,pick(rs),pick(rb),
    {main:`1개 · ${S.len}초 · ${S.res}p`,test:`1개 · ${TL}초 · 480p`,prem:'1장 · 3개 모델 평균',cheap:'1장'});
}

function renderModels(){
  const k=S.model;
  $('chips').innerHTML=Object.keys(MN).map(m=>`<button data-m="${m}" aria-pressed="${m===k}">${MN[m]}</button>`).join('');
  const basis=k==='seedance'?`${S.len}초 · ${S.res}p 1개`:(k==='gpt2'||k==='gpt25')?'1024² 보통 화질 1장':k==='nb21'?'2K 1장':'1장';
  $('c3-title').textContent=`모델별 단가 — ${MN[k]} · ${basis}`;
  const rows=k==='seedance'?Object.keys(VID).map(p=>({p,usd:VID[p][S.res]==null?null:VID[p][S.res]*S.len})):Object.entries(IMG[k]).map(([p,usd])=>({p,usd}));
  const ref=k==='seedance'?'hfapi':OFFICIAL[k], refUsd=(rows.find(r=>r.p===ref)||{}).usd;
  rows.sort((a,b)=>(a.usd??1e9)-(b.usd??1e9));
  const vals=rows.filter(r=>r.usd!=null).map(r=>r.usd), min=Math.min(...vals), max=Math.max(...vals);
  if(k!=='seedance')rows.push({p:'hfapi',usd:null,none:true});
  $('c3-legend').innerHTML=`<span><i class="sw s"></i>최저가</span><span><i class="sw b"></i>힉스필드 API</span><span><i class="sw o"></i>그 외</span><span>% = ${ref==='hfapi'?'힉스필드 API':'공식가'} 대비</span>`;
  $('c3').innerHTML=rows.map(r=>{
    const c=r.usd!=null&&r.usd===min?'s':r.p==='hfapi'?'b':'';
    const nt=[];
    if(OFFICIAL[k]===r.p||(k==='seedance'&&r.p==='byteplus'))nt.push('공식');
    if(k==='cheap'&&VAR[r.p])nt.push(VAR[r.p]);
    if(r.p==='openrouter')nt.push('수수료 포함');
    if(r.p==='kie')nt.push('할인 재판매');
    const lab=r.none?'<span class="blab d">이 모델 없음</span>':r.usd==null?`<span class="blab d">${S.res}p 없음</span>`
      :`<span class="blab">${dol(r.usd)} · ${won(r.usd)}${dspan(diff(r.usd,refUsd),r.p===ref)}</span>`;
    return `<div class="brow"><div class="bname">${PN[r.p]}<small>${nt.join(' · ')||'&nbsp;'}</small></div><div class="btrack">${r.none?'':bar(r.usd,max,c,58)}${lab}</div></div>`;
  }).join('');
}

const tip=$('tip');
function render(){tip.hidden=true;sync();if(S.mode==='use')renderUse();else renderBud();renderModels();save();}

$('todo').innerHTML='<b>할 일</b> ① BytePlus ModelArk 가입 → $30 충전 (Seedance · Seedream) ② fal 충전 (GPT Image · 나노바나나) ③ 캐롯필드 서버에 키 2개 등록';
$('pay').innerHTML=PAY.map(([n,how,sub,memo])=>`<tr><td>${n}</td><td>${how}</td><td><span class="pill ${sub?'sub':'ok'}">${sub?'구독':'아님'}</span></td><td>${memo}</td></tr>`).join('');
$('notes').innerHTML=NOTES.map(t=>`<li>${t}</li>`).join('');
$('src').innerHTML='출처: '+SRC.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`).join(' · ')+' · 힉스필드 API 단가는 캐롯필드 서버 견적으로 실측';

document.querySelectorAll('input[type=range]').forEach(el=>el.addEventListener('input',()=>{S[el.dataset.k]=+el.value;render();}));
document.querySelectorAll('.seg').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=g.dataset.k;S[k]=(k==='tier'||k==='base')?b.dataset.v:+b.dataset.v;render();}));
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{S.mode=b.dataset.mode;render();}));
$('c1').addEventListener('click',e=>{const r=e.target.closest('[data-sel]');if(r){S.sel=r.dataset.sel;render();}});
$('c1').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const r=e.target.closest('[data-sel]');if(r){e.preventDefault();S.sel=r.dataset.sel;render();const n=$('c1').querySelector(`[data-sel="${S.sel}"]`);if(n)n.focus();}});
$('chips').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.model=b.dataset.m;render();}});

const place=(x,y)=>{const w=tip.offsetWidth,h=tip.offsetHeight;let a=x+14,b=y+14;if(a+w>innerWidth-8)a=x-w-14;if(b+h>innerHeight-8)b=y-h-14;tip.style.left=Math.max(8,a)+'px';tip.style.top=Math.max(8,b)+'px';};
document.addEventListener('pointerover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.hidden=true;return;}tip.innerHTML=t.dataset.tip;tip.hidden=false;place(e.clientX,e.clientY);});
document.addEventListener('pointermove',e=>{if(!tip.hidden)place(e.clientX,e.clientY);});
addEventListener('scroll',()=>{tip.hidden=true;},{passive:true});

render();
})();
</script>
