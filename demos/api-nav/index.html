<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>API Nav</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F6F4F1; --surface:#FFFFFF; --sunk:#EFEBE6; --hover:#F6F2ED;
  --ink:#1D1B19; --ink2:#47423D; --muted:#7A736B; --line:#E5E0D9; --line2:#D3CCC3;
  --accent:#E35B12; --accent-soft:#FDEBDF; --accent-ink:#A8410A;
  --c1:#E35B12; --c2:#2D6BB5; --c3:#2F8F6B; --base:#8C857C;
  --ok-bg:#E3F1E8; --ok-ink:#1E6B45; --warn-bg:#FFF3D6; --warn-ink:#8A5A00;
  --sans:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:clamp(26px,3.4vw,34px);line-height:1.15;letter-spacing:-.01em;margin:0 0 10px}
h2{font-size:16px;line-height:1.35;margin:0 0 12px;text-wrap:balance}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.badge{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
.badge.key{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-weight:600}
.verdict{font-size:clamp(17px,2.1vw,21px);font-weight:600;line-height:1.45;margin:0;max-width:68ch;text-wrap:balance}
.verdict em{font-style:normal;color:var(--accent-ink)}
.warn{margin:8px 0 0;font-size:13.5px;color:var(--warn-ink);background:var(--warn-bg);border-radius:8px;padding:6px 10px;display:inline-block}
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;margin-top:22px;align-items:start}
.panel,.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.controls{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));display:grid;gap:14px;max-height:calc(100vh - 24px);overflow:auto}
.results{display:grid;gap:14px;min-width:0}
.results>*{min-width:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--sunk);border-radius:10px;padding:3px}
button{font:inherit;cursor:pointer}
.tabs button{font-size:14px;font-weight:600;padding:8px 6px;border-radius:8px;border:0;background:transparent;color:var(--ink2)}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(40,30,20,.12)}
.grp{display:grid;gap:12px}
.field{display:grid;gap:6px}
.field .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lab,.field label{font-size:14px;font-weight:600}
.val{font-family:var(--mono);font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;margin:0;height:24px;accent-color:var(--accent);cursor:pointer}
.sep{height:1px;background:var(--line)}
.seg{display:flex;gap:4px}
.seg button{flex:1 1 0;min-width:0;font-size:13px;padding:6px 4px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2)}
.seg button[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chips.plat button[aria-pressed=false]{text-decoration:line-through;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.kpi.hl{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.kpi .lab{font-size:13px;color:var(--muted);font-weight:500}
.kpi .num{font-family:var(--mono);font-size:clamp(20px,2.4vw,26px);font-weight:600;letter-spacing:-.02em;line-height:1.25;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:13px;color:var(--ink2);margin-top:2px}
.routes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rc{text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;display:grid;gap:6px;align-content:start;min-width:0;color:var(--ink)}
.rc:hover{background:var(--hover)}
.rc.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#FFFBF8}
.rc .t{font-size:13px;font-weight:600;color:var(--ink2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rc .c{font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.rc .p{font-size:12.5px;color:var(--ink2);line-height:1.4}
.rc .d{font-size:12.5px;color:var(--muted)}
.mbar{height:8px;border-radius:0 4px 4px 0;background:var(--base)}
.rc.on .mbar{background:var(--accent)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:5px;background:var(--sunk);color:var(--ink2);line-height:18px}
.tag.rec{background:var(--accent);color:#fff}
.tag.risk{background:var(--warn-bg);color:var(--warn-ink)}
.stack{display:flex;gap:2px;height:16px;margin:2px 0 8px}
.stack i{display:block;height:100%;min-width:3px}
.stack i:first-child{border-radius:4px 0 0 4px}.stack i:last-child{border-radius:0 4px 4px 0}
.stack i:only-child{border-radius:4px}
.sl{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--ink2);margin-bottom:12px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tbl{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.num-c{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
th.num-c{text-align:right}
.route-t{min-width:640px}
.route-t td:first-child{font-weight:600}
.route-t small,.map small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.plink{font-weight:600;text-decoration:none;border-bottom:1px solid currentColor;white-space:nowrap}
.plink:hover{color:var(--accent-ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.gap{color:var(--muted);font-size:12.5px}
.map{min-width:720px;font-size:12.5px}
.map th a{text-decoration:none;border-bottom:1px dotted currentColor}
.map td,.map th{padding:7px 6px;text-align:right;white-space:nowrap}
.map td:first-child,.map th:first-child{text-align:left;white-space:normal;min-width:150px;position:sticky;left:0;background:var(--surface);z-index:1}
.map td a{text-decoration:none;font-family:var(--mono);font-variant-numeric:tabular-nums;display:inline-block;padding:2px 5px;border-radius:5px}
.map td a:hover{background:var(--sunk)}
.map td.min a{background:var(--ok-bg);color:var(--ok-ink);font-weight:600}
.map td.pick a{box-shadow:inset 0 0 0 2px var(--accent)}
.map td.na{color:var(--line2)}
.flag{font-size:11px;color:var(--accent-ink);font-weight:600}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin:-4px 0 10px;align-items:center}
.lg .b1{display:inline-block;width:22px;height:14px;border-radius:4px;background:var(--ok-bg);vertical-align:-2px;margin-right:6px}
.lg .b2{display:inline-block;width:22px;height:14px;border-radius:4px;box-shadow:inset 0 0 0 2px var(--accent);vertical-align:-2px;margin-right:6px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--ok-bg);color:var(--ok-ink)}
.pay{min-width:640px}
.pay td:first-child{font-weight:600;white-space:nowrap}
.notes ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13.5px;color:var(--ink2)}
.notes .src{margin-top:12px;font-size:13px;color:var(--muted);line-height:1.9}
.notes .src a{color:var(--c2)}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
@media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}.controls{position:static;max-height:none}}
@media (max-width:720px){.routes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.kpis{grid-template-columns:minmax(0,1fr)}.panel,.card{padding:14px}}
</style>
<div class="wrap">
  <header>
    <h1>API Nav</h1>
    <div class="badges">
      <span class="badge key">전부 쓴 만큼 내는 API 단가 · 구독 아님</span>
      <span class="badge" id="b-count"></span>
      <span class="badge">단가 확인 2026-10-15</span>
      <span class="badge">₩1,450 / $1</span>

    <p class="verdict" id="verdict"></p>
    <p class="warn" id="warn" hidden></p>

  <div class="layout">

          <input type="range" id="sl-vid" min="0" max="200" step="1" data-k="vid"></div>
        <div class="field"><div class="row"><label for="sl-img">이미지</label><span class="val" id="v-img"></span></div>
          <input type="range" id="sl-img" min="0" max="1000" step="1" data-k="img"></div>
      </div>
      <div class="grp" id="grp-bud" hidden>
        <div class="field"><div class="row"><label for="sl-budget">월 예산</label><span class="val" id="v-budget"></span></div>
          <input type="range" id="sl-budget" min="10000" max="2000000" step="10000" data-k="budget"></div>
        <div class="field"><div class="row"><label for="sl-share">영상 비중</label><span class="val" id="v-share"></span></div>
          <input type="range" id="sl-share" min="0" max="100" step="5" data-k="share"></div>
      </div>
      <div class="sep"></div>
      <div class="field"><span class="lab">영상 길이</span>
        <div class="seg" data-k="len"><button data-v="5">5초</button><button data-v="8">8초</button><button data-v="10">10초</button><button data-v="15">15초</button></div></div>
      <div class="field"><span class="lab">해상도</span>
        <div class="seg" data-k="res"><button data-v="480">480p</button><button data-v="720">720p</button><button data-v="1080">1080p</button></div></div>
      <div class="sep"></div>
      <div class="field"><span class="lab">영상 모델</span><div class="chips" id="mv"></div></div>
      <div class="field"><span class="lab">이미지 모델</span><div class="chips" id="mi"></div></div>
      <div class="sep"></div>
      <div class="field"><span class="lab">결제처</span><div class="chips plat" id="mp"></div></div>
    </aside>

    <main class="results">
      <section class="kpis" id="kpis" aria-live="polite"></section>
      <section class="card">
        <h2>경로 비교</h2>
        <div class="routes" id="routes"></div>
      </section>
      <section class="card">
        <h2 id="leg-title"></h2>
        <div class="stack" id="stack"></div>
        <div class="sl" id="stack-l"></div>
        <div class="tbl"><table class="route-t">
          <thead><tr><th>모델</th><th>결제처 · 가격 페이지</th><th class="num-c">수량</th><th class="num-c">단가</th><th class="num-c">소계</th><th>최저가와 비교</th></tr></thead>
          <tbody id="legs"></tbody>
        </table></div>
      </section>
      <section class="card">
        <h2 id="map-title">단가 지도</h2>
        <div class="lg"><span><i class="b1"></i>모델별 최저가</span><span><i class="b2"></i>선택한 경로에서 사는 곳</span></div>
        <div class="tbl"><table class="map" id="map"></table></div>
      </section>
      <section class="card">
        <h2>결제 방식</h2>
        <div class="tbl"><table class="pay">
          <thead><tr><th>결제처</th><th>유형</th><th>방식</th><th>구독</th><th>알아둘 점</th></tr></thead>
          <tbody id="pay"></tbody>
        </table></div>
      </section>
      <section class="card notes">
        <h2>계산 기준</h2>
        <ul id="notes"></ul>
        <div class="src" id="src"></div>
      </section>
    </main>
  </div>
</div>

  $('grp-use').hidden=S.mode!=='use';$('grp-bud').hidden=S.mode!=='bud';
  const chip=(m,on)=>`<button data-id="${m.id}" aria-pressed="${on}">${esc(m.n)}</button>`;
  $('mv').innerHTML=MODELS.filter(m=>m.k==='v').map(m=>chip(m,S.mv.includes(m.id))).join('');
  $('mi').innerHTML=MODELS.filter(m=>m.k==='i').map(m=>chip(m,S.mi.includes(m.id))).join('');
  $('mp').innerHTML=PL.map(p=>`<button data-p="${p}" aria-pressed="${!S.off.includes(p)}">${esc(PLAT[p].n)}</button>`).join('');
}

const kpi=(lab,num,sub,hl)=>`<div class="kpi${hl?' hl':''}"><div class="lab">${esc(lab)}</div><div class="num">${num}</div><div class="sub">${sub}</div></div>`;
const names=rt=>rt.used.map(p=>PLAT[p].n).join(' + ');

function render(){
  sync();
  const C=compute(),U=S.mode==='use';
  $('warn').hidden=!C.missing.length;
  if(C.missing.length)$('warn').textContent='꺼둔 결제처 때문에 계산에서 빠진 모델: '+C.missing.map(id=>MD[id].n).join(', ');
  if(!C.need.length||!C.rec){$('verdict').textContent='모델을 하나 이상 고르면 최저가 경로가 나옵니다.';['kpis','routes','legs','stack','stack-l','map'].forEach(id=>$(id).innerHTML='');$('leg-title').textContent='';save();return;}
  const rec=C.R[C.rec],hf=C.hf;
  let key=S.route==='rec'?C.rec:S.route;let sel=routeOf(C,key);if(!sel){key=C.rec;sel=rec;}
  if(U){
    const d=hf?pct(rec.cost,hf.cost):null;
    $('verdict').innerHTML=`추천 경로 <em>${esc(names(rec))}</em> ${rec.used.length}곳 · 월 <em>${won(rec.cost)}</em>`+(hf&&rec.cost!==hf.cost?` — 힉스필드 유지(${won(hf.cost)})보다 <em>${dtxt(d)}</em>`:'');
    $('kpis').innerHTML=kpi('추천 경로 · 월',won(rec.cost),`${dol(rec.cost)} · 결제처 ${rec.used.length}곳`,true)
      +kpi('힉스필드 유지 시 · 월',hf?won(hf.cost):'—',hf?`${dol(hf.cost)} · 힉스필드 + 부족분 최저가`:'선택 모델이 힉스필드에 없음')
      +kpi('한 달 차이',hf?won(Math.abs(hf.cost-rec.cost)):'—',hf?dtxt(d):'&nbsp;');
  }else{
    const P=C.prod(rec),H=C.prod(hf);
    $('verdict').innerHTML=`월 ₩${nf.format(S.budget)}으로 <em>${esc(names(rec))}</em>: <em>영상 ${nf.format(P.vids)}개 + 이미지 ${nf.format(P.imgs)}장</em>`+(H?` · 힉스필드 유지는 영상 ${nf.format(H.vids)}개 + 이미지 ${nf.format(H.imgs)}장`:'');
    const x=(a,b)=>!b?(a?'—':'—'):(Math.round(a/b*10)/10).toFixed(1)+'배';
    $('kpis').innerHTML=kpi('추천 경로로',`${nf.format(P.vids)}개 · ${nf.format(P.imgs)}장`,`영상 · 이미지 · 모델당 ${nf.format(P.sv)} · ${nf.format(P.si)}`,true)
      +kpi('힉스필드 유지 시',H?`${nf.format(H.vids)}개 · ${nf.format(H.imgs)}장`:'—',H?'영상 · 이미지':'선택 모델이 힉스필드에 없음')
      +kpi('같은 예산 생산량',H?(S.share>0?x(P.vids,H.vids):x(P.imgs,H.imgs)):'—',H?`영상 ${x(P.vids,H.vids)} · 이미지 ${x(P.imgs,H.imgs)}`:'&nbsp;');
  }
  // route cards
  const keys=[1,2,3,'hf'],T={1:'1곳',2:'최대 2곳',3:'최대 3곳',hf:'힉스필드 유지'};
  const val=rt=>U?rt.cost:(()=>{const p=C.prod(rt);return S.share>0?p.vids:p.imgs;})();
  const vals=keys.map(k=>routeOf(C,k)).filter(Boolean).map(val);const vmax=Math.max(1e-9,...vals);
  $('routes').innerHTML=keys.map(k=>{
    const rt=routeOf(C,k);const isRec=k===C.rec;
    if(!rt)return `<button class="rc" disabled><div class="t">${T[k]}</div><div class="c">—</div><div class="p">${k==='hf'?'선택 모델이 힉스필드에 없음':'이 곳 수로는 선택 모델을 다 못 삼'}</div></button>`;
    const same=(k===2&&C.R[1]&&rt.used.length===1)||(k===3&&C.R[2]&&rt.used.length<=2&&String(rt.used)===String(C.R[2].used));
    const v=val(rt);let d;
    if(U)d=isRec?'':(rec.cost?((rt.cost>=rec.cost?'+':'')+Math.round(pct(rt.cost,rec.cost))+'% (추천 대비)'):'');
    else{const p=C.prod(rt),q=C.prod(rec);d=`영상 ${nf.format(p.vids)} · 이미지 ${nf.format(p.imgs)}`;}
    const main=U?won(rt.cost):`${nf.format(C.prod(rt).vids)}개 · ${nf.format(C.prod(rt).imgs)}장`;
    return `<button class="rc${String(k)===String(key)?' on':''}" data-r="${k}"><div class="t">${T[k]}${isRec?'<span class="tag rec">추천</span>':''}${rt.used.includes('kie')?'<span class="tag risk">재판매 포함</span>':''}</div>`
      +`<div class="c">${main}</div><div class="mbar" style="width:${Math.max(3,v/vmax*100)}%"></div>`
      +`<div class="p">${esc(names(rt))}</div><div class="d">${same?(k===2?'1곳으로 충분':'2곳으로 충분'):esc(d)}</div></button>`;
  }).join('');
  // route detail
  const P=U?null:C.prod(sel);
  const nOf=r=>U?r.n:(MD[r.mid].k==='v'?P.sv:P.si);
  const rows=C.need.map(r=>{const p=sel.asg[r.mid],u=unitOf(r.mid,p),n=nOf(r);let mp=null,mu=Infinity;C.pool.forEach(q=>{const x=unitOf(r.mid,q);if(x!=null&&x<mu){mu=x;mp=q;}});return {r,p,u,n,sub:n*u,mp,mu};});
  const tot=rows.reduce((s,x)=>s+x.sub,0);
  const pidx=Object.fromEntries(sel.used.map((p,i)=>[p,i]));
  rows.sort((a,b)=>(pidx[a.p]-pidx[b.p])||(MODELS.indexOf(MD[a.r.mid])-MODELS.indexOf(MD[b.r.mid])));
  $('leg-title').textContent=`${String(key)===String(C.rec)?'추천 경로':T[key]+' 경로'} — ${names(sel)}`+(U?` · 월 ${won(tot)}`:` · ₩${nf.format(Math.round(tot*FX))} 사용`);
  const byP={};rows.forEach(x=>{byP[x.p]=(byP[x.p]||0)+x.sub;});
  $('stack').innerHTML=sel.used.map((p,i)=>`<i style="width:${tot?byP[p]/tot*100:0}%;background:${COL[Math.min(i,3)]}"></i>`).join('');
  $('stack-l').innerHTML=sel.used.map((p,i)=>`<span><i class="sw" style="background:${COL[Math.min(i,3)]}"></i>${esc(PLAT[p].n)} ${won(byP[p])} · ${tot?Math.round(byP[p]/tot*100):0}%</span>`).join('');
  $('legs').innerHTML=rows.map(x=>{
    const m=MD[x.r.mid],o=PO[m.id][x.p],rr=m.k==='v'?resFor(m):null;
    const basis=[m.b,rr&&rr!==S.res?`${rr}p로 계산`:''].filter(Boolean).join(' · ');
    const gp=x.mp?pct(x.u,x.mu):0;const gap=gp>1?`<span class="gap">최저 ${esc(PLAT[x.mp].n)} ${won(x.mu)} · 이 경로 +${Math.round(gp)}%</span>`:`<span class="pill">${gp>0.1?'최저가 수준':'최저가'}</span>`;
    const unitTxt=m.k==='v'?`${won(x.u)}<small>${dol(x.u/S.len)}/초</small>`:`${won(x.u)}<small>${dol(x.u)}</small>`;
    return `<tr><td>${esc(m.n)}${basis?`<small>${esc(basis)}</small>`:''}</td>`
      +`<td><i class="dot" style="background:${COL[Math.min(pidx[x.p],3)]}"></i><a class="plink" href="${esc(urlOf(m.id,x.p))}" target="_blank" rel="noopener">${esc(PLAT[x.p].n)} ↗</a><small>${esc([PLAT[x.p].kind,o.note].filter(Boolean).join(' · '))}</small></td>`
      +`<td class="num-c">${nf.format(Math.round(x.n*10)/10)}${m.k==='v'?'개':'장'}</td><td class="num-c">${unitTxt}</td><td class="num-c">${won(x.sub)}</td><td>${gap}</td></tr>`;
  }).join('')+`<tr><td colspan="4" style="font-weight:600">합계</td><td class="num-c" style="font-weight:600">${won(tot)}</td><td></td></tr>`;
  // price map
  const cols=C.pool.filter(p=>C.need.some(r=>r.pr[p]!=null)).sort((a,b)=>(C.need.filter(r=>r.pr[b]!=null).length-C.need.filter(r=>r.pr[a]!=null).length)||(PLAT[b].t-PLAT[a].t));
  $('map-title').textContent=`단가 지도 — 영상 ${S.len}초 ${S.res}p 1개 · 이미지 1장`;
  $('map').innerHTML=`<thead><tr><th>모델</th>${cols.map(p=>`<th><a href="${esc(PLAT[p].url)}" target="_blank" rel="noopener">${esc(PLAT[p].n)}</a></th>`).join('')}</tr></thead><tbody>`
    +C.need.map(r=>{const m=MD[r.mid],rr=m.k==='v'?resFor(m):null;const mn=Math.min(...Object.values(r.pr));
      return `<tr><td>${esc(m.n)}${rr&&rr!==S.res?` <span class="flag">${rr}p</span>`:''}<small>${esc(m.b||'')}</small></td>`+cols.map(p=>{const u=r.pr[p];if(u==null)return '<td class="na">·</td>';
        const c=[u<=mn*1.001?'min':'',sel.asg[r.mid]===p?'pick':''].filter(Boolean).join(' ');
        return `<td class="${c}"><a href="${esc(urlOf(r.mid,p))}" target="_blank" rel="noopener">${won(u)}</a></td>`;}).join('')+'</tr>';}).join('')+'</tbody>';
  save();
}

$('b-count').textContent=`결제처 ${PL.length}곳 · 모델 ${MODELS.length}개`;
$('pay').innerHTML=PL.map(p=>{const x=PLAT[p];return `<tr><td><a class="plink" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.n)} ↗</a></td><td>${p==='kie'?`<span class="tag risk">${x.kind}</span>`:esc(x.kind)}</td><td>${esc(x.bill)}</td><td><span class="pill">아님</span></td><td>${esc(x.note||'')}</td></tr>`;}).join('');
const NOTES=['단가는 모두 각 결제처의 API 가격(쓴 만큼 결제) 기준. 결제처 이름과 단가 링크가 해당 모델의 가격 페이지로 연결됨',
 '선택한 모델끼리 같은 개수로 생성(예: 이미지 60장 · 모델 4개 → 각 15장). 예산 모드는 같은 개수 묶음을 예산 안에서 최대로',
 '경로 = 결제처 1~3곳 조합 중 총액이 가장 낮은 것. 모델마다 그 조합 안에서 가장 싼 곳에 배정',
 '추천 규칙: 1곳이 최저 경로보다 3% 이내, 2곳이 5% 이내로 비싸면 결제처가 적은 쪽을 추천. 가격 차가 1% 안팎이면 공식·대형 결제처 우선',
 '영상 = 초당 단가 × 길이, 오디오 포함 기준. 해당 해상도가 없는 모델은 가장 가까운 해상도로 계산(표에 표시)',
 '토큰 과금 모델(Seedance·Nano Banana 일부)은 공식 토큰 수로 장·초당 금액 환산. OpenRouter는 충전 수수료 5.5% 포함',
 'Kie.ai는 할인 재판매라 가장 싼 대신 정책 변동 위험이 있음 — 결제처에서 끄면 제외하고 다시 계산',
 '힉스필드 API 단가는 캐롯필드 서버의 견적 API로 실측(공개 모델별 가격표가 없어 크레딧 페이지로 연결)',
 '힉스필드 유지 = 힉스필드에 있는 모델은 힉스필드로, 없는 모델만 다른 결제처 최대 2곳에서 최저가로 보충',
 '가격은 수시로 바뀜 — 결제 전 링크에서 한 번 더 확인'];
$('notes').innerHTML=NOTES.map(t=>`<li>${esc(t)}</li>`).join('');
$('src').innerHTML='가격표: '+PL.map(p=>`<a href="${esc(PLAT[p].url)}" target="_blank" rel="noopener">${esc(PLAT[p].n)}</a>`).join(' · ');

document.querySelectorAll('input[type=range]').forEach(el=>el.addEventListener('input',()=>{S[el.dataset.k]=+el.value;render();}));
document.querySelectorAll('.seg').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S[g.dataset.k]=+b.dataset.v;render();}));
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{S.mode=b.dataset.mode;render();}));
const tog=(arr,id)=>arr.includes(id)?arr.filter(x=>x!==id):[...arr,id];
$('mv').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.mv=tog(S.mv,b.dataset.id);S.route='rec';render();});
$('mi').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.mi=tog(S.mi,b.dataset.id);S.route='rec';render();});
$('mp').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.off=tog(S.off,b.dataset.p);S.route='rec';render();});
$('routes').addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;const k=b.dataset.r;S.route=k==='hf'?'hf':+k;render();});
render();
})();
</script>

</body></html>
