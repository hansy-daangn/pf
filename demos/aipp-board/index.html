<title>aipp 검토 보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style id="boardcss">
:root{--paper:#faf9f7;--card:#ffffff;--ink:#211d1a;--sub:#6f675f;--line:#e6e0d8;--accent:#e8630a;--accent-ink:#ffffff;--good:#2e7d4f;--hold:#a87a10;--bad:#c03a2b;--chip:#f1ece5}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#18161a;--card:#221f24;--ink:#ece8e3;--sub:#9d958c;--line:#3a353c;--accent:#ff8a3d;--accent-ink:#231303;--good:#5cb884;--hold:#d9a83c;--bad:#e06552;--chip:#2c282e}}
:root[data-theme="dark"]{--paper:#18161a;--card:#221f24;--ink:#ece8e3;--sub:#9d958c;--line:#3a353c;--accent:#ff8a3d;--accent-ink:#231303;--good:#5cb884;--hold:#d9a83c;--bad:#e06552;--chip:#2c282e}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans KR',Pretendard,'Apple SD Gothic Neo',sans-serif;line-height:1.5}
header.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header.bar h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
header.bar h1 b{color:var(--accent)}
.savechip{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--sub)}
.savechip .dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.savechip.dirty .dot{background:var(--hold)}
.savechip button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--chip);color:var(--sub);border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer}
.filters button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
main{max-width:1500px;margin:0 auto;padding:18px 20px 80px}
.notice{font-size:13px;color:var(--sub);margin:6px 0 14px}
details.round{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:0 0 16px;overflow:hidden}
details.round>summary{cursor:pointer;padding:13px 18px;font-weight:700;font-size:15px;list-style:none;display:flex;gap:10px;align-items:center}
details.round>summary::before{content:"▸";color:var(--accent);transition:transform .15s}
details[open].round>summary::before{transform:rotate(90deg)}
summary .cnt{font-weight:500;color:var(--sub);font-size:12.5px;margin-left:auto;font-variant-numeric:tabular-nums}
details.wave{border-top:1px solid var(--line)}
details.wave>summary{cursor:pointer;padding:10px 18px;font-size:13.5px;font-weight:600;color:var(--sub);list-style:none}
details.wave>summary::before{content:"▹ ";color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:14px 18px 20px}
.item{border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden;display:flex;flex-direction:column}
.item.v-O{border-color:var(--good)}
.item.v-T{border-color:var(--hold)}
.item.v-X{border-color:var(--bad)}
.item a.imgw{display:block;aspect-ratio:3/4;background:var(--chip)}
.item img{width:100%;height:100%;object-fit:cover;display:block}
.meta{padding:9px 11px;display:flex;flex-direction:column;gap:7px}
.code{font-weight:700;font-size:13.5px}
.label{font-size:12px;color:var(--sub)}
.claude{font-size:12px;color:var(--sub)}
.claude b{color:var(--ink);font-weight:600}
.verdict{display:flex;gap:6px}
.verdict button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:8px;padding:7px 0;font-size:13px;cursor:pointer;font-weight:600}
.verdict button.on-O{background:var(--good);border-color:var(--good);color:#fff}
.verdict button.on-T{background:var(--hold);border-color:var(--hold);color:#fff}
.verdict button.on-X{background:var(--bad);border-color:var(--bad);color:#fff}
.note{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 9px;font-size:12.5px;width:100%;font-family:inherit}
.note::placeholder{color:var(--sub)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<script>/* self-host guard: outside the Claude artifact runtime there is no `claude` namespace -> read-only board */window.claude=window.claude||{use:function(){return Promise.resolve(null)}};</script>
<script>const SRC=document.currentScript.textContent;
const CSS=document.getElementById('boardcss').textContent;
let state=JSON.parse(document.getElementById('state').textContent);
let dirty=0, timer=null, artifactNS=null, filter='all', saving=false, touched={};
const SSKEY='aipp-board-pending-v2';
const app=document.getElementById('app');
let nsPending=true;
claude.use('artifact').then(ns=>{artifactNS=ns;nsPending=false; if(!ns){setChip('읽기 전용 — 저장 불가');}});
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function forEachItem(fn){for(const r of state.rounds)for(const w of r.waves)for(const i of w.items)fn(i)}
function find(code){let f=null;forEachItem(i=>{if(i.code===code)f=i});return f}
/* ── 클릭 유실 방지 ──
   publish 성공/충돌 시 뷰가 새 버전으로 자동 리로드됨.
   리로드 직전까지의 클릭이 발행본에 빠질 수 있으므로,
   이 탭에서 만진 항목을 sessionStorage에 즉시 스냅샷하고
   리로드 후 발행본과 대조해 다른 값만 복원 → 자동 재저장한다. */
function stashWrite(){try{
  const m={};
  forEachItem(it=>{if(touched[it.code])m[it.code]={v:it.hansy.v,note:it.hansy.note||''}});
  if(Object.keys(m).length)sessionStorage.setItem(SSKEY,JSON.stringify(m));
}catch(e){}}
function stashRecover(){
  let m=null; try{m=JSON.parse(sessionStorage.getItem(SSKEY))}catch(e){}
  if(!m)return 0;
  let diff=0;
  forEachItem(it=>{const p=m[it.code];if(!p)return;
    touched[it.code]=1;
    if(p.v!==it.hansy.v||(p.note||'')!==(it.hansy.note||'')){it.hansy.v=p.v;it.hansy.note=p.note;diff++;}
  });
  if(!diff){touched={};try{sessionStorage.removeItem(SSKEY)}catch(e){}}
  return diff;
}
function counts(items){let o=0,t=0,x=0,n=0;items.forEach(i=>{const v=i.hansy.v;if(v==='O')o++;else if(v==='T')t++;else if(v==='X')x++;else n++;});return {o,t,x,n}}
function show(i){if(filter==='all')return true;if(filter==='none')return !i.hansy.v;return i.hansy.v===filter}
function chipHtml(){return '<div class="savechip'+(dirty?' dirty':'')+'" id="chip"><span class="dot"></span><span id="chiptxt">'+(dirty?('변경 '+dirty+'건 — 3초 후 자동 저장'):'저장됨')+'</span><button id="savenow">지금 저장</button></div>'}
function filtersHtml(){
  const total=[];forEachItem(i=>total.push(i));const c=counts(total);
  return [['all','전체'],['none','미판정 '+c.n],['O','합격 '+c.o],['T','보류 '+c.t],['X','폐기 '+c.x]].map(f=>'<button data-f="'+f[0]+'" class="'+(filter===f[0]?'on':'')+'">'+f[1]+'</button>').join('');
}
function updateCounts(){
  const fl=document.querySelector('.filters'); if(fl)fl.innerHTML=filtersHtml();
  if(fl)fl.querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
  document.querySelectorAll('details.round').forEach(d=>{
    const r=state.rounds.find(r=>r.id===d.dataset.rid); if(!r)return;
    const rc=counts([].concat(...r.waves.map(w=>w.items)));
    const cnt=d.querySelector(':scope>summary .cnt');
    if(cnt)cnt.textContent='합격 '+rc.o+' · 보류 '+rc.t+' · 폐기 '+rc.x+' · 미판정 '+rc.n;
  });
}
function render(){
  let h='<header class="bar"><h1><b>aipp</b> 검토 보드</h1>'+
    '<div class="filters">'+filtersHtml()+'</div>'+chipHtml()+'</header>';
  h+='<main><p class="notice">이미지 클릭 = 원본 크게 보기 · 판정 클릭·코멘트만 하면 자동 저장(이 페이지 자체에 영구 기록). "저장 중"에 계속 클릭해도 전부 보존됨 — 화면이 잠깐 새로고침돼도 이 기기의 클릭은 자동 복원·재저장. GitHub 레포에는 Claude가 다음 라운드 시작 때 읽어서 반영. 같은 버튼 다시 누르면 판정 해제.</p>';
  for(const r of state.rounds){
    const rc=counts([].concat(...r.waves.map(w=>w.items)));
    h+='<details class="round" data-rid="'+esc(r.id)+'"'+(r.open?' open':'')+'><summary>'+esc(r.title)+'<span class="cnt">합격 '+rc.o+' · 보류 '+rc.t+' · 폐기 '+rc.x+' · 미판정 '+rc.n+'</span></summary>';
    for(const w of r.waves){
      const vis=w.items.filter(show); if(!vis.length&&filter!=='all'){continue}
      h+='<details class="wave" open><summary>'+esc(w.t)+'</summary><div class="grid">';
      for(const it of w.items){ if(!show(it))continue;
        const v=it.hansy.v;
        h+='<div class="item v-'+(v||'')+'" data-code="'+esc(it.code)+'">'+
          '<a class="imgw" href="'+esc(it.full)+'" target="_blank" rel="noopener"><img loading="lazy" src="'+esc(it.img)+'" alt="'+esc(it.code)+'"></a>'+
          '<div class="meta"><div class="code">'+esc(it.code)+'</div>'+(it.label?'<div class="label">'+esc(it.label)+'</div>':'')+
          '<div class="claude">Claude 제안: <b>'+esc(it.claude)+'</b></div>'+
          '<div class="verdict">'+
            '<button data-v="O" class="'+(v==='O'?'on-O':'')+'">⭕ 합격</button>'+
            '<button data-v="T" class="'+(v==='T'?'on-T':'')+'">△ 보류</button>'+
            '<button data-v="X" class="'+(v==='X'?'on-X':'')+'">❌ 폐기</button></div>'+
          '<input class="note" placeholder="코멘트 (선택)" value="'+esc(it.hansy.note)+'"></div></div>';
      }
      h+='</div></details>';
    }
    h+='</details>';
  }
  h+='</main>';
  app.innerHTML=h;
  wire();
}
function wire(){
  document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
  const sn=document.getElementById('savenow'); if(sn)sn.onclick=()=>save(true);
  app.querySelectorAll('.item').forEach(el=>{
    const it=find(el.dataset.code); if(!it)return;
    el.querySelectorAll('.verdict button').forEach(b=>b.onclick=()=>{
      it.hansy.v=(it.hansy.v===b.dataset.v)?null:b.dataset.v;
      el.className='item v-'+(it.hansy.v||'');
      el.querySelectorAll('.verdict button').forEach(bb=>{bb.className=(it.hansy.v===bb.dataset.v)?('on-'+bb.dataset.v):''});
      markDirty(it); updateCounts();
    });
    const note=el.querySelector('.note');
    note.oninput=()=>{it.hansy.note=note.value;touched[it.code]=1;stashWrite();};
    note.onchange=()=>{markDirty(it);};
  });
}
function setChip(t){const el=document.getElementById('chiptxt');if(el)el.textContent=t}
function markDirty(it){
  dirty++; if(it)touched[it.code]=1; stashWrite();
  const chip=document.getElementById('chip'); if(chip)chip.classList.add('dirty');
  setChip('변경 '+dirty+'건 — 3초 후 자동 저장');
  clearTimeout(timer); timer=setTimeout(()=>save(false),3000);
}
function buildDoc(){
  state.updated=new Date().toISOString().slice(0,10);
  const json=JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!doctype html>\n<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>aipp 검토 보드</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap"><style id="boardcss">'+CSS+'</style></head><body><div id="app"></div><script type="application/json" id="state">'+json+'\u003c/script>\u003cscript>'+SRC+'\u003c/script></body></html>';
}
async function save(manual){
  clearTimeout(timer);
  if(!artifactNS){ if(nsPending){setChip('저장 준비 중…');timer=setTimeout(()=>save(manual),1500);return} setChip('읽기 전용 — 저장 불가');return}
  if(saving)return;
  if(!dirty&&!manual)return;
  saving=true; stashWrite();
  setChip('저장 중… (계속 클릭해도 전부 보존됨)');
  try{ await artifactNS.publish(buildDoc()); /* 성공 시 뷰 자동 리로드 → 스태시 복원 경로가 마무리 */ }
  catch(e){ saving=false;
    if(e&&e.code==='conflict'){setChip('다른 저장이 먼저 반영 — 새로고침 후 이 기기 클릭 자동 복원')}
    else if(e&&e.code==='rate_limited'){setChip('저장 잦음 — 8초 후 자동 재시도');timer=setTimeout(()=>save(false),8000)}
    else if(e&&(e.code==='not_writer'||e.code==='not_granted'||e.code==='not_declared')){artifactNS=null;setChip('읽기 전용 — 저장 불가')}
    else{setChip('저장 실패 — 6초 후 자동 재시도');timer=setTimeout(()=>save(false),6000)}
  }
}
const recovered=stashRecover();
render();
if(recovered){
  dirty=recovered;
  const chip=document.getElementById('chip'); if(chip)chip.classList.add('dirty');
  setChip('미저장 클릭 '+recovered+'건 복원됨 — 3초 후 자동 저장');
  clearTimeout(timer); timer=setTimeout(()=>save(false),3000);
}
</script>
