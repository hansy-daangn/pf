<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>인터뷰 구도 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script>
<script src="./vendor/jszip.min.js"></script>
<style>
:root{
  /* 모니터 중심 + 좁은 인스펙터 + 필름스트립. 라이트 UI 고정 */
  --bg:#eceef1; --panel:#ffffff; --soft:#f4f5f7; --line:#dde1e6; --line2:#c9ced6; --ink:#171a1f; --mute:#69717d;
  --accent:#ff6f0f; --accent-soft:#fff1e8; --ok:#1f9d55; --warn:#d98a06; --bad:#dc2626; --matte:#0b0c0f; --edit-bg:#e4e7eb;
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --side:292px; --strip:150px; --top:46px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;line-height:1.2}
button:hover{border-color:var(--line2);background:var(--soft)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--soft)}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
button.icon{width:32px;height:32px;padding:0;display:inline-grid;place-items:center}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:2px;gap:2px}
.seg button{border:0;border-radius:7px;padding:5px 10px;background:transparent;color:var(--mute);font-weight:500}
.seg button.on{background:var(--ink);color:#fff}
.seg.accent button.on{background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--mute)}
.chip.on{border-color:var(--ink);color:var(--ink);background:var(--soft);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line2);vertical-align:middle}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--side);grid-template-rows:var(--top) minmax(0,1fr) var(--strip);transition:grid-template-columns .2s,grid-template-rows .2s}
#app.noside{--side:0px} #app.nostrip{--strip:0px}
#app.clean{grid-template-columns:1fr;grid-template-rows:1fr}
#app.clean #top,#app.clean #side,#app.clean #shots,#app.clean #toolbar,#app.clean #hud,#app.clean #pip,#app.clean #joy,#app.clean #editbar,#app.clean #warn{display:none!important}

#top{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0;overflow-x:auto;overflow-y:hidden;white-space:nowrap}
#top::-webkit-scrollbar{display:none}
#top .brand{font-weight:600;white-space:nowrap}
#stores{display:flex;gap:2px;border-left:1px solid var(--line);padding-left:8px}
#stores button{border:0;background:transparent;padding:6px 10px;border-radius:7px;color:var(--mute);font-weight:500}
#stores button.on{color:var(--ink);background:var(--soft);font-weight:600}
#top .sp{flex:1}
#top .grp{display:flex;align-items:center;gap:6px}

#stage{position:relative;background:var(--matte);overflow:hidden;min-width:0;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none}
#stage.edit{background:var(--edit-bg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#frame{position:absolute;pointer-events:none;overflow:hidden}
#frame .grid{position:absolute;inset:0;display:none;background-image:linear-gradient(to right,rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.5) 1px,transparent 1px);background-size:33.3333% 33.3333%;background-position:-1px -1px;mix-blend-mode:difference}
#frame .cross{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);display:none;mix-blend-mode:difference}
#frame .cross:before,#frame .cross:after{content:"";position:absolute;background:rgba(255,255,255,.85)}
#frame .cross:before{left:50%;top:0;width:1px;height:100%} #frame .cross:after{top:50%;left:0;height:1px;width:100%}
#frame .vcrop{position:absolute;top:0;bottom:0;display:none;border-left:1px dashed rgba(255,255,255,.75);border-right:1px dashed rgba(255,255,255,.75);box-shadow:0 0 0 2000px rgba(0,0,0,.28);pointer-events:none}
#frame .vcrop:after{content:"9:16";position:absolute;right:6px;top:6px;color:#fff;font:500 11px var(--mono);opacity:.8}
#frame.grid .grid,#frame.cross .cross{display:block}
#frame img.match{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.5;display:none}
#frame.match img.match{display:block}
#hud{position:absolute;left:12px;top:10px;display:flex;gap:6px;pointer-events:none;max-width:80%}
#hud .h{background:rgba(12,13,16,.7);color:#fff;border-radius:7px;padding:4px 9px;font-family:var(--mono);font-size:12px;backdrop-filter:blur(6px);white-space:nowrap}
#hud .h.warnc{background:rgba(217,38,38,.85)}
#stage.edit #hud .h{background:rgba(255,255,255,.85);color:var(--ink);border:1px solid var(--line)}
#warn{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--bad);color:#fff;border-radius:999px;padding:4px 12px;font-weight:600;display:none;pointer-events:none}
#warn.on{display:block}
#toolbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:12px;padding:5px;backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:calc(100% - 24px);flex-wrap:wrap;justify-content:center}
#editbar{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:12px;padding:5px}
#pip{position:absolute;right:14px;bottom:14px;border:2px solid rgba(255,255,255,.9);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.35);cursor:pointer;overflow:hidden}
#pip .tag{position:absolute;left:6px;top:6px;background:rgba(12,13,16,.7);color:#fff;font-size:11px;padding:2px 7px;border-radius:6px;font-family:var(--mono)}
#pip:hover{border-color:var(--accent)}
#joy{position:absolute;left:16px;bottom:84px;display:none;gap:10px;align-items:flex-end}
#joy .pad{width:104px;height:104px;border-radius:50%;background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.5);position:relative}
#joy .knob{position:absolute;left:50%;top:50%;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.9);transform:translate(-50%,-50%)}
#joy .ud{display:flex;flex-direction:column;gap:6px}
#joy .ud button{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.9);font-size:17px}
@media (pointer:coarse){#joy{display:flex}}

#side{background:var(--panel);border-left:1px solid var(--line);overflow:hidden auto;min-width:0;display:flex;flex-direction:column;padding:4px 12px 16px}
#app.noside #side{border:0}
.sec{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.sec:last-of-type{border-bottom:0}
.sec h4{margin:0;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.02em}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.scrub{user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--soft);cursor:ew-resize;touch-action:none;min-width:0}
.scrub .l{color:var(--mute);font-size:12px;white-space:nowrap} .scrub .v{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.scrub input{width:60px;border:0;background:transparent;font-family:var(--mono);text-align:right;padding:0}
.sw{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.sw input{appearance:none;width:30px;height:18px;border-radius:999px;background:var(--line2);position:relative;margin:0;cursor:pointer;transition:background .15s}
.sw input:checked{background:var(--accent)}
.sw input:before{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.sw input:checked:before{left:14px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos .ph{position:relative;border-radius:7px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1;cursor:pointer;background:var(--soft)}
.photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photos .ph .n{position:absolute;left:4px;top:4px;background:rgba(12,13,16,.7);color:#fff;font-size:10px;padding:1px 5px;border-radius:5px;font-family:var(--mono)}
.photos .ph .st{position:absolute;right:4px;bottom:4px;width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.2)}
.photos .ph .st.on{background:var(--ok)}
.photos .ph.sel{outline:2px solid var(--accent);outline-offset:-1px}
.note{color:var(--mute);font-size:12px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:10px;color:var(--mute);font-size:12px}

#shots{grid-column:1/-1;background:var(--panel);border-top:1px solid var(--line);display:flex;min-width:0;min-height:0;overflow:hidden}
#shots .hd{width:104px;flex:none;border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;justify-content:space-between}
#shots .hd b{font-size:12px} #shots .hd .c{font-family:var(--mono);color:var(--mute);font-size:12px}
#cards{flex:1;display:flex;gap:10px;padding:10px;overflow:auto hidden;align-items:stretch;min-width:0}
.card{position:relative;flex:none;width:196px;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;flex-direction:column;overflow:hidden;cursor:pointer}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.1)} .card.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)} .card.drag{opacity:.4} .card.over{transform:translateX(6px)}
.card .th{position:relative;background:#111;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden}
.card .th img{width:100%;height:100%;object-fit:contain;display:block}
.card .th .num{position:absolute;left:6px;top:6px;background:rgba(12,13,16,.75);color:#fff;font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:5px}
.card .th .cam{position:absolute;right:6px;top:6px;background:var(--accent);color:#fff;font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:5px} .card .th .cam.B{background:#3b6fd6}
.card .th .star{position:absolute;right:6px;bottom:6px;border:0;background:rgba(12,13,16,.6);color:#fff;border-radius:6px;padding:2px 6px;font-size:12px} .card .th .star.on{background:var(--accent)}
.card .bd{padding:6px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .bd .lb{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .bd .mt{font-family:var(--mono);font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .menu{position:absolute;right:4px;bottom:4px;width:26px;height:26px;padding:0;border:0;background:transparent;color:var(--mute);border-radius:6px}
#cmenu{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);display:none;flex-direction:column;z-index:70;min-width:160px;padding:4px}
#cmenu.on{display:flex} #cmenu button{border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:6px} #cmenu button:hover{background:var(--soft)} #cmenu button.danger{color:var(--bad)}
.empty{color:var(--mute);align-self:center;padding:0 10px}

#toast{position:fixed;left:50%;bottom:calc(var(--strip) + 22px);transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:50;pointer-events:none}
#toast .t{background:var(--ink);color:#fff;border-radius:10px;padding:8px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;pointer-events:auto;animation:up .18s ease-out}
#toast .t button{border:0;background:rgba(255,255,255,.14);color:#fff;padding:3px 8px;border-radius:6px}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#modal{position:fixed;inset:0;background:rgba(10,12,16,.45);display:none;place-items:center;z-index:60;padding:16px}
#modal.on{display:grid}
#modal .box{background:var(--panel);border-radius:14px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column}
#modal .box.wide{width:min(960px,100%)}
#modal .mh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
#modal .mb{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
#modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
#modal textarea,#modal input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--soft)}
#modal textarea{min-height:80px;resize:vertical}
#modal .prev{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
#modal .prev figure{margin:0;display:flex;flex-direction:column;gap:4px} #modal .prev img{width:100%;border-radius:8px;border:1px solid var(--line);background:#000} #modal .prev figcaption{font-family:var(--mono);font-size:11px;color:var(--mute)}
kbd{font-family:var(--mono);font-size:11px;background:var(--soft);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
@media (max-width:820px){
  :root{--side:0px;--strip:122px}
  #side{position:fixed;right:0;top:var(--top);bottom:0;width:min(88vw,330px);z-index:20;transform:translateX(100%);transition:transform .2s;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
  #app.sideopen #side{transform:none} #app{grid-template-columns:1fr} .card{width:160px}
  #top{gap:4px;padding:0 6px} #top .brand{display:none} #stores{border:0;padding-left:0} #top .seg button{padding:5px 7px} #saveshot{padding:6px 8px}
  #toolbar{bottom:8px;padding:4px;gap:4px} #toolbar button{padding:5px 7px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.demo{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--mute)}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">인터뷰 구도 시뮬레이터</div><span class="demo">예시 모드</span>
    <nav id="stores" aria-label="매장"></nav>
    <div class="sp"></div>
    <div class="grp">
      <div class="seg" id="viewseg"><button data-v="cam" class="on">카메라뷰</button><button data-v="edit">편집뷰</button></div>
      <div class="seg accent" id="camseg"><button data-c="A" class="on">A</button><button data-c="B">B</button></div>
    </div>
    <div class="grp">
      <button class="icon ghost" id="undo" title="되돌리기 (Ctrl+Z)"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="icon ghost" id="redo" title="다시 실행 (Ctrl+Y)"><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <button id="saveshot" class="primary" title="Ctrl+S">샷 저장</button>
      <button id="export">내보내기</button>
      <button class="icon ghost" id="fs" title="전체화면 클린 모드 (F)"><svg class="i" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
      <button class="icon ghost" id="sidebtn" title="패널"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
    </div>
  </header>
  <main id="stage">
    <canvas id="gl"></canvas>
    <div id="frame"><div class="grid"></div><div class="cross"></div><div class="vcrop"></div><img class="match" alt=""></div>
    <div id="hud"></div>
    <div id="warn">벽·집기에 막힘</div>
    <div id="toolbar">
      <div class="seg" id="aspseg"><button data-a="16:9" class="on">16:9</button><button data-a="9:16">9:16</button></div>
      <button id="vcropbtn" title="16:9 안의 9:16 크롭 가이드">세로 가이드</button>
      <button id="gridbtn" title="G">그리드</button>
      <button id="crossbtn" title="C">십자</button>
      <button id="ovbtn" title="선택한 레퍼런스 사진 겹쳐 보기 (O)">사진 겹침</button>
    </div>
    <div id="editbar"><button id="topbtn" title="T">탑뷰</button><button id="fitbtn">전체</button></div>
    <div id="pip"><span class="tag">3D</span></div>
    <div id="joy"><div class="pad"><div class="knob"></div></div><div class="ud"><button data-d="1">▲</button><button data-d="-1">▼</button></div></div>
  </main>
  <aside id="side"></aside>
  <section id="shots">
    <div class="hd"><div><b>샷리스트</b><div class="c" id="shotcount">0 · 확정 0</div></div><button class="ghost" id="stripbtn">접기</button></div>
    <div id="cards"></div>
  </section>
</div>
<div id="toast"></div>
<div id="cmenu"></div>
<div id="modal"><div class="box"><div class="mh"><span id="mtitle"></span><button class="icon ghost" id="mclose">✕</button></div><div class="mb" id="mbody"></div><div class="mf" id="mfoot"></div></div></div>
<script type="module">
import * as THREE from 'three';

/* ───── 상수 ───── */
const SENSOR = { w: 35.6, h: 20.0 };            // 소니 FX3 16:9 유효 센서(mm)
const ASPECTS = { '16:9': 16/9, '9:16': 9/16 };

function contactSheet(items) { const cols = Math.min(3, items.length), cw = 640, pad = 24, lab = 44, rows = Math.ceil(items.length / cols); const ch = Math.max(...items.map(it => Math.round(cw * it.canvas.height / it.canvas.width))); const c = document.createElement('canvas'); c.width = cols * (cw + pad) + pad; c.height = rows * (ch + lab + pad) + pad + 60; const x = c.getContext('2d'); x.fillStyle = '#f4f5f7'; x.fillRect(0, 0, c.width, c.height); x.fillStyle = '#171a1f'; x.font = '600 28px IBM Plex Sans KR, sans-serif'; x.fillText(`${L().name} · 인터뷰 샷리스트 · ${new Date().toLocaleDateString('ko-KR')}`, pad, 44); items.forEach((it, i) => { const col = i % cols, rw = Math.floor(i / cols); const ox = pad + col * (cw + pad), oy = 70 + rw * (ch + lab + pad); const h = Math.round(cw * it.canvas.height / it.canvas.width); x.fillStyle = '#000'; x.fillRect(ox, oy, cw, ch); x.drawImage(it.canvas, ox, oy + (ch - h) / 2, cw, h); x.fillStyle = '#171a1f'; x.font = '500 20px IBM Plex Mono, monospace'; x.fillText(it.label, ox, oy + ch + 30); }); return c; }
